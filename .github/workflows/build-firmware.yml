name: Build SIBOAT Firmware

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  ESP32_CORE: "3.3.5"
  ESP32_INDEX_URL: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"

jobs:

  # ============================================================
  # MAIN ESP32
  # ============================================================
  build-main:

    name: Build MAIN ESP32
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Install Arduino CLI
      # --------------------------------------------------------
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # --------------------------------------------------------
      # Install ESP32 Arduino Core 3.3.5
      # --------------------------------------------------------
      - name: Install ESP32 Arduino Core
        shell: bash
        run: |
          set -e

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            "$ESP32_INDEX_URL"

          arduino-cli core update-index \
            --additional-urls "$ESP32_INDEX_URL"

          arduino-cli core install \
            "esp32:esp32@${ESP32_CORE}" \
            --additional-urls "$ESP32_INDEX_URL"

          echo ""
          echo "Installed ESP32 core:"
          arduino-cli core list

      # --------------------------------------------------------
      # Prepare MAIN firmware
      #
      # IMPORTANT:
      # The actual firmware is kept unchanged.
      #
      # Arduino's automatic .ino prototype generation can have
      # trouble with user-defined types such as:
      #   Jw
      #   Motor
      #   EventRec
      #   WsClient
      #
      # Therefore the real firmware is included from a .cpp file
      # through a tiny .ino wrapper.
      #
      # This prevents Arduino's .ino prototype generator from
      # rewriting/prototyping the large firmware file.
      # --------------------------------------------------------
      - name: Prepare MAIN firmware
        shell: bash
        run: |
          set -e

          rm -rf build_work
          mkdir -p build_work/main_sketch build_work/source

          cp \
            A1a_ESP32_MAIN_FIRMWARE_UPDATED_WIFI.ino \
            build_work/source/siboat_main.cpp

          cat > build_work/main_sketch/siboat_main.ino <<'EOF'
          #include "../source/siboat_main.cpp"
          EOF

          echo "MAIN firmware source:"
          ls -lh build_work/source/siboat_main.cpp

          echo ""
          echo "MAIN sketch wrapper:"
          cat build_work/main_sketch/siboat_main.ino

      # --------------------------------------------------------
      # Verify source exists
      # --------------------------------------------------------
      - name: Verify MAIN source
        shell: bash
        run: |
          set -e

          test -f \
            A1a_ESP32_MAIN_FIRMWARE_UPDATED_WIFI.ino

          test -f \
            build_work/source/siboat_main.cpp

          test -f \
            build_work/main_sketch/siboat_main.ino

          echo "MAIN source verification passed."

      # --------------------------------------------------------
      # Compile MAIN
      # --------------------------------------------------------
      - name: Compile MAIN ESP32
        shell: bash
        run: |
          set -o pipefail

          mkdir -p output/main

          echo "=============================================="
          echo "SIBOAT MAIN ESP32 BUILD"
          echo "=============================================="
          echo ""
          echo "Core:"
          echo "$ESP32_CORE"
          echo ""
          echo "Board:"
          echo "esp32:esp32:esp32:PartitionScheme=huge_app"
          echo ""

          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app" \
            --output-dir output/main/build \
            --warnings none \
            --clean \
            build_work/main_sketch \
            2>&1 | tee output/main/compile.log

      # --------------------------------------------------------
      # Find MAIN binaries
      # --------------------------------------------------------
      - name: Collect MAIN binaries
        shell: bash
        run: |
          set -e

          OUT="output/main"
          BUILD="output/main/build"

          echo "Files generated by Arduino:"
          find "$BUILD" -type f | sort

          APP="$(find "$BUILD" -type f \
            -name 'siboat_main.ino.bin' \
            -print -quit)"

          BOOT="$(find "$BUILD" -type f \
            -name '*.bootloader.bin' \
            -print -quit)"

          PART="$(find "$BUILD" -type f \
            -name '*.partitions.bin' \
            -print -quit)"

          if [ -z "$APP" ]; then
            echo "::error::MAIN application BIN was not found."
            exit 1
          fi

          if [ -z "$BOOT" ]; then
            echo "::error::MAIN bootloader BIN was not found."
            exit 1
          fi

          if [ -z "$PART" ]; then
            echo "::error::MAIN partition BIN was not found."
            exit 1
          fi

          BOOT_APP0="$(find \
            "$HOME/.arduino15/packages/esp32" \
            -type f \
            -path '*/tools/partitions/boot_app0.bin' \
            -print -quit)"

          if [ -z "$BOOT_APP0" ]; then
            echo "::error::boot_app0.bin was not found."
            exit 1
          fi

          cp "$APP" "$OUT/SIBOAT_MAIN_ESP32_APP.bin"
          cp "$BOOT" "$OUT/SIBOAT_MAIN_ESP32_BOOTLOADER.bin"
          cp "$PART" "$OUT/SIBOAT_MAIN_ESP32_PARTITIONS.bin"
          cp "$BOOT_APP0" "$OUT/SIBOAT_MAIN_ESP32_BOOT_APP0.bin"

          echo ""
          echo "MAIN binaries:"
          ls -lh "$OUT"/*.bin

          {
            echo "SIBOAT MAIN ESP32 FLASH MAP"
            echo ""
            echo "0x1000  SIBOAT_MAIN_ESP32_BOOTLOADER.bin"
            echo "0x8000  SIBOAT_MAIN_ESP32_PARTITIONS.bin"
            echo "0xE000  SIBOAT_MAIN_ESP32_BOOT_APP0.bin"
            echo "0x10000 SIBOAT_MAIN_ESP32_APP.bin"
            echo ""
            echo "ALL-IN-ONE image:"
            echo "0x0000  SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin"
          } > "$OUT/flash_map.txt"

      # --------------------------------------------------------
      # Install esptool for merged flash image
      # --------------------------------------------------------
      - name: Install esptool
        shell: bash
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            "esptool==5.1.0"

          python3 -m esptool version

      # --------------------------------------------------------
      # Create MAIN ALL-IN-ONE BIN
      #
      # This is the file intended for flashing at address 0x0000.
      # --------------------------------------------------------
      - name: Create MAIN ALL-IN-ONE firmware
        shell: bash
        run: |
          set -e

          OUT="output/main"

          python3 -m esptool \
            --chip esp32 \
            merge-bin \
            -o "$OUT/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin" \
            0x1000 "$OUT/SIBOAT_MAIN_ESP32_BOOTLOADER.bin" \
            0x8000 "$OUT/SIBOAT_MAIN_ESP32_PARTITIONS.bin" \
            0xE000 "$OUT/SIBOAT_MAIN_ESP32_BOOT_APP0.bin" \
            0x10000 "$OUT/SIBOAT_MAIN_ESP32_APP.bin"

          echo ""
          echo "MAIN ALL-IN-ONE:"
          ls -lh "$OUT/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin"

      # --------------------------------------------------------
      # Create MAIN ZIP package
      # --------------------------------------------------------
      - name: Package MAIN firmware
        shell: bash
        run: |
          set -e

          cd output/main

          zip -9 \
            ../SIBOAT_MAIN_ESP32_FLASH_PACKAGE.zip \
            SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin \
            SIBOAT_MAIN_ESP32_APP.bin \
            SIBOAT_MAIN_ESP32_BOOTLOADER.bin \
            SIBOAT_MAIN_ESP32_PARTITIONS.bin \
            SIBOAT_MAIN_ESP32_BOOT_APP0.bin \
            flash_map.txt \
            compile.log

          cd ../..

          echo ""
          echo "MAIN package:"
          ls -lh output/SIBOAT_MAIN_ESP32_FLASH_PACKAGE.zip

      # --------------------------------------------------------
      # Upload MAIN artifact even if later packaging fails
      # --------------------------------------------------------
      - name: Upload MAIN firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_MAIN_ESP32_FIRMWARE
          path: output/main/
          if-no-files-found: warn


  # ============================================================
  # ESP32-CAM
  # ============================================================
  build-cam:

    name: Build ESP32-CAM
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Install Arduino CLI
      # --------------------------------------------------------
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # --------------------------------------------------------
      # Install ESP32 Arduino Core 3.3.5
      # --------------------------------------------------------
      - name: Install ESP32 Arduino Core
        shell: bash
        run: |
          set -e

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            "$ESP32_INDEX_URL"

          arduino-cli core update-index \
            --additional-urls "$ESP32_INDEX_URL"

          arduino-cli core install \
            "esp32:esp32@${ESP32_CORE}" \
            --additional-urls "$ESP32_INDEX_URL"

          echo ""
          arduino-cli core list

      # --------------------------------------------------------
      # Install SIBOAT Edge Impulse library
      # --------------------------------------------------------
      - name: Install SIBOAT Edge Impulse library
        shell: bash
        run: |
          set -e

          rm -rf build_work
          mkdir -p build_work/cam_sketch
          mkdir -p build_work/source
          mkdir -p build_work/libs

          test -f siboat_inferencing.zip

          echo "Extracting:"
          echo "siboat_inferencing.zip"

          unzip -q \
            siboat_inferencing.zip \
            -d build_work/libs

          echo ""
          echo "Extracted library files:"
          find build_work/libs -maxdepth 4 -type f | sort | head -200

          LIBDIR="$(find \
            build_work/libs \
            -type f \
            -name library.properties \
            -not -path '*/examples/*' \
            -print -quit \
            | xargs -r dirname)"

          if [ -z "$LIBDIR" ]; then
            echo "::error::library.properties was not found."
            exit 1
          fi

          echo ""
          echo "Detected Edge Impulse library:"
          echo "$LIBDIR"

          HEADER="$(find \
            "$LIBDIR" \
            -type f \
            -name siboat_inferencing.h \
            -print -quit)"

          IMAGE_HPP="$(find \
            "$LIBDIR" \
            -type f \
            -path '*/edge-impulse-sdk/dsp/image/image.hpp' \
            -print -quit)"

          if [ -z "$HEADER" ]; then
            echo "::error::siboat_inferencing.h was not found."
            exit 1
          fi

          if [ -z "$IMAGE_HPP" ]; then
            echo "::error::edge-impulse-sdk/dsp/image/image.hpp was not found."
            exit 1
          fi

          echo ""
          echo "Inference header:"
          echo "$HEADER"

          echo ""
          echo "Image header:"
          echo "$IMAGE_HPP"

          # Put the library at a clean Arduino custom-library root.
          rm -rf build_work/library
          mkdir -p build_work/library/siboat_inferencing

          cp -R "$LIBDIR"/. \
            build_work/library/siboat_inferencing/

          echo ""
          echo "Installed SIBOAT library:"
          find build_work/library/siboat_inferencing \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -200

      # --------------------------------------------------------
      # Prepare CAM firmware
      #
      # Same .cpp-wrapper technique as the MAIN firmware.
      # --------------------------------------------------------
      - name: Prepare CAM firmware
        shell: bash
        run: |
          set -e

          cp \
            A1b_ESP32_CAM_FIRMWARE_UPDATED_WIFI.ino \
            build_work/source/siboat_cam.cpp

          cat > build_work/cam_sketch/siboat_cam.ino <<'EOF'
          #include "../source/siboat_cam.cpp"
          EOF

          test -f build_work/source/siboat_cam.cpp
          test -f build_work/cam_sketch/siboat_cam.ino

      # --------------------------------------------------------
      # Compile ESP32-CAM
      # --------------------------------------------------------
      - name: Compile ESP32-CAM
        shell: bash
        run: |
          set -o pipefail

          mkdir -p output/cam

          echo "=============================================="
          echo "SIBOAT ESP32-CAM BUILD"
          echo "=============================================="
          echo ""
          echo "Core:"
          echo "$ESP32_CORE"
          echo ""
          echo "Board:"
          echo "esp32:esp32:esp32cam:PartitionScheme=huge_app"
          echo ""

          arduino-cli compile \
            --fqbn "esp32:esp32:esp32cam:PartitionScheme=huge_app" \
            --library "$PWD/build_work/library/siboat_inferencing" \
            --output-dir output/cam/build \
            --warnings none \
            --clean \
            build_work/cam_sketch \
            2>&1 | tee output/cam/compile.log

      # --------------------------------------------------------
      # Collect CAM binaries
      # --------------------------------------------------------
      - name: Collect CAM binaries
        shell: bash
        run: |
          set -e

          OUT="output/cam"
          BUILD="output/cam/build"

          echo "Files generated by Arduino:"
          find "$BUILD" -type f | sort

          APP="$(find "$BUILD" -type f \
            -name 'siboat_cam.ino.bin' \
            -print -quit)"

          BOOT="$(find "$BUILD" -type f \
            -name '*.bootloader.bin' \
            -print -quit)"

          PART="$(find "$BUILD" -type f \
            -name '*.partitions.bin' \
            -print -quit)"

          if [ -z "$APP" ]; then
            echo "::error::CAM application BIN was not found."
            exit 1
          fi

          if [ -z "$BOOT" ]; then
            echo "::error::CAM bootloader BIN was not found."
            exit 1
          fi

          if [ -z "$PART" ]; then
            echo "::error::CAM partition BIN was not found."
            exit 1
          fi

          BOOT_APP0="$(find \
            "$HOME/.arduino15/packages/esp32" \
            -type f \
            -path '*/tools/partitions/boot_app0.bin' \
            -print -quit)"

          if [ -z "$BOOT_APP0" ]; then
            echo "::error::boot_app0.bin was not found."
            exit 1
          fi

          cp "$APP" "$OUT/SIBOAT_ESP32_CAM_APP.bin"
          cp "$BOOT" "$OUT/SIBOAT_ESP32_CAM_BOOTLOADER.bin"
          cp "$PART" "$OUT/SIBOAT_ESP32_CAM_PARTITIONS.bin"
          cp "$BOOT_APP0" "$OUT/SIBOAT_ESP32_CAM_BOOT_APP0.bin"

          echo ""
          echo "CAM binaries:"
          ls -lh "$OUT"/*.bin

          {
            echo "SIBOAT ESP32-CAM FLASH MAP"
            echo ""
            echo "0x1000  SIBOAT_ESP32_CAM_BOOTLOADER.bin"
            echo "0x8000  SIBOAT_ESP32_CAM_PARTITIONS.bin"
            echo "0xE000  SIBOAT_ESP32_CAM_BOOT_APP0.bin"
            echo "0x10000 SIBOAT_ESP32_CAM_APP.bin"
            echo ""
            echo "ALL-IN-ONE image:"
            echo "0x0000  SIBOAT_ESP32_CAM_ALL-IN-ONE.bin"
          } > "$OUT/flash_map.txt"

      # --------------------------------------------------------
      # Install esptool
      # --------------------------------------------------------
      - name: Install esptool
        shell: bash
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            "esptool==5.1.0"

          python3 -m esptool version

      # --------------------------------------------------------
      # Create CAM ALL-IN-ONE BIN
      # --------------------------------------------------------
      - name: Create CAM ALL-IN-ONE firmware
        shell: bash
        run: |
          set -e

          OUT="output/cam"

          python3 -m esptool \
            --chip esp32 \
            merge-bin \
            -o "$OUT/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin" \
            0x1000 "$OUT/SIBOAT_ESP32_CAM_BOOTLOADER.bin" \
            0x8000 "$OUT/SIBOAT_ESP32_CAM_PARTITIONS.bin" \
            0xE000 "$OUT/SIBOAT_ESP32_CAM_BOOT_APP0.bin" \
            0x10000 "$OUT/SIBOAT_ESP32_CAM_APP.bin"

          echo ""
          echo "CAM ALL-IN-ONE:"
          ls -lh "$OUT/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin"

      # --------------------------------------------------------
      # Package CAM firmware
      # --------------------------------------------------------
      - name: Package CAM firmware
        shell: bash
        run: |
          set -e

          cd output/cam

          zip -9 \
            ../SIBOAT_ESP32_CAM_FLASH_PACKAGE.zip \
            SIBOAT_ESP32_CAM_ALL-IN-ONE.bin \
            SIBOAT_ESP32_CAM_APP.bin \
            SIBOAT_ESP32_CAM_BOOTLOADER.bin \
            SIBOAT_ESP32_CAM_PARTITIONS.bin \
            SIBOAT_ESP32_CAM_BOOT_APP0.bin \
            flash_map.txt \
            compile.log

          cd ../..

          echo ""
          echo "CAM package:"
          ls -lh output/SIBOAT_ESP32_CAM_FLASH_PACKAGE.zip

      # --------------------------------------------------------
      # Upload CAM artifact even when packaging fails
      # --------------------------------------------------------
      - name: Upload CAM firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_ESP32_CAM_FIRMWARE
          path: output/cam/
          if-no-files-found: warn
