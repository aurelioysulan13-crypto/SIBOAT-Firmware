# =============================================================================
# SIBOAT firmware builder
# Main ESP32 + ESP32-CAM
#
# Repository workflow:
#   .github/workflows/build-firmware.yml
#
# This workflow:
#   1. Finds the EXACT SIBOAT firmware files.
#   2. Installs Arduino-ESP32 2.0.17 by default.
#   3. Installs the SIBOAT Edge Impulse Arduino library for the ESP32-CAM.
#   4. Compiles both boards independently.
#   5. Exports the compiled binaries.
#   6. Creates an ALL-IN-ONE .bin file for flashing at address 0x0.
#   7. Uploads one GitHub Actions artifact per board.
#
# IMPORTANT:
#   - The workflow COMPILES the firmware.
#   - You manually download the generated artifact.
#   - You manually flash the ESP32 boards.
# =============================================================================

name: Build SIBOAT firmware

on:
  push:

  workflow_dispatch:
    inputs:
      esp32_core:
        description: 'Arduino-ESP32 core version'
        required: false
        default: '2.0.17'
        type: string

permissions:
  contents: read

env:
  ESP32_CORE: ${{ inputs.esp32_core || '2.0.17' }}
  ESP32_INDEX_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:

  # ===========================================================================
  # BUILD BOTH FIRMWARES
  # ===========================================================================

  build:

    name: Build ${{ matrix.label }}

    runs-on: ubuntu-latest

    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false

      matrix:
        include:

          # -------------------------------------------------------------------
          # Firmware 1
          # Main SIBOAT controller
          # ESP32 Dev Module / NodeMCU ESP-32S
          # -------------------------------------------------------------------

          - label: SIBOAT_MAIN_ESP32

            sketch_dir: siboat_main

            # EXACT filename.
            # This prevents GitHub from accidentally compiling an older
            # A1a firmware if more than one A1a .ino exists in the repository.
            sketch_file: A1a_ESP32_MAIN_FIRMWARE_UPDATED_WIFI.ino

            fqbn: 'esp32:esp32:esp32:PartitionScheme=huge_app'

            needs_edge_impulse: 'false'

            check_psram: 'false'


          # -------------------------------------------------------------------
          # Firmware 2
          # AI Thinker ESP32-CAM
          # -------------------------------------------------------------------

          - label: SIBOAT_ESP32_CAM

            sketch_dir: siboat_cam

            # EXACT filename.
            # This prevents GitHub from accidentally compiling an older
            # A1b firmware if more than one A1b .ino exists in the repository.
            sketch_file: A1b_ESP32_CAM_FIRMWARE_UPDATED_WIFI.ino

            # Explicitly use Huge APP.
            # This is important for the Edge Impulse camera firmware.
            fqbn: 'esp32:esp32:esp32cam:PartitionScheme=huge_app'

            needs_edge_impulse: 'true'

            check_psram: 'true'


    steps:

      # =======================================================================
      # 1. GET REPOSITORY
      # =======================================================================

      - name: Get repository code
        uses: actions/checkout@v6


      # =======================================================================
      # 2. INSTALL ARDUINO CLI
      # =======================================================================

      - name: Install arduino-cli
        run: |

          mkdir -p "$HOME/.local/bin"

          curl -fsSL \
            https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR="$HOME/.local/bin" sh

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          arduino-cli version


      # =======================================================================
      # 3. RESTORE ARDUINO ESP32 CORE CACHE
      # =======================================================================

      - name: Restore cached ESP32 core
        id: core-cache

        uses: actions/cache/restore@v5

        with:
          path: ~/.arduino15/packages

          key: arduino-packages-esp32-${{ env.ESP32_CORE }}-${{ runner.os }}-v2


      # =======================================================================
      # 4. INSTALL ARDUINO ESP32 CORE
      # =======================================================================

      - name: Install Arduino ESP32 core
        run: |

          echo "Installing Arduino-ESP32 core:"
          echo "esp32:esp32@${ESP32_CORE}"

          arduino-cli core update-index \
            --additional-urls "$ESP32_INDEX_URL"

          arduino-cli core install \
            "esp32:esp32@${ESP32_CORE}" \
            --additional-urls "$ESP32_INDEX_URL"

          echo ""
          echo "Installed cores:"
          arduino-cli core list


      # =======================================================================
      # 5. SAVE CORE CACHE
      # =======================================================================

      - name: Save ESP32 core cache

        if: steps.core-cache.outputs.cache-hit != 'true'

        uses: actions/cache/save@v5

        with:
          path: ~/.arduino15/packages

          key: arduino-packages-esp32-${{ env.ESP32_CORE }}-${{ runner.os }}-v2


      # =======================================================================
      # 6. FIND EXACT FIRMWARE
      # =======================================================================

      - name: Find exact firmware file

        env:
          SKETCH_FILE: ${{ matrix.sketch_file }}
          SKETCH_DIR: ${{ matrix.sketch_dir }}

        run: |

          echo "Looking for exact firmware:"
          echo "$SKETCH_FILE"

          mapfile -t MATCHES < <(
            find . \
              -type f \
              -name "$SKETCH_FILE" \
              -not -path './.git/*' \
              | sort
          )

          # ---------------------------------------------------------------
          # File must exist.
          # ---------------------------------------------------------------

          if [ "${#MATCHES[@]}" -eq 0 ]; then

            echo "::error::Required firmware file was not found:"
            echo "$SKETCH_FILE"

            echo ""
            echo "All .ino files currently in the repository:"

            find . \
              -type f \
              -name '*.ino' \
              -not -path './.git/*' \
              | sort

            exit 1

          fi


          # ---------------------------------------------------------------
          # There MUST NOT be multiple copies of the exact same firmware.
          # ---------------------------------------------------------------

          if [ "${#MATCHES[@]}" -gt 1 ]; then

            echo "::error::More than one exact copy of $SKETCH_FILE was found."

            printf 'Found:\n'

            printf '  %s\n' "${MATCHES[@]}"

            echo ""
            echo "Keep only one copy of the firmware in the repository."

            exit 1

          fi


          SOURCE="${MATCHES[0]}"

          echo ""
          echo "Using firmware:"
          echo "$SOURCE"


          # ---------------------------------------------------------------
          # Arduino CLI requires the sketch folder name to match the .ino
          # filename.
          #
          # We therefore create:
          #
          # _build/siboat_main/siboat_main.ino
          #
          # or:
          #
          # _build/siboat_cam/siboat_cam.ino
          # ---------------------------------------------------------------

          mkdir -p "_build/$SKETCH_DIR"

          cp "$SOURCE" "_build/$SKETCH_DIR/$SKETCH_DIR.ino"


          echo ""
          echo "Build copy:"
          echo "_build/$SKETCH_DIR/$SKETCH_DIR.ino"


      # =======================================================================
      # 7. INSTALL EDGE IMPULSE LIBRARY
      #    CAMERA ONLY
      # =======================================================================

      - name: Install SIBOAT Edge Impulse library

        if: matrix.needs_edge_impulse == 'true'

        env:
          SKETCH_DIR: ${{ matrix.sketch_dir }}

        run: |

          LIBROOT="$RUNNER_TEMP/siboat-libs"

          rm -rf "$LIBROOT"

          mkdir -p "$LIBROOT"

          FOUND=0


          echo "Searching repository for the SIBOAT Edge Impulse Arduino ZIP..."

          while IFS= read -r ZIP; do

            NAMES="$(unzip -Z1 "$ZIP" 2>/dev/null || true)"

            if grep -qi '_inferencing\.h' <<< "$NAMES"; then

              echo ""
              echo "Using Edge Impulse library ZIP:"
              echo "$ZIP"

              unzip -q -o "$ZIP" -d "$LIBROOT"

              FOUND=1

              break

            fi

          done < <(
            find . \
              -type f \
              -iname '*.zip' \
              -not -path './.git/*' \
              | sort
          )


          # ---------------------------------------------------------------
          # ZIP must exist.
          # ---------------------------------------------------------------

          if [ "$FOUND" -ne 1 ]; then

            echo "::error::SIBOAT Edge Impulse Arduino library ZIP was not found."

            echo ""
            echo "The ZIP must contain:"
            echo "  siboat_inferencing.h"
            echo "  edge-impulse-sdk/"
            echo "  library.properties"

            exit 1

          fi


          # ---------------------------------------------------------------
          # Find Arduino library.properties
          # ---------------------------------------------------------------

          mapfile -t PROPS < <(
            find "$LIBROOT" \
              -type f \
              -name library.properties \
              -not -path '*/examples/*' \
              | sort
          )


          if [ "${#PROPS[@]}" -eq 0 ]; then

            echo "::error::The Edge Impulse ZIP does not contain library.properties."

            exit 1

          fi


          LIBDIR="$(dirname "${PROPS[0]}")"


          echo ""
          echo "Edge Impulse library folder:"
          echo "$LIBDIR"


          # ---------------------------------------------------------------
          # Verify required files.
          # ---------------------------------------------------------------

          REQUIRED_HEADER="$LIBDIR/src/siboat_inferencing.h"

          REQUIRED_EI="$LIBDIR/src/edge-impulse-sdk/dsp/image/image.hpp"


          if [ ! -f "$REQUIRED_HEADER" ]; then

            echo "::error::siboat_inferencing.h was not found."

            echo ""
            echo "Expected:"
            echo "$REQUIRED_HEADER"

            exit 1

          fi


          if [ ! -f "$REQUIRED_EI" ]; then

            echo "::error::Edge Impulse image.hpp was not found."

            echo ""
            echo "Expected:"
            echo "$REQUIRED_EI"

            exit 1

          fi


          echo ""
          echo "Edge Impulse library verification PASSED."


          # ---------------------------------------------------------------
          # Make library location available to later workflow steps.
          # ---------------------------------------------------------------

          echo "SIBOAT_LIB_DIR=$LIBDIR" >> "$GITHUB_ENV"


          # ---------------------------------------------------------------
          # The firmware contains an optional __has_include guard.
          #
          # Remove it only from the temporary BUILD COPY.
          # The original firmware in the repository is never modified.
          # ---------------------------------------------------------------

          perl -0pi -e \
            's/#if defined\(__has_include\)\s*#if !__has_include\(<siboat_inferencing\.h>\)\s*#error[^\n]*\n\s*#endif\s*#endif\n//' \
            "_build/$SKETCH_DIR/$SKETCH_DIR.ino"


          echo ""
          echo "Camera build preparation complete."


      # =======================================================================
      # 8. DISPLAY BOARD CONFIGURATION
      # =======================================================================

      - name: Verify board configuration

        continue-on-error: true

        env:
          FQBN: ${{ matrix.fqbn }}
          SKETCH_DIR: ${{ matrix.sketch_dir }}
          CHECK_PSRAM: ${{ matrix.check_psram }}

        run: |

          echo "Board:"
          echo "$FQBN"

          echo ""

          echo "Arduino-ESP32 core:"
          echo "$ESP32_CORE"

          echo ""

          PROPS="$(
            arduino-cli compile \
              --fqbn "$FQBN" \
              --show-properties \
              "_build/$SKETCH_DIR" \
              2>&1 || true
          )"


          echo "Relevant board properties:"

          grep -E \
            '^(build\.(partitions|flash_mode|flash_freq|flash_size|defines|extra_flags|psram_type|memory_type)|upload\.maximum_size)=' \
            <<< "$PROPS" \
            || true


          # ---------------------------------------------------------------
          # ESP32-CAM PSRAM check
          # ---------------------------------------------------------------

          if [ "$CHECK_PSRAM" = "true" ]; then

            if grep -q 'BOARD_HAS_PSRAM' <<< "$PROPS"; then

              echo ""
              echo "PSRAM configuration detected."

            else

              echo ""
              echo "::warning::BOARD_HAS_PSRAM was not detected."

              echo "The ESP32-CAM firmware requires PSRAM."

            fi

          fi


      # =======================================================================
      # 9. COMPILE
      # =======================================================================

      - name: Compile firmware

        env:
          FQBN: ${{ matrix.fqbn }}
          SKETCH_DIR: ${{ matrix.sketch_dir }}

        run: |

          echo "============================================================"
          echo "SIBOAT FIRMWARE BUILD"
          echo "============================================================"

          echo ""
          echo "Firmware:"
          echo "${{ matrix.label }}"

          echo ""

          echo "Board:"
          echo "$FQBN"

          echo ""

          echo "ESP32 core:"
          echo "$ESP32_CORE"

          echo ""
          echo "============================================================"


          LIBARGS=()


          # ---------------------------------------------------------------
          # Add Edge Impulse library only for the camera.
          # ---------------------------------------------------------------

          if [ -n "${SIBOAT_LIB_DIR:-}" ]; then

            LIBARGS=(
              --library
              "$SIBOAT_LIB_DIR"
            )

          fi


          # ---------------------------------------------------------------
          # Compile.
          # --export-binaries places exported binaries in the sketch folder.
          # ---------------------------------------------------------------

          arduino-cli compile \
            --fqbn "$FQBN" \
            "${LIBARGS[@]}" \
            --export-binaries \
            --warnings none \
            "_build/$SKETCH_DIR" \
            2>&1 | tee compile.log


          echo ""
          echo "Compilation completed successfully."


      # =======================================================================
      # 10. VERIFY COMPILED BINARIES
      # =======================================================================

      - name: Verify compiled binaries

        env:
          SKETCH_DIR: ${{ matrix.sketch_dir }}

        run: |

          BUILD="_build/$SKETCH_DIR"


          echo "Searching for exported binaries in:"
          echo "$BUILD"

          echo ""

          find "$BUILD" \
            -type f \
            \( \
              -name '*.bin' \
              -o -name '*.elf' \
              -o -name '*.map' \
            \) \
            | sort


          APP="$(find "$BUILD" -maxdepth 1 -type f -name "$SKETCH_DIR.ino.bin" -print -quit)"


          if [ -z "$APP" ]; then

            echo "::error::The Arduino compiler did not export the application .bin file."

            echo ""
            echo "Expected:"
            echo "$BUILD/$SKETCH_DIR.ino.bin"

            echo ""
            echo "Files actually produced:"

            find "$BUILD" -type f | sort

            exit 1

          fi


          echo ""
          echo "Application binary found:"
          echo "$APP"

          ls -lh "$APP"


      # =======================================================================
      # 11. COLLECT AND CREATE ALL-IN-ONE FLASH IMAGE
      # =======================================================================

      - name: Create firmware package

        env:
          LABEL: ${{ matrix.label }}
          FQBN: ${{ matrix.fqbn }}
          SKETCH_DIR: ${{ matrix.sketch_dir }}

        run: |

          OUT="dist/$LABEL"

          # IMPORTANT:
          # --export-binaries places the files directly in the sketch folder.
          BUILD="_build/$SKETCH_DIR"


          mkdir -p "$OUT/separate-parts"


          echo "============================================================"
          echo "EXPORTED COMPILER FILES"
          echo "============================================================"

          find "$BUILD" -type f | sort


          # -----------------------------------------------------------------
          # Find compiler outputs.
          # -----------------------------------------------------------------

          MERGED="$(
            find "$BUILD" \
              -maxdepth 1 \
              -type f \
              -name '*.merged.bin' \
              -print \
              -quit
          )"


          APP="$(
            find "$BUILD" \
              -maxdepth 1 \
              -type f \
              -name "$SKETCH_DIR.ino.bin" \
              -print \
              -quit
          )"


          BOOT="$(
            find "$BUILD" \
              -maxdepth 1 \
              -type f \
              -name '*.bootloader.bin' \
              -print \
              -quit
          )"


          PART="$(
            find "$BUILD" \
              -maxdepth 1 \
              -type f \
              -name '*.partitions.bin' \
              -print \
              -quit
          )"


          BOOTAPP0="$HOME/.arduino15/packages/esp32/hardware/esp32/$ESP32_CORE/tools/partitions/boot_app0.bin"


          ALLINONE="$OUT/${LABEL}_ALL-IN-ONE_flash-at-0x0.bin"


          # -----------------------------------------------------------------
          # Application binary is mandatory.
          # -----------------------------------------------------------------

          if [ -z "$APP" ]; then

            echo "::error::No application .bin file was produced."

            exit 1

          fi


          # -----------------------------------------------------------------
          # Copy separate binaries.
          # -----------------------------------------------------------------

          cp "$APP" "$OUT/separate-parts/"


          if [ -n "$BOOT" ] && [ -f "$BOOT" ]; then

            cp "$BOOT" "$OUT/separate-parts/"

          fi


          if [ -n "$PART" ] && [ -f "$PART" ]; then

            cp "$PART" "$OUT/separate-parts/"

          fi


          if [ -f "$BOOTAPP0" ]; then

            cp "$BOOTAPP0" "$OUT/separate-parts/"

          fi


          # -----------------------------------------------------------------
          # Use compiler-generated merged image if available.
          # -----------------------------------------------------------------

          if [ -n "$MERGED" ] && [ -f "$MERGED" ]; then

            echo "Using compiler-generated merged binary."

            cp "$MERGED" "$ALLINONE"


          # -----------------------------------------------------------------
          # Otherwise create our own merged image.
          # -----------------------------------------------------------------

          elif \
            [ -n "$BOOT" ] && [ -f "$BOOT" ] && \
            [ -n "$PART" ] && [ -f "$PART" ] && \
            [ -f "$BOOTAPP0" ]; then


            echo "Compiler did not produce a merged binary."

            echo "Creating ALL-IN-ONE image with esptool."


            python3 -m venv /tmp/esptool-venv


            /tmp/esptool-venv/bin/pip install \
              --quiet \
              "esptool>=5"


            /tmp/esptool-venv/bin/python \
              -m esptool \
              --chip esp32 \
              merge-bin \
              -o "$ALLINONE" \
              0x1000 "$BOOT" \
              0x8000 "$PART" \
              0xe000 "$BOOTAPP0" \
              0x10000 "$APP"


          else

            echo "::error::Unable to create ALL-IN-ONE firmware image."

            echo ""
            echo "Bootloader:"
            echo "${BOOT:-NOT FOUND}"

            echo ""
            echo "Partitions:"
            echo "${PART:-NOT FOUND}"

            echo ""
            echo "boot_app0:"
            echo "$BOOTAPP0"

            exit 1

          fi


          # -----------------------------------------------------------------
          # Verify ALL-IN-ONE image.
          # -----------------------------------------------------------------

          if [ ! -f "$ALLINONE" ]; then

            echo "::error::ALL-IN-ONE firmware image was not created."

            exit 1

          fi


          echo ""
          echo "ALL-IN-ONE firmware:"
          echo "$ALLINONE"

          ls -lh "$ALLINONE"


          # -----------------------------------------------------------------
          # Build metadata.
          # -----------------------------------------------------------------

          BUILT="$(date -u '+%Y-%m-%d %H:%M UTC')"

          SHA="${GITHUB_SHA:0:7}"

          FLASHFILE="${LABEL}_ALL-IN-ONE_flash-at-0x0.bin"


          # -----------------------------------------------------------------
          # README
          # -----------------------------------------------------------------

          {
            echo "============================================================"
            echo "SIBOAT FIRMWARE BUILD"
            echo "============================================================"
            echo ""
            echo "Firmware: $LABEL"
            echo "Built:    $BUILT"
            echo "Commit:   $SHA"
            echo "Core:     esp32:esp32@$ESP32_CORE"
            echo "Board:    $FQBN"
            echo ""
            echo "============================================================"
            echo "WHAT TO FLASH"
            echo "============================================================"
            echo ""
            echo "$FLASHFILE"
            echo ""
            echo "Flash the ALL-IN-ONE file at address:"
            echo ""
            echo "0x0"
            echo ""
            echo "============================================================"
            echo "ESPTOOL"
            echo "============================================================"
            echo ""
            echo "python -m esptool --chip esp32 --baud 460800 write_flash 0x0 $FLASHFILE"
            echo ""
            echo "If 460800 fails, retry at 115200."
            echo ""
            echo "============================================================"
            echo "BROWSER FLASHING"
            echo "============================================================"
            echo ""
            echo "Use Espressif esptool-js:"
            echo "https://espressif.github.io/esptool-js/"
            echo ""
            echo "Connect the board."
            echo "Select the ALL-IN-ONE .bin file."
            echo "Set flash address to:"
            echo "0x0"
            echo ""
            echo "Then program the board."
            echo ""
            echo "============================================================"
            echo "ESP32-CAM FLASHING"
            echo "============================================================"
            echo ""
            echo "If your programmer does not automatically enter download mode:"
            echo ""
            echo "1. Connect GPIO0 to GND."
            echo "2. Press RESET."
            echo "3. Flash the firmware."
            echo "4. Remove GPIO0 from GND."
            echo "5. Press RESET again."
            echo ""
            echo "============================================================"
            echo "SEPARATE BINARIES"
            echo "============================================================"
            echo ""
            echo "Only use these if the ALL-IN-ONE image cannot be used:"
            echo ""
            echo "0x1000   bootloader.bin"
            echo "0x8000   partitions.bin"
            echo "0xe000   boot_app0.bin"
            echo "0x10000  application .ino.bin"
            echo ""
            echo "============================================================"
            echo "SIBOAT WIFI"
            echo "============================================================"
            echo ""
            echo "Profile 1: SIBOAT"
            echo "Profile 2: Private Wifi"
            echo "Profile 3: Not configured"
            echo "Profile 4: Not configured"
            echo ""
            echo "The ESP32 firmware selects the available configured"
            echo "Wi-Fi profile automatically."
            echo ""
            echo "The dashboard does not select the ESP32 Wi-Fi network."
            echo "The phone/tablet running the dashboard must be connected"
            echo "to the same local network as the ESP32."
            echo ""
          } > "$OUT/READ_ME_FIRST.txt"


          # -----------------------------------------------------------------
          # Display final package.
          # -----------------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "FINAL FIRMWARE PACKAGE"
          echo "============================================================"

          find "$OUT" \
            -maxdepth 2 \
            -type f \
            -printf '%p  %s bytes\n' \
            | sort


      # =======================================================================
      # 12. WRITE GITHUB BUILD SUMMARY
      # =======================================================================

      - name: Write build summary

        if: always()

        env:
          LABEL: ${{ matrix.label }}

        run: |

          {
            echo "### $LABEL"
            echo ""
            echo "**Arduino-ESP32 core:** \`$ESP32_CORE\`"
            echo ""
            echo "**Board:** \`${{ matrix.fqbn }}\`"
            echo ""
            echo "**Firmware:** \`${{ matrix.sketch_file }}\`"
            echo ""
            echo '```'

            grep \
              -E 'Sketch uses|Global variables use' \
              compile.log \
              2>/dev/null \
              || echo "(no size information - see Compile step log)"

            echo '```'

          } >> "$GITHUB_STEP_SUMMARY"


      # =======================================================================
      # 13. UPLOAD GITHUB ARTIFACT
      # =======================================================================

      - name: Upload firmware artifact

        uses: actions/upload-artifact@v6

        with:

          name: ${{ matrix.label }}_firmware

          path: dist/${{ matrix.label }}

          if-no-files-found: error

          retention-days: 30
