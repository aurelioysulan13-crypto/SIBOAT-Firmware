name: Build SIBOAT Firmware

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  ESP32_CORE: "3.3.5"
  ESP32_INDEX_URL: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
  ARDUINO_UPDATER_ENABLE_NOTIFICATION: "false"

jobs:

  # ==========================================================
  # MAIN ESP32
  # ==========================================================
  build-main:
    name: Build MAIN ESP32
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install ESP32 Arduino core
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            "$ESP32_INDEX_URL"

          arduino-cli core update-index \
            --additional-urls "$ESP32_INDEX_URL"

          arduino-cli core install \
            "esp32:esp32@${ESP32_CORE}" \
            --additional-urls "$ESP32_INDEX_URL"

          echo "Installed ESP32 core:"
          arduino-cli core list

      - name: Verify MAIN firmware
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED.ino"

          test -f "$SOURCE"

          python3 - "$SOURCE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          profiles = [
              '{ "SIBOAT NETWORK",',
              '{ "bleach.",',
              '{ "Private Wifi",',
          ]

          positions = []

          for token in profiles:
              position = text.find(token)

              if position < 0:
                  raise SystemExit(
                      f"Missing Wi-Fi profile in {path.name}: {token}"
                  )

              positions.append(position)

          if positions != sorted(positions):
              raise SystemExit(
                  "Wi-Fi profile order must be "
                  "SIBOAT NETWORK -> bleach. -> Private Wifi"
              )

          print("MAIN firmware verification passed.")
          print("Wi-Fi order: SIBOAT NETWORK -> bleach. -> Private Wifi")
          PY

      - name: Prepare MAIN sketch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build_work output/main

          mkdir -p \
            build_work/siboat_main \
            build_work/source \
            output/main/build

          cp \
            A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED.ino \
            build_work/source/siboat_main.cpp

          cat > build_work/siboat_main/siboat_main.ino <<'EOF'
          #include "../source/siboat_main.cpp"
          EOF

          test -f build_work/siboat_main/siboat_main.ino
          test -f build_work/source/siboat_main.cpp

      - name: Compile MAIN ESP32
        shell: bash
        run: |
          set -euo pipefail

          FQBN="esp32:esp32:esp32:PartitionScheme=huge_app"
          LOG="output/main/compile.log"

          mkdir -p output/main

          echo "==============================================" | tee "$LOG"
          echo "SIBOAT MAIN ESP32 BUILD" | tee -a "$LOG"
          echo "==============================================" | tee -a "$LOG"
          echo "Arduino-ESP32 core: $ESP32_CORE" | tee -a "$LOG"
          echo "FQBN: $FQBN" | tee -a "$LOG"
          echo "" | tee -a "$LOG"

          arduino-cli compile \
            --fqbn "$FQBN" \
            --output-dir output/main/build \
            --export-binaries \
            --warnings none \
            --clean \
            build_work/siboat_main \
            2>&1 | tee -a "$LOG"

      - name: Collect MAIN binaries
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/main"
          BUILD="$OUT/build"

          APP="$BUILD/siboat_main.ino.bin"
          BOOT="$BUILD/siboat_main.ino.bootloader.bin"
          PART="$BUILD/siboat_main.ino.partitions.bin"

          BOOT_APP0="$(
            find "$HOME/.arduino15/packages/esp32" \
              -type f \
              -path '*/tools/partitions/boot_app0.bin' \
              -print \
              -quit
          )"

          test -s "$APP"
          test -s "$BOOT"
          test -s "$PART"
          test -s "$BOOT_APP0"

          cp "$APP" \
            "$OUT/SIBOAT_MAIN_ESP32_APP.bin"

          cp "$BOOT" \
            "$OUT/SIBOAT_MAIN_ESP32_BOOTLOADER.bin"

          cp "$PART" \
            "$OUT/SIBOAT_MAIN_ESP32_PARTITIONS.bin"

          cp "$BOOT_APP0" \
            "$OUT/SIBOAT_MAIN_ESP32_BOOT_APP0.bin"

          cat > "$OUT/build_info.txt" <<EOF
          SIBOAT MAIN ESP32 BUILD

          Git commit:
          $GITHUB_SHA

          Arduino-ESP32:
          $ESP32_CORE

          FQBN:
          esp32:esp32:esp32:PartitionScheme=huge_app

          Source:
          A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED.ino

          Wi-Fi profile order:
          1. SIBOAT NETWORK
          2. bleach.
          3. Private Wifi
          EOF

      - name: Install esptool
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install \
            --disable-pip-version-check \
            esptool

          python3 -m esptool version

      - name: Create MAIN all-in-one firmware
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/main"

          python3 -m esptool \
            --chip esp32 \
            merge-bin \
            -o "$OUT/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin" \
            0x1000 "$OUT/SIBOAT_MAIN_ESP32_BOOTLOADER.bin" \
            0x8000 "$OUT/SIBOAT_MAIN_ESP32_PARTITIONS.bin" \
            0xE000 "$OUT/SIBOAT_MAIN_ESP32_BOOT_APP0.bin" \
            0x10000 "$OUT/SIBOAT_MAIN_ESP32_APP.bin"

          test -s \
            "$OUT/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin"

      - name: Create MAIN flash map
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          cat > output/main/flash_map.txt <<'EOF'
          SIBOAT MAIN ESP32 FLASH MAP

          Individual binaries:

          Bootloader:
          SIBOAT_MAIN_ESP32_BOOTLOADER.bin
          Address: 0x1000

          Partition table:
          SIBOAT_MAIN_ESP32_PARTITIONS.bin
          Address: 0x8000

          boot_app0:
          SIBOAT_MAIN_ESP32_BOOT_APP0.bin
          Address: 0xE000

          Application:
          SIBOAT_MAIN_ESP32_APP.bin
          Address: 0x10000

          All-in-one:
          SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin
          Address: 0x0000
          EOF

      - name: Package MAIN firmware
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          cd output/main

          zip -9 \
            ../SIBOAT_MAIN_ESP32_FLASH_PACKAGE.zip \
            *.bin \
            flash_map.txt \
            build_info.txt \
            compile.log

          cd ../..

          test -s \
            output/SIBOAT_MAIN_ESP32_FLASH_PACKAGE.zip

      - name: Upload MAIN firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_MAIN_ESP32_FIRMWARE
          path: |
            output/main/*.bin
            output/main/flash_map.txt
            output/main/build_info.txt
            output/main/compile.log
          if-no-files-found: error
          compression-level: 0

      - name: Upload MAIN flash package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_MAIN_ESP32_FLASH_PACKAGE
          path: output/SIBOAT_MAIN_ESP32_FLASH_PACKAGE.zip
          if-no-files-found: error


  # ==========================================================
  # ESP32-CAM
  # ==========================================================
  build-cam:
    name: Build ESP32-CAM
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install ESP32 Arduino core
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            "$ESP32_INDEX_URL"

          arduino-cli core update-index \
            --additional-urls "$ESP32_INDEX_URL"

          arduino-cli core install \
            "esp32:esp32@${ESP32_CORE}" \
            --additional-urls "$ESP32_INDEX_URL"

          echo "Installed ESP32 core:"
          arduino-cli core list

      - name: Verify CAM firmware
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED.ino"

          test -f "$SOURCE"

          python3 - "$SOURCE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          required = [
              '{ "SIBOAT NETWORK",',
              '{ "bleach.",',
              '{ "Private Wifi",',
          ]

          positions = []

          for token in required:
              position = text.find(token)

              if position < 0:
                  raise SystemExit(
                      f"Missing Wi-Fi profile in {path.name}: {token}"
                  )

              positions.append(position)

          if positions != sorted(positions):
              raise SystemExit(
                  "Wi-Fi profile order must be "
                  "SIBOAT NETWORK -> bleach. -> Private Wifi"
              )

          if "siboat_inferencing.h" not in text:
              raise SystemExit(
                  "CAM firmware does not reference "
                  "siboat_inferencing.h"
              )

          print("CAM firmware verification passed.")
          print("Wi-Fi order: SIBOAT NETWORK -> bleach. -> Private Wifi")
          print("Edge Impulse header reference found.")
          PY

      # -------------------------------------------------------
      # THIS IS THE IMPORTANT FIX
      #
      # Install the Edge Impulse Arduino ZIP as an actual
      # Arduino library instead of manually assuming where
      # siboat_inferencing.h is located inside the ZIP.
      # -------------------------------------------------------
      - name: Install SIBOAT Edge Impulse Arduino library
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="siboat_inferencing.zip"

          test -f "$ZIP_FILE"
          test -s "$ZIP_FILE"

          echo "Installing Edge Impulse Arduino library:"
          echo "$ZIP_FILE"

          arduino-cli lib install \
            --zip-path "$PWD/$ZIP_FILE"

          echo ""
          echo "Installed libraries:"
          arduino-cli lib list

          echo ""
          echo "Checking installed SIBOAT inference header..."

          HEADER="$(
            find "$HOME/Arduino/libraries" \
              -type f \
              -name "siboat_inferencing.h" \
              -print \
              -quit
          )"

          if [ -z "$HEADER" ]; then
            echo "ERROR: siboat_inferencing.h was not found after ZIP installation."

            echo ""
            echo "Arduino library directory contents:"
            find "$HOME/Arduino/libraries" \
              -maxdepth 4 \
              -type f \
              | sort \
              | head -300

            exit 1
          fi

          echo "Found:"
          echo "$HEADER"

          LIB_ROOT="$(dirname "$HEADER")"

          while [ "$LIB_ROOT" != "/" ] && \
                [ ! -f "$LIB_ROOT/library.properties" ]; do
            LIB_ROOT="$(dirname "$LIB_ROOT")"
          done

          if [ ! -f "$LIB_ROOT/library.properties" ]; then
            echo "ERROR: Could not locate library.properties for SIBOAT inference library."
            exit 1
          fi

          echo ""
          echo "SIBOAT Edge Impulse library root:"
          echo "$LIB_ROOT"

          echo ""
          echo "SIBOAT library files:"
          find "$LIB_ROOT" \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -300

          test -f "$LIB_ROOT/library.properties"

      - name: Prepare CAM sketch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build_work output/cam

          mkdir -p \
            build_work/siboat_cam \
            build_work/source \
            output/cam/build

          cp \
            A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED.ino \
            build_work/source/siboat_cam.cpp

          cat > build_work/siboat_cam/siboat_cam.ino <<'EOF'
          #include "../source/siboat_cam.cpp"
          EOF

          test -f build_work/siboat_cam/siboat_cam.ino
          test -f build_work/source/siboat_cam.cpp

      - name: Compile ESP32-CAM
        shell: bash
        run: |
          set -euo pipefail

          FQBN="esp32:esp32:esp32cam:PartitionScheme=huge_app"
          LOG="output/cam/compile.log"

          mkdir -p output/cam

          echo "==============================================" | tee "$LOG"
          echo "SIBOAT ESP32-CAM BUILD" | tee -a "$LOG"
          echo "==============================================" | tee -a "$LOG"
          echo "Arduino-ESP32 core: $ESP32_CORE" | tee -a "$LOG"
          echo "FQBN: $FQBN" | tee -a "$LOG"
          echo "Board: AI Thinker ESP32-CAM" | tee -a "$LOG"
          echo "" | tee -a "$LOG"

          arduino-cli compile \
            --fqbn "$FQBN" \
            --output-dir output/cam/build \
            --export-binaries \
            --warnings none \
            --clean \
            build_work/siboat_cam \
            2>&1 | tee -a "$LOG"

      - name: Collect CAM binaries
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/cam"
          BUILD="$OUT/build"

          APP="$BUILD/siboat_cam.ino.bin"
          BOOT="$BUILD/siboat_cam.ino.bootloader.bin"
          PART="$BUILD/siboat_cam.ino.partitions.bin"

          BOOT_APP0="$(
            find "$HOME/.arduino15/packages/esp32" \
              -type f \
              -path '*/tools/partitions/boot_app0.bin' \
              -print \
              -quit
          )"

          test -s "$APP"
          test -s "$BOOT"
          test -s "$PART"
          test -s "$BOOT_APP0"

          cp "$APP" \
            "$OUT/SIBOAT_ESP32_CAM_APP.bin"

          cp "$BOOT" \
            "$OUT/SIBOAT_ESP32_CAM_BOOTLOADER.bin"

          cp "$PART" \
            "$OUT/SIBOAT_ESP32_CAM_PARTITIONS.bin"

          cp "$BOOT_APP0" \
            "$OUT/SIBOAT_ESP32_CAM_BOOT_APP0.bin"

          cat > "$OUT/build_info.txt" <<EOF
          SIBOAT ESP32-CAM BUILD

          Git commit:
          $GITHUB_SHA

          Arduino-ESP32:
          $ESP32_CORE

          FQBN:
          esp32:esp32:esp32cam:PartitionScheme=huge_app

          Board:
          AI Thinker ESP32-CAM

          Source:
          A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED.ino

          Edge Impulse library:
          siboat_inferencing.zip

          Wi-Fi profile order:
          1. SIBOAT NETWORK
          2. bleach.
          3. Private Wifi
          EOF

      - name: Install esptool
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install \
            --disable-pip-version-check \
            esptool

          python3 -m esptool version

      - name: Create CAM all-in-one firmware
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/cam"

          python3 -m esptool \
            --chip esp32 \
            merge-bin \
            -o "$OUT/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin" \
            0x1000 "$OUT/SIBOAT_ESP32_CAM_BOOTLOADER.bin" \
            0x8000 "$OUT/SIBOAT_ESP32_CAM_PARTITIONS.bin" \
            0xE000 "$OUT/SIBOAT_ESP32_CAM_BOOT_APP0.bin" \
            0x10000 "$OUT/SIBOAT_ESP32_CAM_APP.bin"

          test -s \
            "$OUT/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin"

      - name: Create CAM flash map
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          cat > output/cam/flash_map.txt <<'EOF'
          SIBOAT ESP32-CAM FLASH MAP

          Individual binaries:

          Bootloader:
          SIBOAT_ESP32_CAM_BOOTLOADER.bin
          Address: 0x1000

          Partition table:
          SIBOAT_ESP32_CAM_PARTITIONS.bin
          Address: 0x8000

          boot_app0:
          SIBOAT_ESP32_CAM_BOOT_APP0.bin
          Address: 0xE000

          Application:
          SIBOAT_ESP32_CAM_APP.bin
          Address: 0x10000

          All-in-one:
          SIBOAT_ESP32_CAM_ALL-IN-ONE.bin
          Address: 0x0000
          EOF

      - name: Package CAM firmware
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          cd output/cam

          zip -9 \
            ../SIBOAT_ESP32_CAM_FLASH_PACKAGE.zip \
            *.bin \
            flash_map.txt \
            build_info.txt \
            compile.log

          cd ../..

          test -s \
            output/SIBOAT_ESP32_CAM_FLASH_PACKAGE.zip

      - name: Upload CAM firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_ESP32_CAM_FIRMWARE
          path: |
            output/cam/*.bin
            output/cam/flash_map.txt
            output/cam/build_info.txt
            output/cam/compile.log
          if-no-files-found: error
          compression-level: 0

      - name: Upload CAM flash package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_ESP32_CAM_FLASH_PACKAGE
          path: output/SIBOAT_ESP32_CAM_FLASH_PACKAGE.zip
          if-no-files-found: error
