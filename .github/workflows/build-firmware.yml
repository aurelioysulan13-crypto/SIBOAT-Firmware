name: Build SIBOAT Main ESP32 + ESP32-CAM Firmware

on:
  push:
    branches:
      - main
    paths:
      - "firmware/main/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS/**"
      - "firmware/cam/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS/**"
      - "siboat_inferencing.zip"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ARDUINO_CLI_VERSION: "1.5.1"
  ESP32_CORE_VERSION: "3.3.5"
  ESP32_BOARD_URL: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"

  MAIN_SKETCH_DIR: "firmware/main/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS"
  CAM_SKETCH_DIR: "firmware/cam/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS"

jobs:

  # ========================================================================
  # MAIN ESP32
  # ========================================================================

  build-main:
    name: Compile SIBOAT Main ESP32
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------------------
      # Arduino CLI
      # --------------------------------------------------------------------

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Configure Arduino CLI
        run: |
          set -euo pipefail

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            "${ESP32_BOARD_URL}"

          arduino-cli core update-index

          arduino-cli core install \
            "esp32:esp32@${ESP32_CORE_VERSION}"

      # --------------------------------------------------------------------
      # Verify current Main firmware
      # --------------------------------------------------------------------

      - name: Verify Main firmware source
        run: |
          set -euo pipefail

          SOURCE="${MAIN_SKETCH_DIR}/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS.ino"

          test -s "$SOURCE"

          grep -q \
            '#define FW_VERSION "1.6.0-final-ota-ble-outbox"' \
            "$SOURCE"

          grep -q \
            '#include "siboat_secrets.h"' \
            "$SOURCE"

          echo "Main firmware source verified."
          echo "Firmware version: 1.6.0-final-ota-ble-outbox"

      # --------------------------------------------------------------------
      # Verify corrected Main type header
      # --------------------------------------------------------------------

      - name: Verify Main firmware type header
        run: |
          set -euo pipefail

          TYPES_HEADER="${MAIN_SKETCH_DIR}/siboat_main_types.h"

          test -s "$TYPES_HEADER"

          grep -q "struct Motor" "$TYPES_HEADER"
          grep -q "struct EventRec" "$TYPES_HEADER"
          grep -q "struct WsClient" "$TYPES_HEADER"
          grep -q "struct Jw" "$TYPES_HEADER"

          echo "Main shared type header verified."

      # --------------------------------------------------------------------
      # Prepare Main secrets
      # --------------------------------------------------------------------

      - name: Prepare Main secrets header
        env:
          SIBOAT_SECRETS_H: ${{ secrets.SIBOAT_SECRETS_H }}
        run: |
          set -euo pipefail

          TARGET="${MAIN_SKETCH_DIR}/siboat_secrets.h"
          EXAMPLE="${MAIN_SKETCH_DIR}/siboat_secrets.example.h"

          if [ -n "${SIBOAT_SECRETS_H:-}" ]; then
            printf '%s\n' "$SIBOAT_SECRETS_H" > "$TARGET"
            echo "Using GitHub Actions secret SIBOAT_SECRETS_H."
          else
            test -s "$EXAMPLE"
            cp "$EXAMPLE" "$TARGET"
            echo "SIBOAT_SECRETS_H is not configured."
            echo "Using example header for compilation only."
          fi

          test -s "$TARGET"

          echo "Main secrets header prepared."

      # --------------------------------------------------------------------
      # Compile Main ESP32
      # --------------------------------------------------------------------

      - name: Compile Main ESP32
        run: |
          set -euo pipefail

          rm -rf output/main
          mkdir -p output/main

          arduino-cli compile \
            --clean \
            --warnings all \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app" \
            --export-binaries \
            --output-dir "output/main" \
            "${MAIN_SKETCH_DIR}"

      # --------------------------------------------------------------------
      # Verify Main compiler output
      # --------------------------------------------------------------------

      - name: Verify Main compiler output
        run: |
          set -euo pipefail

          OUT="output/main"

          find "$OUT" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          test -s \
            "$OUT/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS.ino.bin"

          test -s \
            "$OUT/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS.ino.bootloader.bin"

          test -s \
            "$OUT/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS.ino.partitions.bin"

          test -s \
            "$OUT/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS.ino.merged.bin"

          echo "Main ESP32 compiler output verified."

      # --------------------------------------------------------------------
      # Rename Main images
      # --------------------------------------------------------------------

      - name: Prepare Main firmware images
        run: |
          set -euo pipefail

          OUT="output/main"

          cp \
            "$OUT/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS.ino.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_APP.bin"

          cp \
            "$OUT/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS.ino.bootloader.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_BOOTLOADER.bin"

          cp \
            "$OUT/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS.ino.partitions.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_PARTITIONS.bin"

          cp \
            "$OUT/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS.ino.merged.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin"

      # --------------------------------------------------------------------
      # Main build information
      # --------------------------------------------------------------------

      - name: Generate Main build information
        run: |
          set -euo pipefail

          cat > output/main/BUILD_INFORMATION.txt <<EOF
          SIBOAT MAIN ESP32 FIRMWARE

          Firmware:
          SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS

          Firmware version:
          1.6.0-final-ota-ble-outbox

          Source:
          ${MAIN_SKETCH_DIR}/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS.ino

          Board:
          ESP32 Dev Module

          FQBN:
          esp32:esp32:esp32:PartitionScheme=huge_app

          Arduino CLI:
          ${ARDUINO_CLI_VERSION}

          ESP32 Arduino Core:
          ${ESP32_CORE_VERSION}

          Git commit:
          ${GITHUB_SHA}

          Git branch:
          ${GITHUB_REF_NAME}

          Build date:
          $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF

      # --------------------------------------------------------------------
      # Main flashing instructions
      # --------------------------------------------------------------------

      - name: Generate Main flashing instructions
        run: |
          cat > output/main/FLASH_INSTRUCTIONS.txt <<'EOF'
          SIBOAT MAIN ESP32

          Recommended firmware:
          SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin

          All-in-one flash address:
          0x0

          Board:
          ESP32 Dev Module

          Partition scheme:
          Huge APP

          Separate image addresses:

          Bootloader:
          0x1000

          Partition table:
          0x8000

          boot_app0:
          0xE000

          Application:
          0x10000

          IMPORTANT:
          Use firmware images generated by the same GitHub Actions build.
          EOF

      # --------------------------------------------------------------------
      # Main checksums
      # --------------------------------------------------------------------

      - name: Generate Main SHA256 checksums
        run: |
          set -euo pipefail

          cd output/main

          sha256sum \
            SIBOAT_MAIN_ESP32_APP.bin \
            SIBOAT_MAIN_ESP32_BOOTLOADER.bin \
            SIBOAT_MAIN_ESP32_PARTITIONS.bin \
            SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin \
            > SHA256SUMS.txt

      # --------------------------------------------------------------------
      # Main flash package
      # --------------------------------------------------------------------

      - name: Create Main flash package
        run: |
          set -euo pipefail

          cd output/main

          zip -9 \
            SIBOAT_MAIN_ESP32_FLASH_PACKAGE.zip \
            SIBOAT_MAIN_ESP32_APP.bin \
            SIBOAT_MAIN_ESP32_BOOTLOADER.bin \
            SIBOAT_MAIN_ESP32_PARTITIONS.bin \
            SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin \
            BUILD_INFORMATION.txt \
            FLASH_INSTRUCTIONS.txt \
            SHA256SUMS.txt

      # --------------------------------------------------------------------
      # Main artifacts
      # --------------------------------------------------------------------

      - name: Upload Main ESP32 firmware
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_MAIN_ESP32_FIRMWARE
          path: |
            output/main/SIBOAT_MAIN_ESP32_APP.bin
            output/main/SIBOAT_MAIN_ESP32_BOOTLOADER.bin
            output/main/SIBOAT_MAIN_ESP32_PARTITIONS.bin
            output/main/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin
            output/main/BUILD_INFORMATION.txt
            output/main/FLASH_INSTRUCTIONS.txt
            output/main/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Upload Main flash package
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_MAIN_ESP32_FLASH_PACKAGE
          path: output/main/SIBOAT_MAIN_ESP32_FLASH_PACKAGE.zip
          if-no-files-found: error
          compression-level: 0


  # ========================================================================
  # ESP32-CAM
  # ========================================================================

  build-cam:
    name: Compile SIBOAT ESP32-CAM
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------------------
      # Arduino CLI
      # --------------------------------------------------------------------

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Configure Arduino CLI
        run: |
          set -euo pipefail

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            "${ESP32_BOARD_URL}"

          arduino-cli core update-index

          arduino-cli core install \
            "esp32:esp32@${ESP32_CORE_VERSION}"

      # --------------------------------------------------------------------
      # Verify current CAM firmware
      # --------------------------------------------------------------------

      - name: Verify CAM firmware source
        run: |
          set -euo pipefail

          SOURCE="${CAM_SKETCH_DIR}/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS.ino"

          test -s "$SOURCE"

          grep -q \
            '#define CAM_FW_VERSION "1.4.0-ota"' \
            "$SOURCE"

          grep -q \
            '#include <siboat_inferencing.h>' \
            "$SOURCE"

          grep -q \
            '#include "siboat_secrets.h"' \
            "$SOURCE"

          test -s "siboat_inferencing.zip"

          test -s \
            "${CAM_SKETCH_DIR}/siboat_secrets.example.h"

          echo "CAM firmware source verified."
          echo "Firmware version: 1.4.0-ota"

      # --------------------------------------------------------------------
      # Prepare CAM secrets
      # --------------------------------------------------------------------

      - name: Prepare CAM secrets header
        env:
          SIBOAT_SECRETS_H: ${{ secrets.SIBOAT_SECRETS_H }}
        run: |
          set -euo pipefail

          TARGET="${CAM_SKETCH_DIR}/siboat_secrets.h"
          EXAMPLE="${CAM_SKETCH_DIR}/siboat_secrets.example.h"

          if [ -n "${SIBOAT_SECRETS_H:-}" ]; then
            printf '%s\n' "$SIBOAT_SECRETS_H" > "$TARGET"
            echo "Using GitHub Actions secret SIBOAT_SECRETS_H."
          else
            test -s "$EXAMPLE"
            cp "$EXAMPLE" "$TARGET"
            echo "SIBOAT_SECRETS_H is not configured."
            echo "Using example header for compilation only."
          fi

          test -s "$TARGET"

          echo "CAM secrets header prepared."

      # --------------------------------------------------------------------
      # Prepare Edge Impulse library
      #
      # The current archive places siboat_inferencing.h under src/.
      # Keep the complete library structure intact.
      # --------------------------------------------------------------------

      - name: Prepare SIBOAT Edge Impulse library
        run: |
          set -euo pipefail

          EI_EXTRACT="$RUNNER_TEMP/siboat-ei"
          EI_COLLECTION="$RUNNER_TEMP/arduino-libraries"

          rm -rf "$EI_EXTRACT"
          rm -rf "$EI_COLLECTION"

          mkdir -p "$EI_EXTRACT"
          mkdir -p "$EI_COLLECTION"

          unzip -q \
            "siboat_inferencing.zip" \
            -d "$EI_EXTRACT"

          echo "Searching for library.properties..."

          EI_LIB_ROOT="$(
            find "$EI_EXTRACT" \
              -type f \
              -name 'library.properties' \
              -print \
              -quit \
              | xargs -r dirname
          )"

          test -n "$EI_LIB_ROOT"

          echo "Detected library root:"
          echo "$EI_LIB_ROOT"

          EI_HEADER="$(
            find "$EI_LIB_ROOT" \
              -type f \
              -name 'siboat_inferencing.h' \
              -print \
              -quit
          )"

          test -n "$EI_HEADER"

          echo "Detected inference header:"
          echo "$EI_HEADER"

          EI_LIBRARY="$EI_COLLECTION/SIBOAT_Inferencing"

          mkdir -p "$EI_LIBRARY"

          cp -a \
            "$EI_LIB_ROOT"/. \
            "$EI_LIBRARY/"

          test -f \
            "$EI_LIBRARY/library.properties"

          test -s \
            "$EI_LIBRARY/src/siboat_inferencing.h"

          echo "Edge Impulse library structure:"
          find "$EI_LIBRARY" \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -200

          echo "SIBOAT Edge Impulse library prepared successfully."

      # --------------------------------------------------------------------
      # Compile CAM
      # --------------------------------------------------------------------

      - name: Compile ESP32-CAM
        run: |
          set -euo pipefail

          rm -rf output/cam
          mkdir -p output/cam

          arduino-cli compile \
            --clean \
            --warnings all \
            --fqbn "esp32:esp32:esp32cam:PartitionScheme=huge_app" \
            --libraries "$RUNNER_TEMP/arduino-libraries" \
            --export-binaries \
            --output-dir "output/cam" \
            "${CAM_SKETCH_DIR}"

      # --------------------------------------------------------------------
      # Verify CAM compiler output
      # --------------------------------------------------------------------

      - name: Verify CAM compiler output
        run: |
          set -euo pipefail

          OUT="output/cam"

          find "$OUT" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          test -s \
            "$OUT/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS.ino.bin"

          test -s \
            "$OUT/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS.ino.bootloader.bin"

          test -s \
            "$OUT/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS.ino.partitions.bin"

          test -s \
            "$OUT/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS.ino.merged.bin"

          echo "ESP32-CAM compiler output verified."

      # --------------------------------------------------------------------
      # Rename CAM images
      # --------------------------------------------------------------------

      - name: Prepare CAM firmware images
        run: |
          set -euo pipefail

          OUT="output/cam"

          cp \
            "$OUT/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS.ino.bin" \
            "$OUT/SIBOAT_ESP32_CAM_APP.bin"

          cp \
            "$OUT/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS.ino.bootloader.bin" \
            "$OUT/SIBOAT_ESP32_CAM_BOOTLOADER.bin"

          cp \
            "$OUT/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS.ino.partitions.bin" \
            "$OUT/SIBOAT_ESP32_CAM_PARTITIONS.bin"

          cp \
            "$OUT/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS.ino.merged.bin" \
            "$OUT/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin"

      # --------------------------------------------------------------------
      # CAM build information
      # --------------------------------------------------------------------

      - name: Generate CAM build information
        run: |
          set -euo pipefail

          cat > output/cam/BUILD_INFORMATION.txt <<EOF
          SIBOAT ESP32-CAM FIRMWARE

          Firmware:
          SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS

          Firmware version:
          1.4.0-ota

          Source:
          ${CAM_SKETCH_DIR}/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS.ino

          Board:
          ESP32-CAM

          FQBN:
          esp32:esp32:esp32cam:PartitionScheme=huge_app

          Arduino CLI:
          ${ARDUINO_CLI_VERSION}

          ESP32 Arduino Core:
          ${ESP32_CORE_VERSION}

          Git commit:
          ${GITHUB_SHA}

          Git branch:
          ${GITHUB_REF_NAME}

          Build date:
          $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF

      # --------------------------------------------------------------------
      # CAM flashing instructions
      # --------------------------------------------------------------------

      - name: Generate CAM flashing instructions
        run: |
          cat > output/cam/FLASH_INSTRUCTIONS.txt <<'EOF'
          SIBOAT ESP32-CAM

          Recommended firmware:
          SIBOAT_ESP32_CAM_ALL-IN-ONE.bin

          All-in-one flash address:
          0x0

          Board:
          ESP32-CAM

          Partition scheme:
          Huge APP

          Separate image addresses:

          Bootloader:
          0x1000

          Partition table:
          0x8000

          boot_app0:
          0xE000

          Application:
          0x10000

          IMPORTANT:
          Use firmware images generated by the same GitHub Actions build.
          EOF

      # --------------------------------------------------------------------
      # CAM checksums
      # --------------------------------------------------------------------

      - name: Generate CAM SHA256 checksums
        run: |
          set -euo pipefail

          cd output/cam

          sha256sum \
            SIBOAT_ESP32_CAM_APP.bin \
            SIBOAT_ESP32_CAM_BOOTLOADER.bin \
            SIBOAT_ESP32_CAM_PARTITIONS.bin \
            SIBOAT_ESP32_CAM_ALL-IN-ONE.bin \
            > SHA256SUMS.txt

      # --------------------------------------------------------------------
      # CAM flash package
      # --------------------------------------------------------------------

      - name: Create CAM flash package
        run: |
          set -euo pipefail

          cd output/cam

          zip -9 \
            SIBOAT_ESP32_CAM_FLASH_PACKAGE.zip \
            SIBOAT_ESP32_CAM_APP.bin \
            SIBOAT_ESP32_CAM_BOOTLOADER.bin \
            SIBOAT_ESP32_CAM_PARTITIONS.bin \
            SIBOAT_ESP32_CAM_ALL-IN-ONE.bin \
            BUILD_INFORMATION.txt \
            FLASH_INSTRUCTIONS.txt \
            SHA256SUMS.txt

      # --------------------------------------------------------------------
      # CAM artifacts
      # --------------------------------------------------------------------

      - name: Upload ESP32-CAM firmware
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_ESP32_CAM_FIRMWARE
          path: |
            output/cam/SIBOAT_ESP32_CAM_APP.bin
            output/cam/SIBOAT_ESP32_CAM_BOOTLOADER.bin
            output/cam/SIBOAT_ESP32_CAM_PARTITIONS.bin
            output/cam/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin
            output/cam/BUILD_INFORMATION.txt
            output/cam/FLASH_INSTRUCTIONS.txt
            output/cam/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Upload CAM flash package
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_ESP32_CAM_FLASH_PACKAGE
          path: output/cam/SIBOAT_ESP32_CAM_FLASH_PACKAGE.zip
          if-no-files-found: error
          compression-level: 0
