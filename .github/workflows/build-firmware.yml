name: Build SIBOAT Main ESP32 + ESP32-CAM Firmware

on:
  push:
    branches:
      - main
    paths:
      - "firmware/main/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS/**"
      - "firmware/cam/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS/**"
      - "siboat_inferencing.zip"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ARDUINO_CLI_VERSION: "1.5.1"
  ESP32_CORE_VERSION: "3.3.5"
  ESP32_BOARD_URL: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
  MAIN_SKETCH_DIR: "firmware/main/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS"
  CAM_SKETCH_DIR: "firmware/cam/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS"

jobs:
  build-main:
    name: Compile SIBOAT Main ESP32
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Configure Arduino CLI
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls "${ESP32_BOARD_URL}"
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}"

      - name: Verify Main firmware source
        run: |
          set -euo pipefail
          SOURCE="${MAIN_SKETCH_DIR}/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS.ino"

          test -s "$SOURCE"

          grep -q '#define FW_VERSION "1.6.0-final-ota-ble-outbox"' "$SOURCE"

          echo "Verified Main source: $SOURCE"

      - name: Compile Main ESP32
        run: |
          set -euo pipefail

          rm -rf output/main
          mkdir -p output/main

          arduino-cli compile \
            --clean \
            --warnings all \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app" \
            --export-binaries \
            --output-dir "output/main" \
            "${MAIN_SKETCH_DIR}"

      - name: Verify Main compiler output
        run: |
          set -euo pipefail

          OUT="output/main"

          find "$OUT" -maxdepth 1 -type f -printf '%f\n' | sort

          test -s "$OUT/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS.ino.bin"
          test -s "$OUT/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS.ino.bootloader.bin"
          test -s "$OUT/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS.ino.partitions.bin"
          test -s "$OUT/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS.ino.merged.bin"

      - name: Rename Main firmware images
        run: |
          set -euo pipefail

          OUT="output/main"

          cp "$OUT/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS.ino.bin" \
             "$OUT/SIBOAT_MAIN_ESP32_APP.bin"

          cp "$OUT/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS.ino.bootloader.bin" \
             "$OUT/SIBOAT_MAIN_ESP32_BOOTLOADER.bin"

          cp "$OUT/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS.ino.partitions.bin" \
             "$OUT/SIBOAT_MAIN_ESP32_PARTITIONS.bin"

          cp "$OUT/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS.ino.merged.bin" \
             "$OUT/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin"

      - name: Generate Main build information
        run: |
          set -euo pipefail

          cat > output/main/BUILD_INFORMATION.txt <<EOF
          SIBOAT MAIN ESP32 FIRMWARE

          Source:
          ${MAIN_SKETCH_DIR}/SIBOAT_MAIN-ESP32_FIRMWARE_FINAL_BOSS.ino

          Firmware version:
          1.6.0-final-ota-ble-outbox

          Board:
          ESP32 Dev Module

          FQBN:
          esp32:esp32:esp32:PartitionScheme=huge_app

          Arduino CLI:
          ${ARDUINO_CLI_VERSION}

          ESP32 Arduino Core:
          ${ESP32_CORE_VERSION}

          Git commit:
          ${GITHUB_SHA}

          Git branch:
          ${GITHUB_REF_NAME}

          Build date:
          $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF

      - name: Generate Main flashing instructions
        run: |
          cat > output/main/FLASH_INSTRUCTIONS.txt <<'EOF'
          SIBOAT MAIN ESP32

          Recommended image:
          SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin

          Flash address:
          0x0

          Board:
          ESP32 Dev Module

          Separate image offsets, if required:
          Bootloader: 0x1000
          Partition table: 0x8000
          boot_app0: 0xE000
          Application: 0x10000

          Use images from the same GitHub Actions build only.
          EOF

      - name: Generate Main checksums
        run: |
          set -euo pipefail

          cd output/main

          sha256sum \
            SIBOAT_MAIN_ESP32_APP.bin \
            SIBOAT_MAIN_ESP32_BOOTLOADER.bin \
            SIBOAT_MAIN_ESP32_PARTITIONS.bin \
            SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin \
            > SHA256SUMS.txt

      - name: Create Main flash package
        run: |
          set -euo pipefail

          cd output/main

          zip -9 SIBOAT_MAIN_ESP32_FLASH_PACKAGE.zip \
            SIBOAT_MAIN_ESP32_APP.bin \
            SIBOAT_MAIN_ESP32_BOOTLOADER.bin \
            SIBOAT_MAIN_ESP32_PARTITIONS.bin \
            SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin \
            BUILD_INFORMATION.txt \
            FLASH_INSTRUCTIONS.txt \
            SHA256SUMS.txt

      - name: Upload Main ESP32 firmware
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_MAIN_ESP32_FIRMWARE
          path: |
            output/main/SIBOAT_MAIN_ESP32_APP.bin
            output/main/SIBOAT_MAIN_ESP32_BOOTLOADER.bin
            output/main/SIBOAT_MAIN_ESP32_PARTITIONS.bin
            output/main/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin
            output/main/BUILD_INFORMATION.txt
            output/main/FLASH_INSTRUCTIONS.txt
            output/main/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Upload Main flash package
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_MAIN_ESP32_FLASH_PACKAGE
          path: output/main/SIBOAT_MAIN_ESP32_FLASH_PACKAGE.zip
          if-no-files-found: error
          compression-level: 0

  build-cam:
    name: Compile SIBOAT ESP32-CAM
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Configure Arduino CLI
        run: |
          set -euo pipefail

          arduino-cli config init
          arduino-cli config add board_manager.additional_urls "${ESP32_BOARD_URL}"
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}"

      - name: Verify CAM firmware source
        run: |
          set -euo pipefail

          SOURCE="${CAM_SKETCH_DIR}/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS.ino"

          test -s "$SOURCE"

          grep -q '#define CAM_FW_VERSION "1.4.0-ota"' "$SOURCE"

          grep -q '#include <siboat_inferencing.h>' "$SOURCE"

          test -s "siboat_inferencing.zip"

          test -s "${CAM_SKETCH_DIR}/siboat_secrets.example.h"

          echo "Verified CAM source: $SOURCE"

      - name: Prepare CAM secrets header
        env:
          SIBOAT_SECRETS_H: ${{ secrets.SIBOAT_SECRETS_H }}
        run: |
          set -euo pipefail

          TARGET="${CAM_SKETCH_DIR}/siboat_secrets.h"

          if [ -n "${SIBOAT_SECRETS_H:-}" ]; then
            printf '%s\n' "$SIBOAT_SECRETS_H" > "$TARGET"

            echo "Using repository secret SIBOAT_SECRETS_H for CAM build."
          else
            cp "${CAM_SKETCH_DIR}/siboat_secrets.example.h" "$TARGET"

            echo "SIBOAT_SECRETS_H is not configured; using the public example header for compilation only."
          fi

          test -s "$TARGET"

      - name: Install SIBOAT Edge Impulse library
        run: |
          set -euo pipefail

          EI_EXTRACT="$RUNNER_TEMP/siboat-ei"
          EI_COLLECTION="$RUNNER_TEMP/arduino-libraries"

          rm -rf "$EI_EXTRACT" "$EI_COLLECTION"

          mkdir -p "$EI_EXTRACT" "$EI_COLLECTION"

          unzip -q "siboat_inferencing.zip" -d "$EI_EXTRACT"

          EI_LIB_ROOT="$(find "$EI_EXTRACT" \
            -type f \
            -name 'library.properties' \
            -print -quit | xargs -r dirname)"

          test -n "$EI_LIB_ROOT"

          EI_HEADER="$(find "$EI_LIB_ROOT" \
            -type f \
            -name 'siboat_inferencing.h' \
            -print -quit)"

          test -n "$EI_HEADER"

          cp -a "$EI_LIB_ROOT" "$EI_COLLECTION/SIBOAT_Inferencing"

          echo "Edge Impulse library root: $EI_LIB_ROOT"
          echo "Edge Impulse header: $EI_HEADER"

          test -s "$EI_COLLECTION/SIBOAT_Inferencing/siboat_inferencing.h"

      - name: Compile ESP32-CAM
        run: |
          set -euo pipefail

          rm -rf output/cam
          mkdir -p output/cam

          arduino-cli compile \
            --clean \
            --warnings all \
            --fqbn "esp32:esp32:esp32cam:PartitionScheme=huge_app" \
            --libraries "$RUNNER_TEMP/arduino-libraries" \
            --export-binaries \
            --output-dir "output/cam" \
            "${CAM_SKETCH_DIR}"

      - name: Verify CAM compiler output
        run: |
          set -euo pipefail

          OUT="output/cam"

          find "$OUT" -maxdepth 1 -type f -printf '%f\n' | sort

          test -s "$OUT/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS.ino.bin"
          test -s "$OUT/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS.ino.bootloader.bin"
          test -s "$OUT/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS.ino.partitions.bin"
          test -s "$OUT/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS.ino.merged.bin"

      - name: Rename CAM firmware images
        run: |
          set -euo pipefail

          OUT="output/cam"

          cp "$OUT/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS.ino.bin" \
             "$OUT/SIBOAT_CAM_ESP32_APP.bin"

          cp "$OUT/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS.ino.bootloader.bin" \
             "$OUT/SIBOAT_CAM_ESP32_BOOTLOADER.bin"

          cp "$OUT/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS.ino.partitions.bin" \
             "$OUT/SIBOAT_CAM_ESP32_PARTITIONS.bin"

          cp "$OUT/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS.ino.merged.bin" \
             "$OUT/SIBOAT_CAM_ESP32_ALL-IN-ONE.bin"

      - name: Generate CAM build information
        run: |
          set -euo pipefail

          cat > output/cam/BUILD_INFORMATION.txt <<EOF
          SIBOAT ESP32-CAM FIRMWARE

          Source:
          ${CAM_SKETCH_DIR}/SIBOAT_ESP32-CAM_FIRMWARE_FINAL_BOSS.ino

          Firmware version:
          1.4.0-ota

          Board:
          AI Thinker ESP32-CAM

          FQBN:
          esp32:esp32:esp32cam:PartitionScheme=huge_app

          Arduino CLI:
          ${ARDUINO_CLI_VERSION}

          ESP32 Arduino Core:
          ${ESP32_CORE_VERSION}

          Edge Impulse library:
          siboat_inferencing.zip

          Git commit:
          ${GITHUB_SHA}

          Git branch:
          ${GITHUB_REF_NAME}

          Build date:
          $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF

      - name: Generate CAM flashing instructions
        run: |
          cat > output/cam/FLASH_INSTRUCTIONS.txt <<'EOF'
          SIBOAT ESP32-CAM

          Board:
          AI Thinker ESP32-CAM

          Recommended image:
          SIBOAT_CAM_ESP32_ALL-IN-ONE.bin

          Flash address:
          0x0

          Partition scheme:
          Huge APP

          Use images from the same GitHub Actions build only.
          EOF

      - name: Generate CAM checksums
        run: |
          set -euo pipefail

          cd output/cam

          sha256sum \
            SIBOAT_CAM_ESP32_APP.bin \
            SIBOAT_CAM_ESP32_BOOTLOADER.bin \
            SIBOAT_CAM_ESP32_PARTITIONS.bin \
            SIBOAT_CAM_ESP32_ALL-IN-ONE.bin \
            > SHA256SUMS.txt

      - name: Create CAM flash package
        run: |
          set -euo pipefail

          cd output/cam

          zip -9 SIBOAT_CAM_ESP32_FLASH_PACKAGE.zip \
            SIBOAT_CAM_ESP32_APP.bin \
            SIBOAT_CAM_ESP32_BOOTLOADER.bin \
            SIBOAT_CAM_ESP32_PARTITIONS.bin \
            SIBOAT_CAM_ESP32_ALL-IN-ONE.bin \
            BUILD_INFORMATION.txt \
            FLASH_INSTRUCTIONS.txt \
            SHA256SUMS.txt

      - name: Upload ESP32-CAM firmware
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_CAM_ESP32_FIRMWARE
          path: |
            output/cam/SIBOAT_CAM_ESP32_APP.bin
            output/cam/SIBOAT_CAM_ESP32_BOOTLOADER.bin
            output/cam/SIBOAT_CAM_ESP32_PARTITIONS.bin
            output/cam/SIBOAT_CAM_ESP32_ALL-IN-ONE.bin
            output/cam/BUILD_INFORMATION.txt
            output/cam/FLASH_INSTRUCTIONS.txt
            output/cam/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Upload CAM flash package
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_CAM_ESP32_FLASH_PACKAGE
          path: output/cam/SIBOAT_CAM_ESP32_FLASH_PACKAGE.zip
          if-no-files-found: error
          compression-level: 0
