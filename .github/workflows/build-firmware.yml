# =============================================================================
# SIBOAT firmware builder - Main ESP32 + ESP32-CAM, ONE repo, ONE workflow
#
# Save this file in your repository as: .github/workflows/build-firmware.yml
#
# Two jobs run side by side (one per firmware). Each job:
# 1. finds its .ino file ANYWHERE in the repo (A1a_... or A1b_...)
# 2. installs the Arduino-ESP32 core (+ your Edge Impulse ZIP for the camera)
# 3. compiles, then uploads a downloadable ZIP ("artifact") for that board
#
# Run it: upload/commit any file (automatic), or Actions tab ->
# "Build SIBOAT firmware" -> Run workflow (manual).
# =============================================================================
name: Build SIBOAT firmware

on:
  push:
  workflow_dispatch:
    inputs:
      esp32_core:
        description: 'Arduino-ESP32 core version (2.0.17 = safest default; your code also supports 3.x)'
        required: false
        default: '2.0.17'
        type: string

permissions:
  contents: read

env:
  ESP32_CORE: ${{ inputs.esp32_core || '2.0.17' }}
  ESP32_INDEX_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false            # if one firmware fails, the other still builds
      matrix:
        include:
          # ---- Firmware 1: main controller (ESP32 Dev Module / NodeMCU ESP-32S) ----
          - label: SIBOAT_MAIN_ESP32
            sketch_dir: siboat_main
            sketch_glob: 'A1a_ESP32_MAIN_FIRMWARE*.ino'
            fqbn: 'esp32:esp32:esp32:PartitionScheme=huge_app'
            needs_edge_impulse: 'false'
            check_psram: 'false'
          # ---- Firmware 2: AI Thinker ESP32-CAM (PSRAM + Huge APP are board defaults) ----
          - label: SIBOAT_ESP32_CAM
            sketch_dir: siboat_cam
            sketch_glob: 'A1b_ESP32_CAM_FIRMWARE*.ino'
            fqbn: 'esp32:esp32:esp32cam'
            needs_edge_impulse: 'true'
            check_psram: 'true'

    steps:
      - name: Get your code
        uses: actions/checkout@v6

      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/arduino-cli" version

      - name: Restore cached ESP32 core (makes later builds faster)
        id: core-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.arduino15/packages
          key: arduino-packages-esp32-${{ env.ESP32_CORE }}-${{ runner.os }}-v1

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX_URL"
          arduino-cli core install "esp32:esp32@${ESP32_CORE}" --additional-urls "$ESP32_INDEX_URL"
          arduino-cli core list

      - name: Save ESP32 core cache
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.arduino15/packages
          key: arduino-packages-esp32-${{ env.ESP32_CORE }}-${{ runner.os }}-v1

      - name: Find the sketch and put it in a correctly named folder
        env:
          SKETCH_GLOB: ${{ matrix.sketch_glob }}
          SKETCH_DIR: ${{ matrix.sketch_dir }}
        run: |
          # Arduino needs folder-name == .ino-name, so we copy your file into a
          # fresh folder. This also works with names like ..._FIRMWARE__1_.ino
          mapfile -t MATCHES < <(find . -type f -name "$SKETCH_GLOB" -not -path './.git/*' | sort)
          if [ "${#MATCHES[@]}" -eq 0 ]; then
            echo "::error::No file matching $SKETCH_GLOB was found in the repository."
            echo "These .ino files exist in the repo:"
            find . -type f -name '*.ino' -not -path './.git/*'
            exit 1
          fi
          if [ "${#MATCHES[@]}" -gt 1 ]; then
            echo "::warning::More than one file matches $SKETCH_GLOB - using the first one."
            printf ' %s\n' "${MATCHES[@]}"
          fi
          echo "Using sketch: ${MATCHES[0]}"
          mkdir -p "_build/$SKETCH_DIR"
          cp "${MATCHES[0]}" "_build/$SKETCH_DIR/$SKETCH_DIR.ino"

      - name: Install the Edge Impulse library ZIP (camera only)
        if: matrix.needs_edge_impulse == 'true'
        env:
          ARDUINO_LIBRARY_ENABLE_UNSAFE_INSTALL: 'true'
        run: |
          arduino-cli config set library.enable_unsafe_install true || true
          FOUND=0
          while IFS= read -r ZIP; do
            NAMES="$(unzip -Z1 "$ZIP" 2>/dev/null || true)"
            if grep -qi '_inferencing\.h' <<< "$NAMES"; then
              echo "Installing Edge Impulse library: $ZIP"
              arduino-cli lib install --zip-path "$ZIP"
              FOUND=1
            fi
          done < <(find . -type f -iname '*.zip' -not -path './.git/*')
          if [ "$FOUND" -ne 1 ]; then
            echo "::error::Edge Impulse Arduino library ZIP not found. Upload the SIBOAT 'Arduino library' ZIP (the one that contains siboat_inferencing.h) anywhere in this repository."
            exit 1
          fi
          arduino-cli lib list

      - name: Show the board settings that will be used
        continue-on-error: true
        env:
          FQBN: ${{ matrix.fqbn }}
          SKETCH_DIR: ${{ matrix.sketch_dir }}
          CHECK_PSRAM: ${{ matrix.check_psram }}
        run: |
          PROPS="$(arduino-cli compile --fqbn "$FQBN" --show-properties "_build/$SKETCH_DIR" 2>&1 || true)"
          grep -E '^(build\.(partitions|flash_mode|flash_freq|flash_size|defines|extra_flags|psram_type|memory_type)|upload\.maximum_size)=' <<< "$PROPS" || true
          if [ "$CHECK_PSRAM" = "true" ] && ! grep -q 'BOARD_HAS_PSRAM' <<< "$PROPS"; then
            echo "::warning::PSRAM flag (BOARD_HAS_PSRAM) not found in this board's settings. The ESP32-CAM firmware needs PSRAM."
          fi

      - name: Compile
        env:
          FQBN: ${{ matrix.fqbn }}
          SKETCH_DIR: ${{ matrix.sketch_dir }}
        run: |
          arduino-cli compile \
            --fqbn "$FQBN" \
            --export-binaries \
            --warnings none \
            "_build/$SKETCH_DIR" 2>&1 | tee compile.log

      - name: Collect the files you need
        env:
          LABEL: ${{ matrix.label }}
          FQBN: ${{ matrix.fqbn }}
          SKETCH_DIR: ${{ matrix.sketch_dir }}
        run: |
          OUT="dist/$LABEL"
          BUILD="_build/$SKETCH_DIR/build"
          mkdir -p "$OUT/separate-parts"

          echo "Files exported by the compiler:"
          find "$BUILD" -type f | sort

          MERGED="$(find "$BUILD" -type f -name '*.merged.bin' -print -quit)"
          APP="$(find "$BUILD" -type f -name "$SKETCH_DIR.ino.bin" -print -quit)"
          BOOT="$(find "$BUILD" -type f -name '*.bootloader.bin' -print -quit)"
          PART="$(find "$BUILD" -type f -name '*.partitions.bin' -print -quit)"
          BOOTAPP0="$HOME/.arduino15/packages/esp32/hardware/esp32/$ESP32_CORE/tools/partitions/boot_app0.bin"
          ALLINONE="$OUT/${LABEL}_ALL-IN-ONE_flash-at-0x0.bin"

          if [ -z "$APP" ]; then
            echo "::error::The compiler produced no application .bin file."
            exit 1
          fi

          for F in "$APP" "$BOOT" "$PART" "$BOOTAPP0"; do
            if [ -n "$F" ] && [ -f "$F" ]; then cp "$F" "$OUT/separate-parts/"; fi
          done

          if [ -n "$MERGED" ]; then
            cp "$MERGED" "$ALLINONE"
          elif [ -n "$BOOT" ] && [ -n "$PART" ] && [ -f "$BOOTAPP0" ]; then
            echo "The core made no .merged.bin - building the all-in-one file with esptool"
            python3 -m venv /tmp/esptool-venv
            /tmp/esptool-venv/bin/pip install --quiet esptool
            /tmp/esptool-venv/bin/python -m esptool --chip esp32 merge_bin -o "$ALLINONE" \
              0x1000 "$BOOT" 0x8000 "$PART" 0xe000 "$BOOTAPP0" 0x10000 "$APP"
          else
            echo "::warning::No all-in-one file could be made - use the files in separate-parts/ (see READ_ME_FIRST.txt)."
          fi

          BUILT="$(date -u '+%Y-%m-%d %H:%M UTC')"
          SHA="${GITHUB_SHA:0:7}"
          cat > "$OUT/READ_ME_FIRST.txt" <<EOF SIBOAT firmware build - $LABEL Built: $BUILT Commit: $SHA Core: esp32:esp32@$ESP32_CORE Board: $FQBN WHAT TO FLASH ${LABEL}_ALL-IN-ONE_flash-at-0x0.bin -> write it at address 0x0 (it already contains bootloader + partition table + app) PC with esptool: python -m esptool --chip esp32 --baud 460800 write_flash 0x0 ${LABEL}_ALL-IN-ONE_flash-at-0x0.bin (if it fails, retry with --baud 115200) Browser flasher (Chrome or Edge): https://espressif.github.io/esptool-js/ Connect -> flash address 0x0 -> choose the ALL-IN-ONE file -> Program ESP32-CAM only: if your programmer board does not do it automatically, connect GPIO0 to GND, press RESET, flash, then remove the wire and press RESET. Only if you cannot use the all-in-one file, flash the files in separate-parts/ at: 0x1000 *.bootloader.bin 0x8000 *.partitions.bin 0xe000 boot_app0.bin 0x10000 *.ino.bin EOF

          ls -lh "$OUT" "$OUT/separate-parts"

      - name: Write build summary
        if: always()
        env:
          LABEL: ${{ matrix.label }}
        run: |
          {
            echo "### $LABEL (esp32 core $ESP32_CORE)"
            echo '```'
            grep -E 'Sketch uses|Global variables use' compile.log 2>/dev/null || echo "(no size info - see the Compile step log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware files
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.label }}_firmware
          path: dist/${{ matrix.label }}
          if-no-files-found: error
          retention-days: 30
