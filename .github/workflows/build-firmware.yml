name: Build SIBOAT ESP32 Firmware

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:

  # ============================================================
  # ESP32 MAIN
  # ============================================================
  build-main:
    name: Build ESP32 Main Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Initialize Arduino CLI
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Update Arduino indexes
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core update-index

      - name: Install ESP32 Arduino core 3.3.5
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli core install esp32:esp32@3.3.5

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Arduino CLI ==="
          arduino-cli version

          echo
          echo "=== Installed ESP32 cores ==="
          arduino-cli core list

      - name: Verify Main firmware
        shell: bash
        run: |
          set -euo pipefail

          test -f A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

          echo "Main firmware:"
          ls -lh A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

      # IMPORTANT:
      # Arduino CLI requires the sketch folder name and the .ino
      # main file name to match.
      - name: Prepare Main sketch
        shell: bash
        run: |
          set -euo pipefail

          SKETCH_NAME="A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY"

          mkdir -p "build/${SKETCH_NAME}"

          cp \
            "${SKETCH_NAME}.ino" \
            "build/${SKETCH_NAME}/${SKETCH_NAME}.ino"

          echo "Prepared sketch:"
          find "build/${SKETCH_NAME}" -maxdepth 1 -type f -print

      - name: Compile ESP32 Main
        shell: bash
        run: |
          set -euo pipefail

          rm -rf output/main
          mkdir -p output/main

          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app" \
            --export-binaries \
            --output-dir output/main \
            "build/A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY"

      - name: Inspect Main compiler output
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Main compiler output ==="
          find output/main -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Collect Main binaries
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/main"

          APP="$(find "$OUT" -maxdepth 1 -type f -name '*.bin' \
            ! -name '*bootloader*' \
            ! -name '*partitions*' \
            ! -name '*boot_app0*' \
            | head -n 1)"

          BOOT="$(find "$OUT" -maxdepth 1 -type f -name '*bootloader*.bin' | head -n 1)"
          PART="$(find "$OUT" -maxdepth 1 -type f -name '*partitions*.bin' | head -n 1)"
          BOOT_APP0="$(find "$OUT" -maxdepth 1 -type f -name '*boot_app0*.bin' | head -n 1)"

          echo "APP=$APP"
          echo "BOOT=$BOOT"
          echo "PART=$PART"
          echo "BOOT_APP0=$BOOT_APP0"

          test -n "$APP"
          test -n "$BOOT"
          test -n "$PART"
          test -n "$BOOT_APP0"

          cp "$APP" \
            "$OUT/SIBOAT_MAIN_ESP32_APP.bin"

          cp "$BOOT" \
            "$OUT/SIBOAT_MAIN_ESP32_BOOTLOADER.bin"

          cp "$PART" \
            "$OUT/SIBOAT_MAIN_ESP32_PARTITIONS.bin"

          cp "$BOOT_APP0" \
            "$OUT/SIBOAT_MAIN_ESP32_BOOT_APP0.bin"

      - name: Create Main all-in-one binary
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          out = Path("output/main")

          boot = (out / "SIBOAT_MAIN_ESP32_BOOTLOADER.bin").read_bytes()
          part = (out / "SIBOAT_MAIN_ESP32_PARTITIONS.bin").read_bytes()
          boot_app0 = (out / "SIBOAT_MAIN_ESP32_BOOT_APP0.bin").read_bytes()
          app = (out / "SIBOAT_MAIN_ESP32_APP.bin").read_bytes()

          def place(image, data, address):
              if len(image) > address:
                  raise SystemExit(
                      f"Existing image already exceeds 0x{address:X}"
                  )

              if len(image) < address:
                  image.extend(bytes(address - len(image)))

              image.extend(data)

          image = bytearray()

          # ESP32 flash map
          # 0x1000  bootloader
          # 0x8000  partition table
          # 0xE000  boot_app0
          # 0x10000 application

          place(image, boot, 0x1000)
          place(image, part, 0x8000)
          place(image, boot_app0, 0xE000)
          place(image, app, 0x10000)

          target = out / "SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin"
          target.write_bytes(image)

          print(f"Created: {target}")
          print(f"Size: {target.stat().st_size} bytes")
          PY

      - name: Create Main build information
        shell: bash
        run: |
          set -euo pipefail

          cat > output/main/build_info.txt <<EOF
          SIBOAT ESP32 MAIN FIRMWARE

          Firmware:
          A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

          Board:
          ESP32 Dev Module

          FQBN:
          esp32:esp32:esp32:PartitionScheme=huge_app

          ESP32 Arduino Core:
          3.3.5

          Git commit:
          ${GITHUB_SHA}

          Git branch:
          ${GITHUB_REF_NAME}

          Build:
          $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          Flash layout:

          0x1000  SIBOAT_MAIN_ESP32_BOOTLOADER.bin
          0x8000  SIBOAT_MAIN_ESP32_PARTITIONS.bin
          0xE000  SIBOAT_MAIN_ESP32_BOOT_APP0.bin
          0x10000 SIBOAT_MAIN_ESP32_APP.bin
          EOF

      - name: Create Main flash command
        shell: bash
        run: |
          set -euo pipefail

          cat > output/main/flash_command.txt <<'EOF'
          esptool.py --chip esp32 write_flash \
            0x1000 SIBOAT_MAIN_ESP32_BOOTLOADER.bin \
            0x8000 SIBOAT_MAIN_ESP32_PARTITIONS.bin \
            0xe000 SIBOAT_MAIN_ESP32_BOOT_APP0.bin \
            0x10000 SIBOAT_MAIN_ESP32_APP.bin
          EOF

      - name: Package Main firmware
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            output/main/SIBOAT_MAIN_ESP32_FLASH_PACKAGE

          cp output/main/SIBOAT_MAIN_ESP32_*.bin \
            output/main/SIBOAT_MAIN_ESP32_FLASH_PACKAGE/

          cp output/main/flash_command.txt \
            output/main/SIBOAT_MAIN_ESP32_FLASH_PACKAGE/

          cp output/main/build_info.txt \
            output/main/SIBOAT_MAIN_ESP32_FLASH_PACKAGE/

      - name: Verify Main artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -s output/main/SIBOAT_MAIN_ESP32_APP.bin
          test -s output/main/SIBOAT_MAIN_ESP32_BOOTLOADER.bin
          test -s output/main/SIBOAT_MAIN_ESP32_PARTITIONS.bin
          test -s output/main/SIBOAT_MAIN_ESP32_BOOT_APP0.bin
          test -s output/main/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin

          echo "Main firmware artifacts verified."

      - name: Upload Main firmware
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_MAIN_ESP32_FIRMWARE
          path: |
            output/main/SIBOAT_MAIN_ESP32_APP.bin
            output/main/SIBOAT_MAIN_ESP32_BOOTLOADER.bin
            output/main/SIBOAT_MAIN_ESP32_PARTITIONS.bin
            output/main/SIBOAT_MAIN_ESP32_BOOT_APP0.bin
            output/main/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin
            output/main/build_info.txt
          if-no-files-found: error

      - name: Upload Main flash package
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_MAIN_ESP32_FLASH_PACKAGE
          path: output/main/SIBOAT_MAIN_ESP32_FLASH_PACKAGE
          if-no-files-found: error


  # ============================================================
  # ESP32-CAM
  # ============================================================
  build-cam:
    name: Build ESP32-CAM Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Initialize Arduino CLI
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json

          arduino-cli config set library.enable_unsafe_install true

      - name: Update Arduino indexes
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli core update-index

      - name: Install ESP32 Arduino core 3.3.5
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli core install esp32:esp32@3.3.5

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Arduino CLI ==="
          arduino-cli version

          echo
          echo "=== Installed ESP32 cores ==="
          arduino-cli core list

      - name: Verify CAM firmware
        shell: bash
        run: |
          set -euo pipefail

          test -f A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

          echo "CAM firmware:"
          ls -lh A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

      - name: Verify Edge Impulse library
        shell: bash
        run: |
          set -euo pipefail

          test -f siboat_inferencing.zip

          echo "Inference library:"
          ls -lh siboat_inferencing.zip

      - name: Install Edge Impulse library
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli lib install \
            --zip-path siboat_inferencing.zip

      # IMPORTANT:
      # The sketch directory and .ino filename have the same basename.
      - name: Prepare CAM sketch
        shell: bash
        run: |
          set -euo pipefail

          SKETCH_NAME="A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY"

          mkdir -p "build/${SKETCH_NAME}"

          cp \
            "${SKETCH_NAME}.ino" \
            "build/${SKETCH_NAME}/${SKETCH_NAME}.ino"

          echo "Prepared sketch:"
          find "build/${SKETCH_NAME}" -maxdepth 1 -type f -print

      - name: Compile ESP32-CAM
        shell: bash
        run: |
          set -euo pipefail

          rm -rf output/cam
          mkdir -p output/cam

          arduino-cli compile \
            --fqbn "esp32:esp32:esp32cam:PartitionScheme=huge_app" \
            --export-binaries \
            --output-dir output/cam \
            "build/A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY"

      - name: Inspect CAM compiler output
        shell: bash
        run: |
          set -euo pipefail

          echo "=== CAM compiler output ==="
          find output/cam -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Collect CAM binaries
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/cam"

          APP="$(find "$OUT" -maxdepth 1 -type f -name '*.bin' \
            ! -name '*bootloader*' \
            ! -name '*partitions*' \
            ! -name '*boot_app0*' \
            | head -n 1)"

          BOOT="$(find "$OUT" -maxdepth 1 -type f -name '*bootloader*.bin' | head -n 1)"
          PART="$(find "$OUT" -maxdepth 1 -type f -name '*partitions*.bin' | head -n 1)"
          BOOT_APP0="$(find "$OUT" -maxdepth 1 -type f -name '*boot_app0*.bin' | head -n 1)"

          echo "APP=$APP"
          echo "BOOT=$BOOT"
          echo "PART=$PART"
          echo "BOOT_APP0=$BOOT_APP0"

          test -n "$APP"
          test -n "$BOOT"
          test -n "$PART"
          test -n "$BOOT_APP0"

          cp "$APP" \
            "$OUT/SIBOAT_ESP32_CAM_APP.bin"

          cp "$BOOT" \
            "$OUT/SIBOAT_ESP32_CAM_BOOTLOADER.bin"

          cp "$PART" \
            "$OUT/SIBOAT_ESP32_CAM_PARTITIONS.bin"

          cp "$BOOT_APP0" \
            "$OUT/SIBOAT_ESP32_CAM_BOOT_APP0.bin"

      - name: Create CAM all-in-one binary
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          out = Path("output/cam")

          boot = (out / "SIBOAT_ESP32_CAM_BOOTLOADER.bin").read_bytes()
          part = (out / "SIBOAT_ESP32_CAM_PARTITIONS.bin").read_bytes()
          boot_app0 = (out / "SIBOAT_ESP32_CAM_BOOT_APP0.bin").read_bytes()
          app = (out / "SIBOAT_ESP32_CAM_APP.bin").read_bytes()

          def place(image, data, address):
              if len(image) > address:
                  raise SystemExit(
                      f"Existing image already exceeds 0x{address:X}"
                  )

              if len(image) < address:
                  image.extend(bytes(address - len(image)))

              image.extend(data)

          image = bytearray()

          # ESP32 flash map
          # 0x1000  bootloader
          # 0x8000  partition table
          # 0xE000  boot_app0
          # 0x10000 application

          place(image, boot, 0x1000)
          place(image, part, 0x8000)
          place(image, boot_app0, 0xE000)
          place(image, app, 0x10000)

          target = out / "SIBOAT_ESP32_CAM_ALL-IN-ONE.bin"
          target.write_bytes(image)

          print(f"Created: {target}")
          print(f"Size: {target.stat().st_size} bytes")
          PY

      - name: Create CAM build information
        shell: bash
        run: |
          set -euo pipefail

          cat > output/cam/build_info.txt <<EOF
          SIBOAT ESP32-CAM FIRMWARE

          Firmware:
          A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

          Board:
          ESP32-CAM

          FQBN:
          esp32:esp32:esp32cam:PartitionScheme=huge_app

          ESP32 Arduino Core:
          3.3.5

          Edge Impulse library:
          siboat_inferencing.zip

          Git commit:
          ${GITHUB_SHA}

          Git branch:
          ${GITHUB_REF_NAME}

          Build:
          $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          Flash layout:

          0x1000  SIBOAT_ESP32_CAM_BOOTLOADER.bin
          0x8000  SIBOAT_ESP32_CAM_PARTITIONS.bin
          0xE000  SIBOAT_ESP32_CAM_BOOT_APP0.bin
          0x10000 SIBOAT_ESP32_CAM_APP.bin
          EOF

      - name: Create CAM flash command
        shell: bash
        run: |
          set -euo pipefail

          cat > output/cam/flash_command.txt <<'EOF'
          esptool.py --chip esp32 write_flash \
            0x1000 SIBOAT_ESP32_CAM_BOOTLOADER.bin \
            0x8000 SIBOAT_ESP32_CAM_PARTITIONS.bin \
            0xe000 SIBOAT_ESP32_CAM_BOOT_APP0.bin \
            0x10000 SIBOAT_ESP32_CAM_APP.bin
          EOF

      - name: Package CAM firmware
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            output/cam/SIBOAT_ESP32_CAM_FLASH_PACKAGE

          cp output/cam/SIBOAT_ESP32_CAM_*.bin \
            output/cam/SIBOAT_ESP32_CAM_FLASH_PACKAGE/

          cp output/cam/flash_command.txt \
            output/cam/SIBOAT_ESP32_CAM_FLASH_PACKAGE/

          cp output/cam/build_info.txt \
            output/cam/SIBOAT_ESP32_CAM_FLASH_PACKAGE/

      - name: Verify CAM artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -s output/cam/SIBOAT_ESP32_CAM_APP.bin
          test -s output/cam/SIBOAT_ESP32_CAM_BOOTLOADER.bin
          test -s output/cam/SIBOAT_ESP32_CAM_PARTITIONS.bin
          test -s output/cam/SIBOAT_ESP32_CAM_BOOT_APP0.bin
          test -s output/cam/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin

          echo "CAM firmware artifacts verified."

      - name: Upload CAM firmware
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_ESP32_CAM_FIRMWARE
          path: |
            output/cam/SIBOAT_ESP32_CAM_APP.bin
            output/cam/SIBOAT_ESP32_CAM_BOOTLOADER.bin
            output/cam/SIBOAT_ESP32_CAM_PARTITIONS.bin
            output/cam/SIBOAT_ESP32_CAM_BOOT_APP0.bin
            output/cam/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin
            output/cam/build_info.txt
          if-no-files-found: error

      - name: Upload CAM flash package
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_ESP32_CAM_FLASH_PACKAGE
          path: output/cam/SIBOAT_ESP32_CAM_FLASH_PACKAGE
          if-no-files-found: error
