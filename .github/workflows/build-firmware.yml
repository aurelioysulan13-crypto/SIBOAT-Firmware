name: Build SIBOAT Firmware

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  ESP32_CORE: "3.3.5"
  ESP32_INDEX_URL: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
  ARDUINO_UPDATER_ENABLE_NOTIFICATION: "false"

jobs:

  # ==========================================================
  # MAIN ESP32
  # ==========================================================
  build-main:
    name: Build MAIN ESP32
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install ESP32 Arduino core
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli config init
          arduino-cli config add board_manager.additional_urls "$ESP32_INDEX_URL"
          arduino-cli core update-index --additional-urls "$ESP32_INDEX_URL"
          arduino-cli core install "esp32:esp32@${ESP32_CORE}" \
            --additional-urls "$ESP32_INDEX_URL"

          echo "Installed ESP32 core:"
          arduino-cli core list | grep '^esp32:esp32' || true

      - name: Verify MAIN source and Wi-Fi profile order
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino"

          test -f "$SOURCE"

          python3 - "$SOURCE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8", errors="strict")

          required = [
              '{ "SIBOAT NETWORK",',
              '{ "bleach.",',
              '{ "Private Wifi",',
          ]

          positions = []

          for token in required:
              pos = text.find(token)

              if pos < 0:
                  raise SystemExit(
                      f"Missing required Wi-Fi profile token in "
                      f"{path.name}: {token}"
                  )

              positions.append(pos)

          if positions != sorted(positions):
              raise SystemExit(
                  "Wi-Fi profile order is not SSID1 -> SSID2 -> SSID3"
              )

          print(
              f"Verified {path.name}: "
              "SSID1 -> SSID2 -> SSID3"
          )
          PY

      - name: Verify MAIN discovery integration
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino"

          grep -q 'SIBOAT_DISCOVERY_DEVICE_ID' "$SOURCE"
          grep -q 'seabot_register_device' "$SOURCE"
          grep -q 'WiFiClientSecure' "$SOURCE"
          grep -q 'HTTPClient' "$SOURCE"
          grep -q 'SIBOAT-MAIN' "$SOURCE"

          echo "MAIN discovery integration verified."

      - name: Prepare MAIN sketch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build_work output/main

          mkdir -p build_work/siboat_main
          mkdir -p build_work/source
          mkdir -p output/main/build

          cp \
            A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino \
            build_work/source/siboat_main.cpp

          cat > build_work/siboat_main/siboat_main.ino <<'EOF'
          #include "../source/siboat_main.cpp"
          EOF

          echo "MAIN sketch prepared:"
          find build_work/siboat_main -maxdepth 2 -type f -print

      - name: Compile ESP32 MAIN
        shell: bash
        run: |
          set -euo pipefail

          FQBN="esp32:esp32:esp32:PartitionScheme=huge_app"
          LOG="output/main/compile.log"

          {
            echo "=============================================="
            echo "SIBOAT MAIN ESP32 BUILD"
            echo "=============================================="
            echo "Arduino-ESP32 core: $ESP32_CORE"
            echo "FQBN: $FQBN"
            echo "Partition: Huge APP"
            echo "Source: A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino"
            echo ""
          } | tee "$LOG"

          arduino-cli compile \
            --fqbn "$FQBN" \
            --output-dir output/main/build \
            --export-binaries \
            --warnings none \
            --clean \
            build_work/siboat_main \
            2>&1 | tee -a "$LOG"

      - name: Verify and collect MAIN binaries
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/main"
          BUILD="$OUT/build"

          echo "Generated MAIN files:"
          find "$BUILD" -type f 2>/dev/null | sort || true

          APP="$(
            find "$BUILD" \
              -type f \
              -name 'siboat_main.ino.bin' \
              -print -quit 2>/dev/null || true
          )"

          BOOT="$(
            find "$BUILD" \
              -type f \
              -name 'siboat_main.ino.bootloader.bin' \
              -print -quit 2>/dev/null || true
          )"

          PART="$(
            find "$BUILD" \
              -type f \
              -name 'siboat_main.ino.partitions.bin' \
              -print -quit 2>/dev/null || true
          )"

          BOOT_APP0="$(
            find "$HOME/.arduino15/packages/esp32" \
              -type f \
              -path '*/tools/partitions/boot_app0.bin' \
              -print -quit 2>/dev/null || true
          )"

          test -s "$APP"
          test -s "$BOOT"
          test -s "$PART"
          test -s "$BOOT_APP0"

          cp "$APP" \
            "$OUT/SIBOAT_MAIN_ESP32_APP.bin"

          cp "$BOOT" \
            "$OUT/SIBOAT_MAIN_ESP32_BOOTLOADER.bin"

          cp "$PART" \
            "$OUT/SIBOAT_MAIN_ESP32_PARTITIONS.bin"

          cp "$BOOT_APP0" \
            "$OUT/SIBOAT_MAIN_ESP32_BOOT_APP0.bin"

          cat > "$OUT/build_info.txt" <<EOF
          SIBOAT MAIN ESP32 BUILD

          Git commit: $GITHUB_SHA

          Arduino-ESP32 core: $ESP32_CORE

          FQBN:
          esp32:esp32:esp32:PartitionScheme=huge_app

          Source:
          A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

          Wi-Fi profile order:
          SSID1 = SIBOAT NETWORK
          SSID2 = bleach.
          SSID3 = Private Wifi

          Discovery:
          Device ID = SIBOAT-MAIN
          RPC = seabot_register_device

          Intended MAIN static IP:
          10.90.102.50
          EOF

      - name: Create MAIN all-in-one binary
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/main"

          python3 - <<'PY'
          from pathlib import Path

          out = Path("output/main")

          boot = (out / "SIBOAT_MAIN_ESP32_BOOTLOADER.bin").read_bytes()
          part = (out / "SIBOAT_MAIN_ESP32_PARTITIONS.bin").read_bytes()
          app = (out / "SIBOAT_MAIN_ESP32_APP.bin").read_bytes()
          boot_app0 = (out / "SIBOAT_MAIN_ESP32_BOOT_APP0.bin").read_bytes()

          def pad_to(data, address):
              if len(data) > address:
                  raise SystemExit(
                      f"Binary is larger than its target address: "
                      f"{len(data)} > {address}"
                  )

              return data + bytes(address - len(data))

          image = bytearray()

          image += pad_to(boot, 0x1000)

          if len(image) < 0x8000:
              image += bytes(0x8000 - len(image))

          image += part

          if len(image) < 0xE000:
              image += bytes(0xE000 - len(image))

          image += boot_app0

          if len(image) < 0x10000:
              image += bytes(0x10000 - len(image))

          image += app

          target = out / "SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin"
          target.write_bytes(image)

          print(
              f"Created {target} "
              f"({target.stat().st_size} bytes)"
          )
          PY

      - name: Package MAIN flash files
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/main"

          cat > "$OUT/flash_command.txt" <<'EOF'
          esptool.py --chip esp32 write_flash \
            0x1000 SIBOAT_MAIN_ESP32_BOOTLOADER.bin \
            0x8000 SIBOAT_MAIN_ESP32_PARTITIONS.bin \
            0xe000 SIBOAT_MAIN_ESP32_BOOT_APP0.bin \
            0x10000 SIBOAT_MAIN_ESP32_APP.bin
          EOF

          mkdir -p "$OUT/SIBOAT_MAIN_ESP32_FLASH_PACKAGE"

          cp "$OUT"/SIBOAT_MAIN_ESP32_*.bin \
            "$OUT/SIBOAT_MAIN_ESP32_FLASH_PACKAGE/"

          cp "$OUT/flash_command.txt" \
            "$OUT/SIBOAT_MAIN_ESP32_FLASH_PACKAGE/"

          cp "$OUT/build_info.txt" \
            "$OUT/SIBOAT_MAIN_ESP32_FLASH_PACKAGE/"

      - name: Upload MAIN firmware
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_MAIN_ESP32_FIRMWARE
          path: |
            output/main/SIBOAT_MAIN_ESP32_APP.bin
            output/main/SIBOAT_MAIN_ESP32_BOOTLOADER.bin
            output/main/SIBOAT_MAIN_ESP32_PARTITIONS.bin
            output/main/SIBOAT_MAIN_ESP32_BOOT_APP0.bin
            output/main/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin
            output/main/build_info.txt
          if-no-files-found: error

      - name: Upload MAIN flash package
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_MAIN_ESP32_FLASH_PACKAGE
          path: output/main/SIBOAT_MAIN_ESP32_FLASH_PACKAGE
          if-no-files-found: error


  # ==========================================================
  # ESP32-CAM
  # ==========================================================
  build-cam:
    name: Build ESP32-CAM
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install ESP32 Arduino core
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli config init
          arduino-cli config add board_manager.additional_urls "$ESP32_INDEX_URL"
          arduino-cli core update-index --additional-urls "$ESP32_INDEX_URL"
          arduino-cli core install "esp32:esp32@${ESP32_CORE}" \
            --additional-urls "$ESP32_INDEX_URL"

          echo "Installed ESP32 core:"
          arduino-cli core list | grep '^esp32:esp32' || true

      - name: Locate Edge Impulse library
        shell: bash
        run: |
          set -euo pipefail

          ZIP="siboat_inferencing.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found."
            echo ""
            echo "The ESP32-CAM build requires:"
            echo "  siboat_inferencing.zip"
            echo ""
            echo "Place it in the repository root."
            exit 1
          fi

          ls -lh "$ZIP"

      - name: Enable unsafe ZIP library installation
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli config set library.enable_unsafe_install true

          echo "Arduino CLI unsafe library installation enabled."

      - name: Install Edge Impulse library
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build_work/library
          mkdir -p build_work/library

          arduino-cli lib install \
            --zip-path "$PWD/siboat_inferencing.zip"

          echo "Installed libraries:"
          arduino-cli lib list

      - name: Verify CAM source and Wi-Fi profile order
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino"

          test -f "$SOURCE"

          python3 - "$SOURCE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8", errors="strict")

          required = [
              '{ "SIBOAT NETWORK",',
              '{ "bleach.",',
              '{ "Private Wifi",',
          ]

          positions = []

          for token in required:
              pos = text.find(token)

              if pos < 0:
                  raise SystemExit(
                      f"Missing required Wi-Fi profile token in "
                      f"{path.name}: {token}"
                  )

              positions.append(pos)

          if positions != sorted(positions):
              raise SystemExit(
                  "Wi-Fi profile order is not SSID1 -> SSID2 -> SSID3"
              )

          print(
              f"Verified {path.name}: "
              "SSID1 -> SSID2 -> SSID3"
          )
          PY

      - name: Verify CAM discovery integration
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino"

          grep -q 'SIBOAT_DISCOVERY_DEVICE_ID' "$SOURCE"
          grep -q 'SIBOAT-CAM' "$SOURCE"
          grep -q 'seabot_register_device' "$SOURCE"
          grep -q 'WiFiClientSecure' "$SOURCE"
          grep -q 'HTTPClient' "$SOURCE"
          grep -q 'ESPmDNS' "$SOURCE"

          echo "CAM discovery integration verified."

      - name: Prepare CAM sketch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build_work/siboat_cam output/cam

          mkdir -p build_work/siboat_cam
          mkdir -p build_work/source
          mkdir -p output/cam/build

          cp \
            A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino \
            build_work/source/siboat_cam.cpp

          cat > build_work/siboat_cam/siboat_cam.ino <<'EOF'
          #include "../source/siboat_cam.cpp"
          EOF

          echo "CAM sketch prepared:"
          find build_work/siboat_cam -maxdepth 2 -type f -print

      - name: Compile ESP32-CAM
        shell: bash
        run: |
          set -euo pipefail

          FQBN="esp32:esp32:esp32cam:PartitionScheme=huge_app"
          LOG="output/cam/compile.log"

          {
            echo "=============================================="
            echo "SIBOAT ESP32-CAM BUILD"
            echo "=============================================="
            echo "Arduino-ESP32 core: $ESP32_CORE"
            echo "FQBN: $FQBN"
            echo "Board: AI Thinker ESP32-CAM"
            echo "Partition: Huge APP"
            echo "PSRAM: board definition enables PSRAM"
            echo "Source: A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino"
            echo "Edge Impulse library: siboat_inferencing.zip"
            echo ""
          } | tee "$LOG"

          arduino-cli compile \
            --fqbn "$FQBN" \
            --library "$PWD/build_work/library/siboat_inferencing" \
            --output-dir output/cam/build \
            --export-binaries \
            --warnings none \
            --clean \
            build_work/siboat_cam \
            2>&1 | tee -a "$LOG"

      - name: Verify and collect CAM binaries
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/cam"
          BUILD="$OUT/build"

          echo "Generated CAM files:"
          find "$BUILD" -type f 2>/dev/null | sort || true

          APP="$(
            find "$BUILD" \
              -type f \
              -name 'siboat_cam.ino.bin' \
              -print -quit 2>/dev/null || true
          )"

          BOOT="$(
            find "$BUILD" \
              -type f \
              -name 'siboat_cam.ino.bootloader.bin' \
              -print -quit 2>/dev/null || true
          )"

          PART="$(
            find "$BUILD" \
              -type f \
              -name 'siboat_cam.ino.partitions.bin' \
              -print -quit 2>/dev/null || true
          )"

          BOOT_APP0="$(
            find "$HOME/.arduino15/packages/esp32" \
              -type f \
              -path '*/tools/partitions/boot_app0.bin' \
              -print -quit 2>/dev/null || true
          )"

          test -s "$APP"
          test -s "$BOOT"
          test -s "$PART"
          test -s "$BOOT_APP0"

          cp "$APP" \
            "$OUT/SIBOAT_ESP32_CAM_APP.bin"

          cp "$BOOT" \
            "$OUT/SIBOAT_ESP32_CAM_BOOTLOADER.bin"

          cp "$PART" \
            "$OUT/SIBOAT_ESP32_CAM_PARTITIONS.bin"

          cp "$BOOT_APP0" \
            "$OUT/SIBOAT_ESP32_CAM_BOOT_APP0.bin"

          cat > "$OUT/build_info.txt" <<EOF
          SIBOAT ESP32-CAM BUILD

          Git commit: $GITHUB_SHA

          Arduino-ESP32 core: $ESP32_CORE

          FQBN:
          esp32:esp32:esp32cam:PartitionScheme=huge_app

          Board:
          AI Thinker ESP32-CAM

          Source:
          A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

          Edge Impulse library:
          siboat_inferencing.zip

          Wi-Fi profile order:
          SSID1 = SIBOAT NETWORK
          SSID2 = bleach.
          SSID3 = Private Wifi

          Discovery:
          Device ID = SIBOAT-CAM
          RPC = seabot_register_device

          Intended CAM static IP:
          10.90.102.51

          mDNS:
          siboat-cam.local

          HTTP/stream port:
          81
          EOF

      - name: Create CAM all-in-one binary
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/cam"

          python3 - <<'PY'
          from pathlib import Path

          out = Path("output/cam")

          boot = (out / "SIBOAT_ESP32_CAM_BOOTLOADER.bin").read_bytes()
          part = (out / "SIBOAT_ESP32_CAM_PARTITIONS.bin").read_bytes()
          app = (out / "SIBOAT_ESP32_CAM_APP.bin").read_bytes()
          boot_app0 = (out / "SIBOAT_ESP32_CAM_BOOT_APP0.bin").read_bytes()

          def pad_to(data, address):
              if len(data) > address:
                  raise SystemExit(
                      f"Binary is larger than its target address: "
                      f"{len(data)} > {address}"
                  )

              return data + bytes(address - len(data))

          image = bytearray()

          image += pad_to(boot, 0x1000)

          if len(image) < 0x8000:
              image += bytes(0x8000 - len(image))

          image += part

          if len(image) < 0xE000:
              image += bytes(0xE000 - len(image))

          image += boot_app0

          if len(image) < 0x10000:
              image += bytes(0x10000 - len(image))

          image += app

          target = out / "SIBOAT_ESP32_CAM_ALL-IN-ONE.bin"
          target.write_bytes(image)

          print(
              f"Created {target} "
              f"({target.stat().st_size} bytes)"
          )
          PY

      - name: Package CAM flash files
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/cam"

          cat > "$OUT/flash_command.txt" <<'EOF'
          esptool.py --chip esp32 write_flash \
            0x1000 SIBOAT_ESP32_CAM_BOOTLOADER.bin \
            0x8000 SIBOAT_ESP32_CAM_PARTITIONS.bin \
            0xe000 SIBOAT_ESP32_CAM_BOOT_APP0.bin \
            0x10000 SIBOAT_ESP32_CAM_APP.bin
          EOF

          mkdir -p "$OUT/SIBOAT_ESP32_CAM_FLASH_PACKAGE"

          cp "$OUT"/SIBOAT_ESP32_CAM_*.bin \
            "$OUT/SIBOAT_ESP32_CAM_FLASH_PACKAGE/"

          cp "$OUT/flash_command.txt" \
            "$OUT/SIBOAT_ESP32_CAM_FLASH_PACKAGE/"

          cp "$OUT/build_info.txt" \
            "$OUT/SIBOAT_ESP32_CAM_FLASH_PACKAGE/"

      - name: Upload CAM firmware
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_ESP32_CAM_FIRMWARE
          path: |
            output/cam/SIBOAT_ESP32_CAM_APP.bin
            output/cam/SIBOAT_ESP32_CAM_BOOTLOADER.bin
            output/cam/SIBOAT_ESP32_CAM_PARTITIONS.bin
            output/cam/SIBOAT_ESP32_CAM_BOOT_APP0.bin
            output/cam/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin
            output/cam/build_info.txt
          if-no-files-found: error

      - name: Upload CAM flash package
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_ESP32_CAM_FLASH_PACKAGE
          path: output/cam/SIBOAT_ESP32_CAM_FLASH_PACKAGE
          if-no-files-found: error
