name: Build SIBOAT ESP32 Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ARDUINO_CLI_VERSION: "1.5.1"
  ESP32_CORE_VERSION: "3.3.5"
  ESP32_BOARD_URL: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"

jobs:

  # ============================================================
  # ESP32 MAIN
  # ============================================================
  build-main:
    name: Build ESP32 Main
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Configure Arduino CLI
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            "${ESP32_BOARD_URL}"

      - name: Update Arduino indexes
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core update-index

      - name: Install ESP32 Arduino core
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}"

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "===== ARDUINO CLI ====="
          arduino-cli version

          echo
          echo "===== ESP32 CORE ====="
          arduino-cli core list

      - name: Verify Main source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino"

          test -f "$SOURCE"

          echo "Main source found:"
          ls -lh "$SOURCE"

      # ----------------------------------------------------------
      # Prepare a clean Arduino-compatible Main sketch.
      #
      # Arduino's .ino preprocessor generates function prototypes
      # before the user-defined structs in this sketch.  The
      # forward-declaration header makes those generated prototypes
      # valid.
      #
      # The existing StringSumHelper error is corrected only in the
      # temporary build copy so the repository source is not silently
      # rewritten by the action.
      # ----------------------------------------------------------
      - name: Prepare Main sketch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/main output/main
          mkdir -p build/main output/main

          cat > build/main/siboat_forward_types.h <<'EOF'
          #ifndef SIBOAT_FORWARD_TYPES_H
          #define SIBOAT_FORWARD_TYPES_H

          struct Motor;
          struct EventRec;
          struct WsClient;
          struct Jw;

          #endif
          EOF

          python3 <<'PY'
          from pathlib import Path

          source = Path("A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino")
          target = Path("build/main/main.ino")

          text = source.read_text(encoding="utf-8")
          lines = text.splitlines()

          # The current source has one StringSumHelper -> const char*
          # call at the joystick rejection response.
          matches = [
              i for i, line in enumerate(lines)
              if line.strip().startswith("sendJson(409, String(")
          ]

          if len(matches) != 1:
              raise RuntimeError(
                  f"Expected exactly one joystick sendJson(409, String(...)) "
                  f"line, found {len(matches)}"
              )

          i = matches[0]

          replacement = [
              '    String errBody = String("{\\"ok\\":false,\\"applied\\":false,\\"error\\":\\"") + why + "\\"}";',
              '    sendJson(409, errBody.c_str());'
          ]

          lines[i:i + 1] = replacement

          fixed = "\n".join(lines) + "\n"

          # Put the forward declarations before Arduino's generated
          # function prototypes through an included header.
          fixed = '#include "siboat_forward_types.h"\n' + fixed

          target.write_text(fixed, encoding="utf-8")

          print(f"Created {target}")
          print(f"Lines: {len(fixed.splitlines())}")
          PY

          echo
          echo "===== PREPARED MAIN SKETCH ====="
          ls -lh build/main/
          echo
          head -n 25 build/main/main.ino

      # ----------------------------------------------------------
      # Show the actual generated Arduino preprocessor output.
      # This lets the action verify the custom types are visible
      # before the generated function prototypes.
      # ----------------------------------------------------------
      - name: Validate Main preprocessing
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli compile \
            --clean \
            --preprocess \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app" \
            "build/main" \
            > build/main/preprocessed.cpp

          python3 <<'PY'
          from pathlib import Path

          p = Path("build/main/preprocessed.cpp")
          text = p.read_text(encoding="utf-8", errors="replace")

          checks = {
              "Jw": "void jwRaw(Jw&",
              "Motor": "void motorWrite(Motor&",
              "EventRec": "void eventToJson(const EventRec&",
              "WsClient": "void wsClose(WsClient&",
          }

          for type_name, prototype in checks.items():
              type_pos = text.find(f"struct {type_name};")
              if type_pos == -1:
                  raise RuntimeError(
                      f"Forward declaration for {type_name} not found"
                  )

              proto_pos = text.find(prototype)
              if proto_pos == -1:
                  raise RuntimeError(
                      f"Expected generated prototype containing "
                      f"'{prototype}' not found"
                  )

              if type_pos > proto_pos:
                  raise RuntimeError(
                      f"Forward declaration for {type_name} appears "
                      f"after its generated prototype"
                  )

          print("Main preprocessing validation passed.")
          PY

      - name: Compile ESP32 Main
        shell: bash
        run: |
          set -euo pipefail

          rm -rf output/main
          mkdir -p output/main

          arduino-cli compile \
            --clean \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app" \
            --export-binaries \
            --output-dir "output/main" \
            "build/main"

      - name: Verify Main compiler output
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/main"

          test -s "$OUT/main.ino.bin"
          test -s "$OUT/main.ino.bootloader.bin"
          test -s "$OUT/main.ino.partitions.bin"
          test -s "$OUT/main.ino.merged.bin"

          echo "===== MAIN OUTPUT ====="
          ls -lh "$OUT"

      - name: Collect Main firmware images
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/main"

          cp "$OUT/main.ino.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_APP.bin"

          cp "$OUT/main.ino.bootloader.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_BOOTLOADER.bin"

          cp "$OUT/main.ino.partitions.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_PARTITIONS.bin"

          cp "$OUT/main.ino.merged.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin"

          echo "===== COLLECTED MAIN IMAGES ====="
          ls -lh \
            "$OUT/SIBOAT_MAIN_ESP32_APP.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_BOOTLOADER.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_PARTITIONS.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin"

      - name: Create Main build information
        shell: bash
        run: |
          set -euo pipefail

          cat > output/main/build_info.txt <<EOF
          SIBOAT ESP32 MAIN FIRMWARE

          Source:
          A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

          Build sketch:
          build/main/main.ino

          Board:
          ESP32

          FQBN:
          esp32:esp32:esp32:PartitionScheme=huge_app

          ESP32 Arduino Core:
          ${ESP32_CORE_VERSION}

          Arduino CLI:
          ${ARDUINO_CLI_VERSION}

          Git commit:
          ${GITHUB_SHA}

          Git branch:
          ${GITHUB_REF_NAME}

          Build time:
          $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          Arduino-generated merged image:
          SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin

          The merged image contains the ESP32 bootloader,
          partition table, boot_app0 and application image.
          EOF

      - name: Create Main flash command
        shell: bash
        run: |
          set -euo pipefail

          cat > output/main/flash_command.txt <<'EOF'
          esptool --chip esp32 write-flash \
            0x0 SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin
          EOF

      - name: Create Main flash package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="output/main/SIBOAT_MAIN_ESP32_FLASH_PACKAGE"

          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE"

          cp output/main/SIBOAT_MAIN_ESP32_APP.bin "$PACKAGE/"
          cp output/main/SIBOAT_MAIN_ESP32_BOOTLOADER.bin "$PACKAGE/"
          cp output/main/SIBOAT_MAIN_ESP32_PARTITIONS.bin "$PACKAGE/"
          cp output/main/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin "$PACKAGE/"
          cp output/main/build_info.txt "$PACKAGE/"
          cp output/main/flash_command.txt "$PACKAGE/"

      - name: Verify Main artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -s "output/main/SIBOAT_MAIN_ESP32_APP.bin"
          test -s "output/main/SIBOAT_MAIN_ESP32_BOOTLOADER.bin"
          test -s "output/main/SIBOAT_MAIN_ESP32_PARTITIONS.bin"
          test -s "output/main/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin"
          test -s "output/main/build_info.txt"
          test -s "output/main/flash_command.txt"

          echo "Main firmware artifacts verified."

      - name: Upload Main firmware
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_MAIN_ESP32_FIRMWARE
          path: |
            output/main/SIBOAT_MAIN_ESP32_APP.bin
            output/main/SIBOAT_MAIN_ESP32_BOOTLOADER.bin
            output/main/SIBOAT_MAIN_ESP32_PARTITIONS.bin
            output/main/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin
            output/main/build_info.txt
            output/main/flash_command.txt
          if-no-files-found: error

      - name: Upload Main flash package
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_MAIN_ESP32_FLASH_PACKAGE
          path: output/main/SIBOAT_MAIN_ESP32_FLASH_PACKAGE
          if-no-files-found: error


  # ============================================================
  # ESP32-CAM
  # ============================================================
  build-cam:
    name: Build ESP32-CAM
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Configure Arduino CLI
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            "${ESP32_BOARD_URL}"

          arduino-cli config set library.enable_unsafe_install true

      - name: Update Arduino indexes
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core update-index

      - name: Install ESP32 Arduino core
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}"

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "===== ARDUINO CLI ====="
          arduino-cli version

          echo
          echo "===== ESP32 CORE ====="
          arduino-cli core list

      - name: Verify CAM source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino"

          test -f "$SOURCE"

          echo "CAM source found:"
          ls -lh "$SOURCE"

      - name: Verify inference library
        shell: bash
        run: |
          set -euo pipefail

          test -f "siboat_inferencing.zip"

          echo "Inference library found:"
          ls -lh "siboat_inferencing.zip"

      - name: Install inference library
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli lib install \
            --zip-path "siboat_inferencing.zip"

      - name: Prepare CAM sketch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/cam output/cam
          mkdir -p build/cam output/cam

          cp \
            "A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino" \
            "build/cam/cam.ino"

          echo "===== PREPARED CAM SKETCH ====="
          ls -lh build/cam/

      - name: Compile ESP32-CAM
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli compile \
            --clean \
            --fqbn "esp32:esp32:esp32cam:PartitionScheme=huge_app" \
            --export-binaries \
            --output-dir "output/cam" \
            "build/cam"

      - name: Verify CAM compiler output
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/cam"

          test -s "$OUT/cam.ino.bin"
          test -s "$OUT/cam.ino.bootloader.bin"
          test -s "$OUT/cam.ino.partitions.bin"
          test -s "$OUT/cam.ino.merged.bin"

          echo "===== CAM OUTPUT ====="
          ls -lh "$OUT"

      - name: Collect CAM firmware images
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/cam"

          cp "$OUT/cam.ino.bin" \
            "$OUT/SIBOAT_ESP32_CAM_APP.bin"

          cp "$OUT/cam.ino.bootloader.bin" \
            "$OUT/SIBOAT_ESP32_CAM_BOOTLOADER.bin"

          cp "$OUT/cam.ino.partitions.bin" \
            "$OUT/SIBOAT_ESP32_CAM_PARTITIONS.bin"

          cp "$OUT/cam.ino.merged.bin" \
            "$OUT/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin"

          echo "===== COLLECTED CAM IMAGES ====="
          ls -lh \
            "$OUT/SIBOAT_ESP32_CAM_APP.bin" \
            "$OUT/SIBOAT_ESP32_CAM_BOOTLOADER.bin" \
            "$OUT/SIBOAT_ESP32_CAM_PARTITIONS.bin" \
            "$OUT/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin"

      - name: Create CAM build information
        shell: bash
        run: |
          set -euo pipefail

          cat > output/cam/build_info.txt <<EOF
          SIBOAT ESP32-CAM FIRMWARE

          Source:
          A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

          Build sketch:
          build/cam/cam.ino

          Board:
          ESP32-CAM

          FQBN:
          esp32:esp32:esp32cam:PartitionScheme=huge_app

          ESP32 Arduino Core:
          ${ESP32_CORE_VERSION}

          Arduino CLI:
          ${ARDUINO_CLI_VERSION}

          Inference library:
          siboat_inferencing.zip

          Git commit:
          ${GITHUB_SHA}

          Git branch:
          ${GITHUB_REF_NAME}

          Build time:
          $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          Arduino-generated merged image:
          SIBOAT_ESP32_CAM_ALL-IN-ONE.bin

          The merged image contains the ESP32 bootloader,
          partition table, boot_app0 and application image.
          EOF

      - name: Create CAM flash command
        shell: bash
        run: |
          set -euo pipefail

          cat > output/cam/flash_command.txt <<'EOF'
          esptool --chip esp32 write-flash \
            0x0 SIBOAT_ESP32_CAM_ALL-IN-ONE.bin
          EOF

      - name: Create CAM flash package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="output/cam/SIBOAT_ESP32_CAM_FLASH_PACKAGE"

          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE"

          cp output/cam/SIBOAT_ESP32_CAM_APP.bin "$PACKAGE/"
          cp output/cam/SIBOAT_ESP32_CAM_BOOTLOADER.bin "$PACKAGE/"
          cp output/cam/SIBOAT_ESP32_CAM_PARTITIONS.bin "$PACKAGE/"
          cp output/cam/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin "$PACKAGE/"
          cp output/cam/build_info.txt "$PACKAGE/"
          cp output/cam/flash_command.txt "$PACKAGE/"

      - name: Verify CAM artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -s "output/cam/SIBOAT_ESP32_CAM_APP.bin"
          test -s "output/cam/SIBOAT_ESP32_CAM_BOOTLOADER.bin"
          test -s "output/cam/SIBOAT_ESP32_CAM_PARTITIONS.bin"
          test -s "output/cam/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin"
          test -s "output/cam/build_info.txt"
          test -s "output/cam/flash_command.txt"

          echo "CAM firmware artifacts verified."

      - name: Upload CAM firmware
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_ESP32_CAM_FIRMWARE
          path: |
            output/cam/SIBOAT_ESP32_CAM_APP.bin
            output/cam/SIBOAT_ESP32_CAM_BOOTLOADER.bin
            output/cam/SIBOAT_ESP32_CAM_PARTITIONS.bin
            output/cam/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin
            output/cam/build_info.txt
            output/cam/flash_command.txt
          if-no-files-found: error

      - name: Upload CAM flash package
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_ESP32_CAM_FLASH_PACKAGE
          path: output/cam/SIBOAT_ESP32_CAM_FLASH_PACKAGE
          if-no-files-found: error
