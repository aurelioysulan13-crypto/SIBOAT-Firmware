name: Build SIBOAT ESP32 Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ARDUINO_CLI_VERSION: "1.5.1"
  ESP32_CORE_VERSION: "3.3.5"
  ESP32_BOARD_URL: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"

jobs:

  # ============================================================
  # ESP32 MAIN
  # ============================================================
  build-main:
    name: Build ESP32 Main
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Configure Arduino CLI
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            "${ESP32_BOARD_URL}"

      - name: Update Arduino indexes
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli core update-index

      - name: Install ESP32 Arduino core
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli core install \
            "esp32:esp32@${ESP32_CORE_VERSION}"

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "===== ARDUINO CLI ====="
          arduino-cli version

          echo
          echo "===== ESP32 CORE ====="
          arduino-cli core list

      - name: Verify Main source
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            "A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino"

          echo "Main source found."

          ls -lh \
            "A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino"

      # ----------------------------------------------------------
      # MAIN BUILD PREPARATION
      #
      # The firmware is intentionally copied into .inc rather than
      # compiled directly as .ino.
      #
      # This prevents Arduino's automatic .ino prototype generation
      # from generating invalid prototypes for the firmware's custom
      # types.
      # ----------------------------------------------------------
      - name: Prepare Main sketch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/main
          rm -rf output/main

          mkdir -p build/main
          mkdir -p output/main

          cp \
            "A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino" \
            "build/main/main_source.inc"

          # Compatibility fix for Arduino/ESP32 compiler:
          # avoid passing a StringSumHelper expression directly to
          # sendJson(const char*).
          python3 <<'PY'
          from pathlib import Path

          source = Path("build/main/main_source.inc")

          text = source.read_text(encoding="utf-8")

          old = (
              '    sendJson(409, '
              'String("{\\"ok\\":false,\\"applied\\":false,\\"error\\":\\"") '
              '+ why + "\\"}");'
          )

          new = (
              '    String errBody = '
              'String("{\\"ok\\":false,\\"applied\\":false,\\"error\\":\\"") '
              '+ why + "\\"}";\n'
              '    sendJson(409, errBody.c_str());'
          )

          count = text.count(old)

          if count != 1:
              raise RuntimeError(
                  "Expected exactly one StringSumHelper expression "
                  f"to replace, but found {count}."
              )

          text = text.replace(old, new, 1)

          source.write_text(text, encoding="utf-8")

          print("Main source prepared successfully.")
          print("StringSumHelper compatibility fix applied.")
          PY

          cat > build/main/main.ino <<'EOF'
          #include "main_source.inc"
          EOF

          echo
          echo "===== MAIN SKETCH DIRECTORY ====="

          find build/main \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      # ----------------------------------------------------------
      # NO CUSTOM PROTOTYPE VALIDATION
      #
      # Do not add:
      #   - forward-declaration validation
      #   - Arduino --preprocess validation
      #   - generated prototype checks
      #
      # The .inc wrapper is the workaround.
      # ----------------------------------------------------------
      - name: Compile ESP32 Main
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli compile \
            --clean \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app" \
            --export-binaries \
            --output-dir "output/main" \
            "build/main"

      - name: Verify Main compiler output
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/main"

          echo "===== MAIN BUILD OUTPUT ====="

          find "$OUT" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          test -s "$OUT/main.ino.bin"
          test -s "$OUT/main.ino.bootloader.bin"
          test -s "$OUT/main.ino.partitions.bin"
          test -s "$OUT/main.ino.merged.bin"

          echo
          echo "ESP32 Main compilation succeeded."

      - name: Collect Main firmware images
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/main"

          cp \
            "$OUT/main.ino.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_APP.bin"

          cp \
            "$OUT/main.ino.bootloader.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_BOOTLOADER.bin"

          cp \
            "$OUT/main.ino.partitions.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_PARTITIONS.bin"

          cp \
            "$OUT/main.ino.merged.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin"

          echo
          echo "===== MAIN FIRMWARE IMAGES ====="

          ls -lh \
            "$OUT/SIBOAT_MAIN_ESP32_APP.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_BOOTLOADER.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_PARTITIONS.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin"

      - name: Create Main build information
        shell: bash
        run: |
          set -euo pipefail

          cat > output/main/build_info.txt <<EOF
          SIBOAT ESP32 MAIN FIRMWARE

          Source:
          A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

          Build wrapper:
          build/main/main.ino

          Build source:
          build/main/main_source.inc

          Board:
          ESP32

          FQBN:
          esp32:esp32:esp32:PartitionScheme=huge_app

          ESP32 Arduino Core:
          ${ESP32_CORE_VERSION}

          Arduino CLI:
          ${ARDUINO_CLI_VERSION}

          Git commit:
          ${GITHUB_SHA}

          Git branch:
          ${GITHUB_REF_NAME}

          Build time:
          $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          Main all-in-one image:
          SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin
          EOF

      - name: Create Main flash command
        shell: bash
        run: |
          set -euo pipefail

          cat > output/main/flash_command.txt <<'EOF'
          esptool --chip esp32 write-flash \
            0x0 SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin
          EOF

      - name: Verify Main artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            "output/main/SIBOAT_MAIN_ESP32_APP.bin"

          test -s \
            "output/main/SIBOAT_MAIN_ESP32_BOOTLOADER.bin"

          test -s \
            "output/main/SIBOAT_MAIN_ESP32_PARTITIONS.bin"

          test -s \
            "output/main/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin"

          test -s \
            "output/main/build_info.txt"

          test -s \
            "output/main/flash_command.txt"

          echo "All Main firmware artifacts verified."

      - name: Upload Main firmware
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_MAIN_ESP32_FIRMWARE
          path: |
            output/main/SIBOAT_MAIN_ESP32_APP.bin
            output/main/SIBOAT_MAIN_ESP32_BOOTLOADER.bin
            output/main/SIBOAT_MAIN_ESP32_PARTITIONS.bin
            output/main/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin
            output/main/build_info.txt
            output/main/flash_command.txt
          if-no-files-found: error


  # ============================================================
  # ESP32-CAM
  #
  # IMPORTANT:
  # This section intentionally follows the Build 36 CAM path.
  #
  # Do NOT replace the ZIP installation with manual unzip logic.
  # Build 37 failed specifically in that new preparation step.
  # ============================================================
  build-cam:
    name: Build ESP32-CAM
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Configure Arduino CLI
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            "${ESP32_BOARD_URL}"

          arduino-cli config set \
            library.enable_unsafe_install true

      - name: Update Arduino indexes
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli core update-index

      - name: Install ESP32 Arduino core
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli core install \
            "esp32:esp32@${ESP32_CORE_VERSION}"

      - name: Show CAM build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "===== ARDUINO CLI ====="
          arduino-cli version

          echo
          echo "===== ESP32 CORE ====="
          arduino-cli core list

      - name: Verify CAM source
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            "A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino"

          echo "CAM source found."

          ls -lh \
            "A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino"

      - name: Verify inference library
        shell: bash
        run: |
          set -euo pipefail

          test -f "siboat_inferencing.zip"

          echo "Inference library found."

          ls -lh "siboat_inferencing.zip"

      # ========================================================
      # THIS IS THE KNOWN-GOOD CAM LIBRARY INSTALLATION
      #
      # Do not manually unzip siboat_inferencing.zip.
      # ========================================================
      - name: Install inference library
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli lib install \
            --zip-path "siboat_inferencing.zip"

      - name: Prepare CAM sketch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/cam
          rm -rf output/cam

          mkdir -p build/cam
          mkdir -p output/cam

          cp \
            "A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino" \
            "build/cam/cam.ino"

          echo
          echo "===== CAM SKETCH ====="

          ls -lh build/cam/

      - name: Compile ESP32-CAM
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli compile \
            --clean \
            --fqbn "esp32:esp32:esp32cam:PartitionScheme=huge_app" \
            --export-binaries \
            --output-dir "output/cam" \
            "build/cam"

      - name: Verify CAM compiler output
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/cam"

          echo "===== CAM BUILD OUTPUT ====="

          find "$OUT" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          test -s "$OUT/cam.ino.bin"
          test -s "$OUT/cam.ino.bootloader.bin"
          test -s "$OUT/cam.ino.partitions.bin"
          test -s "$OUT/cam.ino.merged.bin"

          echo
          echo "ESP32-CAM compilation succeeded."

      - name: Collect CAM firmware images
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/cam"

          cp \
            "$OUT/cam.ino.bin" \
            "$OUT/SIBOAT_ESP32_CAM_APP.bin"

          cp \
            "$OUT/cam.ino.bootloader.bin" \
            "$OUT/SIBOAT_ESP32_CAM_BOOTLOADER.bin"

          cp \
            "$OUT/cam.ino.partitions.bin" \
            "$OUT/SIBOAT_ESP32_CAM_PARTITIONS.bin"

          cp \
            "$OUT/cam.ino.merged.bin" \
            "$OUT/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin"

          echo
          echo "===== CAM FIRMWARE IMAGES ====="

          ls -lh \
            "$OUT/SIBOAT_ESP32_CAM_APP.bin" \
            "$OUT/SIBOAT_ESP32_CAM_BOOTLOADER.bin" \
            "$OUT/SIBOAT_ESP32_CAM_PARTITIONS.bin" \
            "$OUT/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin"

      - name: Create CAM build information
        shell: bash
        run: |
          set -euo pipefail

          cat > output/cam/build_info.txt <<EOF
          SIBOAT ESP32-CAM FIRMWARE

          Source:
          A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

          Build wrapper:
          build/cam/cam.ino

          Board:
          ESP32-CAM

          FQBN:
          esp32:esp32:esp32cam:PartitionScheme=huge_app

          ESP32 Arduino Core:
          ${ESP32_CORE_VERSION}

          Arduino CLI:
          ${ARDUINO_CLI_VERSION}

          Inference library:
          siboat_inferencing.zip

          Git commit:
          ${GITHUB_SHA}

          Git branch:
          ${GITHUB_REF_NAME}

          Build time:
          $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          CAM all-in-one image:
          SIBOAT_ESP32_CAM_ALL-IN-ONE.bin
          EOF

      - name: Create CAM flash command
        shell: bash
        run: |
          set -euo pipefail

          cat > output/cam/flash_command.txt <<'EOF'
          esptool --chip esp32 write-flash \
            0x0 SIBOAT_ESP32_CAM_ALL-IN-ONE.bin
          EOF

      - name: Verify CAM artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            "output/cam/SIBOAT_ESP32_CAM_APP.bin"

          test -s \
            "output/cam/SIBOAT_ESP32_CAM_BOOTLOADER.bin"

          test -s \
            "output/cam/SIBOAT_ESP32_CAM_PARTITIONS.bin"

          test -s \
            "output/cam/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin"

          test -s \
            "output/cam/build_info.txt"

          test -s \
            "output/cam/flash_command.txt"

          echo "All CAM firmware artifacts verified."

      - name: Upload CAM firmware
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_ESP32_CAM_FIRMWARE
          path: |
            output/cam/SIBOAT_ESP32_CAM_APP.bin
            output/cam/SIBOAT_ESP32_CAM_BOOTLOADER.bin
            output/cam/SIBOAT_ESP32_CAM_PARTITIONS.bin
            output/cam/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin
            output/cam/build_info.txt
            output/cam/flash_command.txt
          if-no-files-found: error
