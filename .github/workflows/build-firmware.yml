name: Build SIBOAT ESP32 Firmware

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  ARDUINO_CLI_VERSION: "1.5.1"
  ESP32_CORE_VERSION: "3.3.5"
  ESP32_BOARD_URL: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"

jobs:

  # ==========================================================
  # ESP32 MAIN
  # ==========================================================
  build-main:
    name: Build ESP32 Main
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Configure Arduino CLI
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            "${ESP32_BOARD_URL}"

      - name: Update Arduino indexes
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core update-index

      - name: Install ESP32 Arduino core
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli core install \
            "esp32:esp32@${ESP32_CORE_VERSION}"

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "===== ARDUINO CLI ====="
          arduino-cli version

          echo
          echo "===== ESP32 CORE ====="
          arduino-cli core list

      - name: Verify Main firmware source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino"

          test -f "$SOURCE"

          echo "Main source:"
          ls -lh "$SOURCE"

          echo
          echo "===== CHECK REQUIRED DEFINITIONS ====="

          test "$(grep -c 'static void doEstop(bool active);' "$SOURCE")" -eq 1

          test "$(grep -c 'static void setStationary(bool on);' "$SOURCE")" -eq 1

          test "$(grep -c 'static void doEstop(bool active) {' "$SOURCE")" -eq 1

          test "$(grep -c 'static void setStationary(bool on) {' "$SOURCE")" -eq 1

          test "$(grep -c '#define FW_VERSION "1.3.1"' "$SOURCE")" -eq 1

          echo "doEstop() declaration: OK"
          echo "doEstop() definition:   OK"
          echo "setStationary() declaration: OK"
          echo "setStationary() definition:   OK"
          echo "Firmware version 1.3.1: OK"

      - name: Verify Main Wi-Fi profile order
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino"

          python3 - "$SOURCE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          required = [
              '{ "SIBOAT NETWORK",',
              '{ "bleach.",',
              '{ "Private Wifi",',
          ]

          positions = []

          for token in required:
              pos = text.find(token)

              if pos < 0:
                  raise SystemExit(
                      f"Missing required Wi-Fi profile token: {token}"
                  )

              positions.append(pos)

          if positions != sorted(positions):
              raise SystemExit(
                  "Wi-Fi profiles are not in the expected order."
              )

          print("Wi-Fi profile order verified.")
          PY

      - name: Verify Main discovery integration
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino"

          grep -q 'SIBOAT_DISCOVERY_DEVICE_ID' "$SOURCE"
          grep -q 'seabot_register_device' "$SOURCE"
          grep -q 'WiFiClientSecure' "$SOURCE"
          grep -q 'HTTPClient' "$SOURCE"

          echo "Discovery integration verified."

      - name: Prepare Main sketch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/main
          rm -rf output/main

          mkdir -p build/main
          mkdir -p output/main

          # IMPORTANT:
          # Do not place the complete firmware directly into a .ino file.
          # Arduino automatically preprocesses .ino files and generates
          # prototypes. The firmware contains user-defined structs and other
          # declarations for which that automatic preprocessing can fail.
          #
          # Put the real firmware in .inc and include it from a tiny .ino.
          cp \
            "A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino" \
            "build/main/main_source.inc"

          cat > build/main/main.ino <<'EOF'
          #include "main_source.inc"
          EOF

          test -f build/main/main.ino
          test -f build/main/main_source.inc

          echo "===== MAIN BUILD DIRECTORY ====="

          find build/main \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      - name: Compile ESP32 Main
        shell: bash
        run: |
          set -euo pipefail

          FQBN="esp32:esp32:esp32:PartitionScheme=huge_app"

          arduino-cli compile \
            --clean \
            --fqbn "$FQBN" \
            --export-binaries \
            --output-dir output/main \
            build/main

      - name: Verify Main compiler output
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/main"

          echo "===== MAIN BUILD OUTPUT ====="

          find "$OUT" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          test -s "$OUT/main.ino.bin"
          test -s "$OUT/main.ino.bootloader.bin"
          test -s "$OUT/main.ino.partitions.bin"
          test -s "$OUT/main.ino.merged.bin"

          echo
          echo "ESP32 Main compilation succeeded."

      - name: Collect Main firmware files
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/main"

          cp \
            "$OUT/main.ino.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_APP.bin"

          cp \
            "$OUT/main.ino.bootloader.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_BOOTLOADER.bin"

          cp \
            "$OUT/main.ino.partitions.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_PARTITIONS.bin"

          cp \
            "$OUT/main.ino.merged.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin"

      - name: Create Main build information
        shell: bash
        run: |
          set -euo pipefail

          cat > output/main/build_info.txt <<EOF
          SIBOAT MAIN ESP32 FIRMWARE

          Firmware version:
          1.3.1

          Source:
          A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

          Board:
          ESP32 Dev Module

          FQBN:
          esp32:esp32:esp32:PartitionScheme=huge_app

          Arduino CLI:
          ${ARDUINO_CLI_VERSION}

          ESP32 Arduino Core:
          ${ESP32_CORE_VERSION}

          Git commit:
          ${GITHUB_SHA}

          Git branch:
          ${GITHUB_REF_NAME}

          Build time:
          $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          Main all-in-one image:
          SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin
          EOF

      - name: Create Main flash command
        shell: bash
        run: |
          set -euo pipefail

          cat > output/main/flash_command.txt <<'EOF'
          esptool --chip esp32 write-flash \
            0x0 SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin
          EOF

      - name: Verify Main artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -s "output/main/SIBOAT_MAIN_ESP32_APP.bin"
          test -s "output/main/SIBOAT_MAIN_ESP32_BOOTLOADER.bin"
          test -s "output/main/SIBOAT_MAIN_ESP32_PARTITIONS.bin"
          test -s "output/main/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin"
          test -s "output/main/build_info.txt"
          test -s "output/main/flash_command.txt"

          echo "All Main firmware artifacts verified."

      - name: Upload Main firmware
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_MAIN_ESP32_FIRMWARE
          path: |
            output/main/SIBOAT_MAIN_ESP32_APP.bin
            output/main/SIBOAT_MAIN_ESP32_BOOTLOADER.bin
            output/main/SIBOAT_MAIN_ESP32_PARTITIONS.bin
            output/main/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin
            output/main/build_info.txt
            output/main/flash_command.txt
          if-no-files-found: error
          compression-level: 0


  # ==========================================================
  # ESP32-CAM
  # ==========================================================
  build-cam:
    name: Build ESP32-CAM
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Configure Arduino CLI
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            "${ESP32_BOARD_URL}"

          arduino-cli config set \
            library.enable_unsafe_install true

      - name: Update Arduino indexes
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli core update-index

      - name: Install ESP32 Arduino core
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli core install \
            "esp32:esp32@${ESP32_CORE_VERSION}"

      - name: Show CAM build environment
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli version
          echo
          arduino-cli core list

      - name: Verify CAM source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino"

          test -f "$SOURCE"

          echo "CAM source found:"
          ls -lh "$SOURCE"

      - name: Verify CAM inference library
        shell: bash
        run: |
          set -euo pipefail

          test -f "siboat_inferencing.zip"

          echo "Inference library:"
          ls -lh "siboat_inferencing.zip"

      - name: Prepare CAM inference library
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/cam
          rm -rf build/cam_lib
          rm -rf output/cam

          mkdir -p build/cam
          mkdir -p build/cam_lib
          mkdir -p output/cam

          unzip -q \
            "siboat_inferencing.zip" \
            -d build/cam_lib

          mapfile -t LIB_PROPS < <(
            find build/cam_lib \
              -type f \
              -name "library.properties" \
              -not -path "*/examples/*" \
              -print \
              | sort
          )

          if [ "${#LIB_PROPS[@]}" -ne 1 ]; then
            echo "Expected exactly one library.properties file."
            printf '%s\n' "${LIB_PROPS[@]}"
            exit 1
          fi

          LIBDIR="$(dirname "${LIB_PROPS[0]}")"

          test -f "$LIBDIR/siboat_inferencing.h"
          test -f "$LIBDIR/edge-impulse-sdk/dsp/image/image.hpp"

          echo "CAM inference library verified:"
          echo "$LIBDIR"

          cp -R "$LIBDIR" build/cam_lib/installed

      - name: Prepare CAM sketch
        shell: bash
        run: |
          set -euo pipefail

          cp \
            "A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino" \
            "build/cam/cam_source.inc"

          cat > build/cam/cam.ino <<'EOF'
          #include "cam_source.inc"
          EOF

          test -f build/cam/cam.ino
          test -f build/cam/cam_source.inc

      - name: Compile ESP32-CAM
        shell: bash
        run: |
          set -euo pipefail

          FQBN="esp32:esp32:esp32cam:PartitionScheme=huge_app"

          arduino-cli compile \
            --clean \
            --fqbn "$FQBN" \
            --library "$PWD/build/cam_lib/installed" \
            --export-binaries \
            --output-dir output/cam \
            build/cam

      - name: Verify CAM compiler output
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/cam"

          echo "===== CAM BUILD OUTPUT ====="

          find "$OUT" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          test -s "$OUT/cam.ino.bin"
          test -s "$OUT/cam.ino.bootloader.bin"
          test -s "$OUT/cam.ino.partitions.bin"
          test -s "$OUT/cam.ino.merged.bin"

          echo "ESP32-CAM compilation succeeded."

      - name: Collect CAM firmware files
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/cam"

          cp \
            "$OUT/cam.ino.bin" \
            "$OUT/SIBOAT_ESP32_CAM_APP.bin"

          cp \
            "$OUT/cam.ino.bootloader.bin" \
            "$OUT/SIBOAT_ESP32_CAM_BOOTLOADER.bin"

          cp \
            "$OUT/cam.ino.partitions.bin" \
            "$OUT/SIBOAT_ESP32_CAM_PARTITIONS.bin"

          cp \
            "$OUT/cam.ino.merged.bin" \
            "$OUT/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin"

      - name: Create CAM build information
        shell: bash
        run: |
          set -euo pipefail

          cat > output/cam/build_info.txt <<EOF
          SIBOAT ESP32-CAM FIRMWARE

          Source:
          A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

          Board:
          AI Thinker ESP32-CAM

          FQBN:
          esp32:esp32:esp32cam:PartitionScheme=huge_app

          Arduino CLI:
          ${ARDUINO_CLI_VERSION}

          ESP32 Arduino Core:
          ${ESP32_CORE_VERSION}

          Git commit:
          ${GITHUB_SHA}

          Git branch:
          ${GITHUB_REF_NAME}

          Build time:
          $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          CAM all-in-one image:
          SIBOAT_ESP32_CAM_ALL-IN-ONE.bin
          EOF

      - name: Create CAM flash command
        shell: bash
        run: |
          set -euo pipefail

          cat > output/cam/flash_command.txt <<'EOF'
          esptool --chip esp32 write-flash \
            0x0 SIBOAT_ESP32_CAM_ALL-IN-ONE.bin
          EOF

      - name: Verify CAM artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -s "output/cam/SIBOAT_ESP32_CAM_APP.bin"
          test -s "output/cam/SIBOAT_ESP32_CAM_BOOTLOADER.bin"
          test -s "output/cam/SIBOAT_ESP32_CAM_PARTITIONS.bin"
          test -s "output/cam/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin"
          test -s "output/cam/build_info.txt"
          test -s "output/cam/flash_command.txt"

          echo "All CAM firmware artifacts verified."

      - name: Upload CAM firmware
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_ESP32_CAM_FIRMWARE
          path: |
            output/cam/SIBOAT_ESP32_CAM_APP.bin
            output/cam/SIBOAT_ESP32_CAM_BOOTLOADER.bin
            output/cam/SIBOAT_ESP32_CAM_PARTITIONS.bin
            output/cam/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin
            output/cam/build_info.txt
            output/cam/flash_command.txt
          if-no-files-found: error
          compression-level: 0
