name: Build SIBOAT Main ESP32 + ESP32-CAM Firmware

on:
  push:
    branches:
      - main
    paths:
      - "A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino"
      - "A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino"
      - "siboat_inferencing.zip"
      - ".github/workflows/build-firmware.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  ARDUINO_CLI_VERSION: "1.5.1"
  ESP32_CORE_VERSION: "3.3.5"
  ESP32_BOARD_URL: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"

jobs:

  # ============================================================
  # MAIN ESP32
  # ============================================================

  build-main:

    name: Compile SIBOAT Main ESP32

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Configure Arduino CLI
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            "${ESP32_BOARD_URL}"

      - name: Update Arduino indexes
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli core update-index

      - name: Install ESP32 Arduino Core
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli core install \
            "esp32:esp32@${ESP32_CORE_VERSION}"

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ARDUINO CLI"
          echo "=========================================="

          arduino-cli version

          echo
          echo "=========================================="
          echo "ESP32 CORE"
          echo "=========================================="

          arduino-cli core list

      - name: Verify Main firmware
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino"

          test -s "$SOURCE"

          grep -q 'FW_VERSION "1.3.1"' "$SOURCE"

          echo "Main firmware source verified."

      - name: Prepare Main sketch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/main
          rm -rf output/main

          mkdir -p build/main
          mkdir -p output/main

          cp \
            "A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino" \
            "build/main/main_source.inc"

          cat > build/main/main.ino <<'EOF'
          #include "main_source.inc"
          EOF

          echo "Prepared Main sketch:"
          find build/main -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Compile Main ESP32
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli compile \
            --clean \
            --warnings all \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app" \
            --export-binaries \
            --output-dir "output/main" \
            "build/main"

      - name: Verify Main compiler output
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/main"

          echo "=========================================="
          echo "MAIN ESP32 COMPILER OUTPUT"
          echo "=========================================="

          find "$OUT" -maxdepth 1 -type f -printf '%f\n' | sort

          test -s "$OUT/main.ino.bin"
          test -s "$OUT/main.ino.bootloader.bin"
          test -s "$OUT/main.ino.partitions.bin"
          test -s "$OUT/main.ino.merged.bin"

          echo "Main ESP32 compilation successful."

      - name: Rename Main firmware images
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/main"

          cp "$OUT/main.ino.bin" \
             "$OUT/SIBOAT_MAIN_ESP32_APP.bin"

          cp "$OUT/main.ino.bootloader.bin" \
             "$OUT/SIBOAT_MAIN_ESP32_BOOTLOADER.bin"

          cp "$OUT/main.ino.partitions.bin" \
             "$OUT/SIBOAT_MAIN_ESP32_PARTITIONS.bin"

          cp "$OUT/main.ino.merged.bin" \
             "$OUT/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin"

      - name: Generate Main build information
        shell: bash
        run: |
          set -euo pipefail

          cat > output/main/BUILD_INFORMATION.txt <<EOF
          SIBOAT MAIN ESP32 FIRMWARE

          Source:
          A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

          Board:
          ESP32 Dev Module

          FQBN:
          esp32:esp32:esp32:PartitionScheme=huge_app

          Arduino CLI:
          ${ARDUINO_CLI_VERSION}

          ESP32 Arduino Core:
          ${ESP32_CORE_VERSION}

          Git commit:
          ${GITHUB_SHA}

          Git branch:
          ${GITHUB_REF_NAME}

          Build date:
          $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          Recommended flash image:
          SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin

          Recommended flash address:
          0x0
          EOF

      - name: Generate Main flashing instructions
        shell: bash
        run: |
          set -euo pipefail

          cat > output/main/FLASH_INSTRUCTIONS.txt <<'EOF'
          SIBOAT MAIN ESP32

          Recommended image:
          SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin

          Flash address:
          0x0

          Board:
          ESP32 Dev Module

          Separate image offsets, if required:

          Bootloader:
          0x1000

          Partition table:
          0x8000

          boot_app0:
          0xE000

          Application:
          0x10000

          Use images from the same GitHub Actions build only.
          EOF

      - name: Generate Main checksums
        shell: bash
        run: |
          set -euo pipefail

          cd output/main

          sha256sum \
            SIBOAT_MAIN_ESP32_APP.bin \
            SIBOAT_MAIN_ESP32_BOOTLOADER.bin \
            SIBOAT_MAIN_ESP32_PARTITIONS.bin \
            SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Create Main flash package
        shell: bash
        run: |
          set -euo pipefail

          cd output/main

          zip -9 \
            SIBOAT_MAIN_ESP32_FLASH_PACKAGE.zip \
            SIBOAT_MAIN_ESP32_APP.bin \
            SIBOAT_MAIN_ESP32_BOOTLOADER.bin \
            SIBOAT_MAIN_ESP32_PARTITIONS.bin \
            SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin \
            BUILD_INFORMATION.txt \
            FLASH_INSTRUCTIONS.txt \
            SHA256SUMS.txt

      - name: Upload Main ESP32 firmware
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_MAIN_ESP32_FIRMWARE
          path: |
            output/main/SIBOAT_MAIN_ESP32_APP.bin
            output/main/SIBOAT_MAIN_ESP32_BOOTLOADER.bin
            output/main/SIBOAT_MAIN_ESP32_PARTITIONS.bin
            output/main/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin
            output/main/BUILD_INFORMATION.txt
            output/main/FLASH_INSTRUCTIONS.txt
            output/main/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Upload Main flash package
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_MAIN_ESP32_FLASH_PACKAGE
          path: output/main/SIBOAT_MAIN_ESP32_FLASH_PACKAGE.zip
          if-no-files-found: error
          compression-level: 0


  # ============================================================
  # ESP32-CAM
  # ============================================================

  build-cam:

    name: Compile SIBOAT ESP32-CAM

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Configure Arduino CLI
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            "${ESP32_BOARD_URL}"

      - name: Update Arduino indexes
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli core update-index

      - name: Install ESP32 Arduino Core
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli core install \
            "esp32:esp32@${ESP32_CORE_VERSION}"

      - name: Verify CAM firmware
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino"

          test -s "$SOURCE"

          grep -q 'CAM_FW_VERSION "1.3.0"' "$SOURCE"
          grep -q 'siboat_inferencing.h' "$SOURCE"

          test -s "siboat_inferencing.zip"

          echo "ESP32-CAM firmware source verified."
          echo "Edge Impulse library archive verified."

      - name: Install Edge Impulse SIBOAT library
        shell: bash
        run: |
          set -euo pipefail

          rm -rf libraries
          mkdir -p libraries

          unzip -q \
            "siboat_inferencing.zip" \
            -d libraries

          echo "Extracted Edge Impulse library:"
          find libraries -maxdepth 3 -type f \
            \( -name "siboat_inferencing.h" -o -name "library.properties" \) \
            -print

          test -n "$(find libraries -name 'siboat_inferencing.h' -print -quit)"

      - name: Locate Edge Impulse library
        shell: bash
        run: |
          set -euo pipefail

          EI_HEADER="$(find libraries \
            -name 'siboat_inferencing.h' \
            -print -quit)"

          test -n "$EI_HEADER"

          EI_DIR="$(dirname "$EI_HEADER")"

          echo "Edge Impulse header:"
          echo "$EI_HEADER"

          echo "Edge Impulse library directory:"
          echo "$EI_DIR"

          echo "EI_DIR=$EI_DIR" >> "$GITHUB_ENV"

      - name: Prepare ESP32-CAM sketch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/cam
          rm -rf output/cam

          mkdir -p build/cam
          mkdir -p output/cam

          cp \
            "A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino" \
            "build/cam/cam.ino"

          echo "Prepared CAM sketch:"
          find build/cam -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Compile ESP32-CAM
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli compile \
            --clean \
            --warnings all \
            --fqbn "esp32:esp32:esp32cam:PartitionScheme=huge_app" \
            --libraries "$EI_DIR" \
            --export-binaries \
            --output-dir "output/cam" \
            "build/cam"

      - name: Verify CAM compiler output
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/cam"

          echo "=========================================="
          echo "ESP32-CAM COMPILER OUTPUT"
          echo "=========================================="

          find "$OUT" -maxdepth 1 -type f -printf '%f\n' | sort

          test -s "$OUT/cam.ino.bin"
          test -s "$OUT/cam.ino.bootloader.bin"
          test -s "$OUT/cam.ino.partitions.bin"
          test -s "$OUT/cam.ino.merged.bin"

          echo "ESP32-CAM compilation successful."

      - name: Rename CAM firmware images
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/cam"

          cp "$OUT/cam.ino.bin" \
             "$OUT/SIBOAT_CAM_ESP32_APP.bin"

          cp "$OUT/cam.ino.bootloader.bin" \
             "$OUT/SIBOAT_CAM_ESP32_BOOTLOADER.bin"

          cp "$OUT/cam.ino.partitions.bin" \
             "$OUT/SIBOAT_CAM_ESP32_PARTITIONS.bin"

          cp "$OUT/cam.ino.merged.bin" \
             "$OUT/SIBOAT_CAM_ESP32_ALL-IN-ONE.bin"

      - name: Generate CAM build information
        shell: bash
        run: |
          set -euo pipefail

          cat > output/cam/BUILD_INFORMATION.txt <<EOF
          SIBOAT ESP32-CAM FIRMWARE

          Source:
          A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

          Board:
          AI Thinker ESP32-CAM

          FQBN:
          esp32:esp32:esp32cam:PartitionScheme=huge_app

          Arduino CLI:
          ${ARDUINO_CLI_VERSION}

          ESP32 Arduino Core:
          ${ESP32_CORE_VERSION}

          Edge Impulse library:
          siboat_inferencing.zip

          Git commit:
          ${GITHUB_SHA}

          Git branch:
          ${GITHUB_REF_NAME}

          Build date:
          $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          Recommended flash image:
          SIBOAT_CAM_ESP32_ALL-IN-ONE.bin

          Recommended flash address:
          0x0
          EOF

      - name: Generate CAM flashing instructions
        shell: bash
        run: |
          set -euo pipefail

          cat > output/cam/FLASH_INSTRUCTIONS.txt <<'EOF'
          SIBOAT ESP32-CAM

          Board:
          AI Thinker ESP32-CAM

          Recommended image:
          SIBOAT_CAM_ESP32_ALL-IN-ONE.bin

          Flash address:
          0x0

          Partition scheme:
          Huge APP

          PSRAM:
          Enabled

          Use images from the same GitHub Actions build only.
          EOF

      - name: Generate CAM checksums
        shell: bash
        run: |
          set -euo pipefail

          cd output/cam

          sha256sum \
            SIBOAT_CAM_ESP32_APP.bin \
            SIBOAT_CAM_ESP32_BOOTLOADER.bin \
            SIBOAT_CAM_ESP32_PARTITIONS.bin \
            SIBOAT_CAM_ESP32_ALL-IN-ONE.bin \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Create CAM flash package
        shell: bash
        run: |
          set -euo pipefail

          cd output/cam

          zip -9 \
            SIBOAT_CAM_ESP32_FLASH_PACKAGE.zip \
            SIBOAT_CAM_ESP32_APP.bin \
            SIBOAT_CAM_ESP32_BOOTLOADER.bin \
            SIBOAT_CAM_ESP32_PARTITIONS.bin \
            SIBOAT_CAM_ESP32_ALL-IN-ONE.bin \
            BUILD_INFORMATION.txt \
            FLASH_INSTRUCTIONS.txt \
            SHA256SUMS.txt

      - name: Upload ESP32-CAM firmware
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_CAM_ESP32_FIRMWARE
          path: |
            output/cam/SIBOAT_CAM_ESP32_APP.bin
            output/cam/SIBOAT_CAM_ESP32_BOOTLOADER.bin
            output/cam/SIBOAT_CAM_ESP32_PARTITIONS.bin
            output/cam/SIBOAT_CAM_ESP32_ALL-IN-ONE.bin
            output/cam/BUILD_INFORMATION.txt
            output/cam/FLASH_INSTRUCTIONS.txt
            output/cam/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Upload CAM flash package
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_CAM_ESP32_FLASH_PACKAGE
          path: output/cam/SIBOAT_CAM_ESP32_FLASH_PACKAGE.zip
          if-no-files-found: error
          compression-level: 0
