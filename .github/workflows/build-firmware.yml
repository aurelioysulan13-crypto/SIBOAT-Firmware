on:
  push:
    branches:
      - main
      - master
    paths:
      - "
name: Build SIBOAT Main ESP32 Firmware

on:
  push:
    branches:
      - main
      - master
    paths:
      - "A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino"
      - ".github/workflows/build-siboat-main-esp32.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  ARDUINO_CLI_VERSION: "1.5.1"
  ESP32_CORE_VERSION: "3.3.5"
  ESP32_BOARD_URL: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"

jobs:

  # ============================================================
  # BUILD SIBOAT MAIN ESP32
  # ============================================================

  build-main:

    name: Compile SIBOAT Main ESP32
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # --------------------------------------------------------
      # 1. CHECKOUT SOURCE CODE
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. INSTALL ARDUINO CLI
      # --------------------------------------------------------

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      # --------------------------------------------------------
      # 3. CONFIGURE ESP32 BOARD PACKAGE
      # --------------------------------------------------------

      - name: Configure Arduino CLI
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            "${ESP32_BOARD_URL}"

      # --------------------------------------------------------
      # 4. UPDATE BOARD INDEX
      # --------------------------------------------------------

      - name: Update Arduino indexes
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli core update-index

      # --------------------------------------------------------
      # 5. INSTALL ESP32 CORE 3.3.5
      # --------------------------------------------------------

      - name: Install ESP32 Arduino Core
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli core install \
            "esp32:esp32@${ESP32_CORE_VERSION}"

      # --------------------------------------------------------
      # 6. VERIFY BUILD ENVIRONMENT
      # --------------------------------------------------------

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ARDUINO CLI VERSION"
          echo "=========================================="

          arduino-cli version

          echo
          echo "=========================================="
          echo "INSTALLED ESP32 CORE"
          echo "=========================================="

          arduino-cli core list

      # --------------------------------------------------------
      # 7. VERIFY MAIN FIRMWARE SOURCE
      # --------------------------------------------------------

      - name: Verify Main firmware source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino"

          if [ ! -s "$SOURCE" ]; then
            echo "ERROR: Main ESP32 firmware source is missing."
            exit 1
          fi

          echo "Main firmware source found."

          ls -lh "$SOURCE"

          # Confirm the expected firmware identity.
          grep -q 'FW_VERSION "1.3.1"' "$SOURCE"

          echo "Firmware identity check passed."

      # --------------------------------------------------------
      # 8. PREPARE ARDUINO SKETCH
      #
      # The source is included as .inc to avoid Arduino IDE
      # automatic prototype generation for custom data types.
      # --------------------------------------------------------

      - name: Prepare Main ESP32 sketch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/main
          rm -rf output/main

          mkdir -p build/main
          mkdir -p output/main

          cp \
            "A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino" \
            "build/main/main_source.inc"

          # ----------------------------------------------------
          # Apply the established StringSumHelper compatibility
          # transformation used by the existing repository build.
          #
          # The source must contain exactly one matching expression.
          # ----------------------------------------------------

          python3 <<'PY'
          from pathlib import Path

          source = Path("build/main/main_source.inc")

          text = source.read_text(encoding="utf-8")

          old = (
              '    sendJson(409, '
              'String("{\\"ok\\":false,\\"applied\\":false,\\"error\\":\\"") '
              '+ why + "\\"}");'
          )

          new = (
              '    String errBody = '
              'String("{\\"ok\\":false,\\"applied\\":false,\\"error\\":\\"") '
              '+ why + "\\"}";\n'
              '    sendJson(409, errBody.c_str());'
          )

          count = text.count(old)

          if count != 1:
              raise RuntimeError(
                  "Expected exactly one StringSumHelper expression. "
                  f"Found: {count}"
              )

          text = text.replace(old, new, 1)

          source.write_text(text, encoding="utf-8")

          print("Main firmware source prepared successfully.")
          print("Compiler compatibility transformation applied.")
          PY

          # Arduino compilation wrapper.
          cat > build/main/main.ino <<'EOF'
          #include "main_source.inc"
          EOF

          echo
          echo "Prepared sketch files:"

          find build/main -maxdepth 1 -type f -printf '%f\n' | sort

      # --------------------------------------------------------
      # 9. COMPILE MAIN ESP32 FIRMWARE
      #
      # Board: ESP32 Dev Module
      # Partition: huge_app
      # Core: 3.3.5
      # --------------------------------------------------------

      - name: Compile Main ESP32 firmware
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli compile \
            --clean \
            --warnings all \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app" \
            --export-binaries \
            --output-dir "output/main" \
            "build/main"

      # --------------------------------------------------------
      # 10. VERIFY COMPILER OUTPUT
      # --------------------------------------------------------

      - name: Verify compiled firmware images
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/main"

          echo "=========================================="
          echo "COMPILER OUTPUT"
          echo "=========================================="

          find "$OUT" -maxdepth 1 -type f -printf '%f\n' | sort

          test -s "$OUT/main.ino.bin"
          test -s "$OUT/main.ino.bootloader.bin"
          test -s "$OUT/main.ino.partitions.bin"
          test -s "$OUT/main.ino.merged.bin"

          echo
          echo "All required compiler images exist."

      # --------------------------------------------------------
      # 11. CREATE FLASH-READY BIN FILES
      # --------------------------------------------------------

      - name: Collect Main ESP32 firmware images
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/main"

          cp \
            "$OUT/main.ino.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_APP.bin"

          cp \
            "$OUT/main.ino.bootloader.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_BOOTLOADER.bin"

          cp \
            "$OUT/main.ino.partitions.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_PARTITIONS.bin"

          cp \
            "$OUT/main.ino.merged.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin"

          echo
          echo "=========================================="
          echo "SIBOAT MAIN ESP32 FIRMWARE IMAGES"
          echo "=========================================="

          ls -lh \
            "$OUT/SIBOAT_MAIN_ESP32_APP.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_BOOTLOADER.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_PARTITIONS.bin" \
            "$OUT/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin"

      # --------------------------------------------------------
      # 12. GENERATE BUILD INFORMATION
      # --------------------------------------------------------

      - name: Generate build information
        shell: bash
        run: |
          set -euo pipefail

          cat > output/main/BUILD_INFORMATION.txt <<EOF
          SIBOAT MAIN ESP32 FIRMWARE

          Firmware source:
          A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

          Board:
          ESP32 Dev Module

          FQBN:
          esp32:esp32:esp32:PartitionScheme=huge_app

          Arduino CLI:
          ${ARDUINO_CLI_VERSION}

          ESP32 Arduino Core:
          ${ESP32_CORE_VERSION}

          Git commit:
          ${GITHUB_SHA}

          Git branch:
          ${GITHUB_REF_NAME}

          Build date:
          $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          FLASH-READY MERGED IMAGE:
          SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin

          FLASH ADDRESS:
          0x0

          IMPORTANT:
          The merged image contains the bootloader,
          partition table, boot_app0 where applicable,
          and application image at their required offsets.

          Flash the merged image at 0x0.
          Do not flash the merged image together with
          the separate component images.
          EOF

      # --------------------------------------------------------
      # 13. GENERATE FLASHING INSTRUCTIONS
      # --------------------------------------------------------

      - name: Generate flashing instructions
        shell: bash
        run: |
          set -euo pipefail

          cat > output/main/FLASH_INSTRUCTIONS.txt <<'EOF'
          SIBOAT MAIN ESP32 FLASHING INSTRUCTIONS

          Recommended image:
          SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin

          Flash address:
          0x0

          Board:
          ESP32 Dev Module

          Recommended settings:
          Chip: ESP32
          Flash mode: DIO
          Baud rate: 460800 (reduce if flashing fails)
          Flash address: 0x0

          IMPORTANT:
          1. Select the ALL-IN-ONE image.
          2. Set its flash address to 0x0.
          3. Do not compile the INO in the flashing software.
          4. Do not combine the merged image with component images.
          5. After flashing, open Serial Monitor at 115200 baud.
          6. Verify Wi-Fi connection and the actual IP address.

          Separate component image offsets, if needed:

          Bootloader:      0x1000
          Partition table: 0x8000
          boot_app0:       0xE000
          Application:     0x10000

          Use only images from this same build run.
          EOF

      # --------------------------------------------------------
      # 14. GENERATE CHECKSUMS
      # --------------------------------------------------------

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail

          cd output/main

          sha256sum \
            SIBOAT_MAIN_ESP32_APP.bin \
            SIBOAT_MAIN_ESP32_BOOTLOADER.bin \
            SIBOAT_MAIN_ESP32_PARTITIONS.bin \
            SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      # --------------------------------------------------------
      # 15. CREATE COMPLETE FLASH PACKAGE ZIP
      # --------------------------------------------------------

      - name: Create Main ESP32 flash package
        shell: bash
        run: |
          set -euo pipefail

          cd output/main

          zip -9 \
            SIBOAT_MAIN_ESP32_FLASH_PACKAGE.zip \
            SIBOAT_MAIN_ESP32_APP.bin \
            SIBOAT_MAIN_ESP32_BOOTLOADER.bin \
            SIBOAT_MAIN_ESP32_PARTITIONS.bin \
            SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin \
            BUILD_INFORMATION.txt \
            FLASH_INSTRUCTIONS.txt \
            SHA256SUMS.txt

          echo
          echo "Flash package created."

          ls -lh SIBOAT_MAIN_ESP32_FLASH_PACKAGE.zip

      # --------------------------------------------------------
      # 16. FINAL ARTIFACT VALIDATION
      # --------------------------------------------------------

      - name: Final firmware validation
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/main"

          test -s "$OUT/SIBOAT_MAIN_ESP32_APP.bin"
          test -s "$OUT/SIBOAT_MAIN_ESP32_BOOTLOADER.bin"
          test -s "$OUT/SIBOAT_MAIN_ESP32_PARTITIONS.bin"
          test -s "$OUT/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin"
          test -s "$OUT/SIBOAT_MAIN_ESP32_FLASH_PACKAGE.zip"
          test -s "$OUT/BUILD_INFORMATION.txt"
          test -s "$OUT/FLASH_INSTRUCTIONS.txt"
          test -s "$OUT/SHA256SUMS.txt"

          unzip -t "$OUT/SIBOAT_MAIN_ESP32_FLASH_PACKAGE.zip"

          echo
          echo "=========================================="
          echo "SIBOAT MAIN ESP32 BUILD SUCCESSFUL"
          echo "=========================================="

      # --------------------------------------------------------
      # 17. UPLOAD INDIVIDUAL FIRMWARE ARTIFACTS
      # --------------------------------------------------------

      - name: Upload Main ESP32 firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_MAIN_ESP32_FIRMWARE
          path: |
            output/main/SIBOAT_MAIN_ESP32_APP.bin
            output/main/SIBOAT_MAIN_ESP32_BOOTLOADER.bin
            output/main/SIBOAT_MAIN_ESP32_PARTITIONS.bin
            output/main/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin
            output/main/BUILD_INFORMATION.txt
            output/main/FLASH_INSTRUCTIONS.txt
            output/main/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

      # --------------------------------------------------------
      # 18. UPLOAD COMPLETE FLASH PACKAGE
      # --------------------------------------------------------

      - name: Upload Main ESP32 flash package
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_MAIN_ESP32_FLASH_PACKAGE
          path: |
            output/main/SIBOAT_MAIN_ESP32_FLASH_PACKAGE.zip
          if-no-files-found: error
          compression-level: 0
"
      - ".github/workflows/build-siboat-main-esp32.yml"

