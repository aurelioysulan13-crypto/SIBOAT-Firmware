name: Build SIBOAT ESP32 Firmware

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:

  # ============================================================
  # ESP32 MAIN
  # ============================================================
  build-main:
    name: Build ESP32 Main Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Initialize Arduino CLI
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Update Arduino indexes
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core update-index

      - name: Install ESP32 Arduino core 3.3.5
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli core install esp32:esp32@3.3.5

      - name: Show toolchain information
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Arduino CLI ==="
          arduino-cli version

          echo
          echo "=== Installed cores ==="
          arduino-cli core list

      - name: Verify Main firmware source
        shell: bash
        run: |
          set -euo pipefail

          test -f A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

          echo "Main firmware source found:"
          ls -lh A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

      - name: Prepare Main sketch directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/main

          cp \
            A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino \
            build/main/A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

      - name: Compile ESP32 Main
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output/main

          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app" \
            --export-binaries \
            --output-dir output/main \
            build/main

      - name: Collect Main binaries
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/main"

          echo "=== Compiler output ==="
          find "$OUT" -maxdepth 1 -type f -printf '%f\n' | sort

          APP="$(find "$OUT" -maxdepth 1 -type f -name '*.bin' \
            ! -name '*bootloader*' \
            ! -name '*partitions*' \
            ! -name '*boot_app0*' \
            | head -n 1)"

          BOOT="$(find "$OUT" -maxdepth 1 -type f -name '*bootloader*.bin' | head -n 1)"
          PART="$(find "$OUT" -maxdepth 1 -type f -name '*partitions*.bin' | head -n 1)"
          BOOT_APP0="$(find "$OUT" -maxdepth 1 -type f -name '*boot_app0*.bin' | head -n 1)"

          test -n "$APP"
          test -n "$BOOT"
          test -n "$PART"
          test -n "$BOOT_APP0"

          cp "$APP" "$OUT/SIBOAT_MAIN_ESP32_APP.bin"
          cp "$BOOT" "$OUT/SIBOAT_MAIN_ESP32_BOOTLOADER.bin"
          cp "$PART" "$OUT/SIBOAT_MAIN_ESP32_PARTITIONS.bin"
          cp "$BOOT_APP0" "$OUT/SIBOAT_MAIN_ESP32_BOOT_APP0.bin"

      - name: Create Main all-in-one binary
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          out = Path("output/main")

          boot = (out / "SIBOAT_MAIN_ESP32_BOOTLOADER.bin").read_bytes()
          part = (out / "SIBOAT_MAIN_ESP32_PARTITIONS.bin").read_bytes()
          app = (out / "SIBOAT_MAIN_ESP32_APP.bin").read_bytes()
          boot_app0 = (out / "SIBOAT_MAIN_ESP32_BOOT_APP0.bin").read_bytes()

          def pad_to(data, address):
              if len(data) > address:
                  raise SystemExit(
                      f"Binary is larger than target address: "
                      f"{len(data)} > {address}"
                  )

              return data + bytes(address - len(data))

          image = bytearray()

          # ESP32 flash layout:
          # 0x1000 bootloader
          # 0x8000 partition table
          # 0xE000 boot_app0
          # 0x10000 application

          image += pad_to(boot, 0x1000)

          if len(image) < 0x8000:
              image += bytes(0x8000 - len(image))

          image += part

          if len(image) < 0xE000:
              image += bytes(0xE000 - len(image))

          image += boot_app0

          if len(image) < 0x10000:
              image += bytes(0x10000 - len(image))

          image += app

          target = out / "SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin"
          target.write_bytes(image)

          print(
              f"Created {target} "
              f"({target.stat().st_size} bytes)"
          )
          PY

      - name: Create Main build information
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/main"

          cat > "$OUT/build_info.txt" <<EOF
          SIBOAT ESP32 MAIN FIRMWARE

          Board:
          ESP32 Dev Module

          FQBN:
          esp32:esp32:esp32:PartitionScheme=huge_app

          ESP32 Arduino Core:
          3.3.5

          Source:
          A1a_ESP32_MAIN_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

          Git commit:
          ${GITHUB_SHA}

          Git branch:
          ${GITHUB_REF_NAME}

          Build date:
          $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          Flash addresses:

          0x1000  SIBOAT_MAIN_ESP32_BOOTLOADER.bin
          0x8000  SIBOAT_MAIN_ESP32_PARTITIONS.bin
          0xE000  SIBOAT_MAIN_ESP32_BOOT_APP0.bin
          0x10000 SIBOAT_MAIN_ESP32_APP.bin
          EOF

      - name: Package Main flash files
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/main"

          cat > "$OUT/flash_command.txt" <<'EOF'
          esptool.py --chip esp32 write_flash \
            0x1000 SIBOAT_MAIN_ESP32_BOOTLOADER.bin \
            0x8000 SIBOAT_MAIN_ESP32_PARTITIONS.bin \
            0xe000 SIBOAT_MAIN_ESP32_BOOT_APP0.bin \
            0x10000 SIBOAT_MAIN_ESP32_APP.bin
          EOF

          mkdir -p "$OUT/SIBOAT_MAIN_ESP32_FLASH_PACKAGE"

          cp "$OUT"/SIBOAT_MAIN_ESP32_*.bin \
            "$OUT/SIBOAT_MAIN_ESP32_FLASH_PACKAGE/"

          cp "$OUT/flash_command.txt" \
            "$OUT/SIBOAT_MAIN_ESP32_FLASH_PACKAGE/"

          cp "$OUT/build_info.txt" \
            "$OUT/SIBOAT_MAIN_ESP32_FLASH_PACKAGE/"

      - name: Upload Main firmware
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_MAIN_ESP32_FIRMWARE
          path: |
            output/main/SIBOAT_MAIN_ESP32_APP.bin
            output/main/SIBOAT_MAIN_ESP32_BOOTLOADER.bin
            output/main/SIBOAT_MAIN_ESP32_PARTITIONS.bin
            output/main/SIBOAT_MAIN_ESP32_BOOT_APP0.bin
            output/main/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin
            output/main/build_info.txt
          if-no-files-found: error

      - name: Upload Main flash package
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_MAIN_ESP32_FLASH_PACKAGE
          path: output/main/SIBOAT_MAIN_ESP32_FLASH_PACKAGE
          if-no-files-found: error


  # ============================================================
  # ESP32-CAM
  # ============================================================
  build-cam:
    name: Build ESP32-CAM Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Initialize Arduino CLI
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json

          arduino-cli config set library.enable_unsafe_install true

      - name: Update Arduino indexes
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core update-index

      - name: Install ESP32 Arduino core 3.3.5
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli core install esp32:esp32@3.3.5

      - name: Show toolchain information
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Arduino CLI ==="
          arduino-cli version

          echo
          echo "=== Installed cores ==="
          arduino-cli core list

      - name: Verify CAM firmware source
        shell: bash
        run: |
          set -euo pipefail

          test -f A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

          echo "CAM firmware source found:"
          ls -lh A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

      - name: Verify Edge Impulse library
        shell: bash
        run: |
          set -euo pipefail

          test -f siboat_inferencing.zip

          echo "Edge Impulse library found:"
          ls -lh siboat_inferencing.zip

      - name: Install Edge Impulse inference library
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli lib install \
            --zip-path siboat_inferencing.zip

      - name: Prepare CAM sketch directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/cam

          cp \
            A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino \
            build/cam/A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

      - name: Compile ESP32-CAM
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output/cam

          arduino-cli compile \
            --fqbn "esp32:esp32:esp32cam:PartitionScheme=huge_app" \
            --export-binaries \
            --output-dir output/cam \
            build/cam

      - name: Collect CAM binaries
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/cam"

          echo "=== Compiler output ==="
          find "$OUT" -maxdepth 1 -type f -printf '%f\n' | sort

          APP="$(find "$OUT" -maxdepth 1 -type f -name '*.bin' \
            ! -name '*bootloader*' \
            ! -name '*partitions*' \
            ! -name '*boot_app0*' \
            | head -n 1)"

          BOOT="$(find "$OUT" -maxdepth 1 -type f -name '*bootloader*.bin' | head -n 1)"
          PART="$(find "$OUT" -maxdepth 1 -type f -name '*partitions*.bin' | head -n 1)"
          BOOT_APP0="$(find "$OUT" -maxdepth 1 -type f -name '*boot_app0*.bin' | head -n 1)"

          test -n "$APP"
          test -n "$BOOT"
          test -n "$PART"
          test -n "$BOOT_APP0"

          cp "$APP" "$OUT/SIBOAT_ESP32_CAM_APP.bin"
          cp "$BOOT" "$OUT/SIBOAT_ESP32_CAM_BOOTLOADER.bin"
          cp "$PART" "$OUT/SIBOAT_ESP32_CAM_PARTITIONS.bin"
          cp "$BOOT_APP0" "$OUT/SIBOAT_ESP32_CAM_BOOT_APP0.bin"

      - name: Create CAM all-in-one binary
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          out = Path("output/cam")

          boot = (out / "SIBOAT_ESP32_CAM_BOOTLOADER.bin").read_bytes()
          part = (out / "SIBOAT_ESP32_CAM_PARTITIONS.bin").read_bytes()
          app = (out / "SIBOAT_ESP32_CAM_APP.bin").read_bytes()
          boot_app0 = (out / "SIBOAT_ESP32_CAM_BOOT_APP0.bin").read_bytes()

          def pad_to(data, address):
              if len(data) > address:
                  raise SystemExit(
                      f"Binary is larger than target address: "
                      f"{len(data)} > {address}"
                  )

              return data + bytes(address - len(data))

          image = bytearray()

          # ESP32 flash layout:
          # 0x1000 bootloader
          # 0x8000 partition table
          # 0xE000 boot_app0
          # 0x10000 application

          image += pad_to(boot, 0x1000)

          if len(image) < 0x8000:
              image += bytes(0x8000 - len(image))

          image += part

          if len(image) < 0xE000:
              image += bytes(0xE000 - len(image))

          image += boot_app0

          if len(image) < 0x10000:
              image += bytes(0x10000 - len(image))

          image += app

          target = out / "SIBOAT_ESP32_CAM_ALL-IN-ONE.bin"
          target.write_bytes(image)

          print(
              f"Created {target} "
              f"({target.stat().st_size} bytes)"
          )
          PY

      - name: Create CAM build information
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/cam"

          cat > "$OUT/build_info.txt" <<EOF
          SIBOAT ESP32-CAM FIRMWARE

          Board:
          ESP32-CAM

          FQBN:
          esp32:esp32:esp32cam:PartitionScheme=huge_app

          ESP32 Arduino Core:
          3.3.5

          Source:
          A1b_ESP32_CAM_FIRMWARE_SSID_CONFIGURED_DISCOVERY.ino

          Edge Impulse library:
          siboat_inferencing.zip

          Git commit:
          ${GITHUB_SHA}

          Git branch:
          ${GITHUB_REF_NAME}

          Build date:
          $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          Flash addresses:

          0x1000  SIBOAT_ESP32_CAM_BOOTLOADER.bin
          0x8000  SIBOAT_ESP32_CAM_PARTITIONS.bin
          0xE000  SIBOAT_ESP32_CAM_BOOT_APP0.bin
          0x10000 SIBOAT_ESP32_CAM_APP.bin
          EOF

      - name: Package CAM flash files
        shell: bash
        run: |
          set -euo pipefail

          OUT="output/cam"

          cat > "$OUT/flash_command.txt" <<'EOF'
          esptool.py --chip esp32 write_flash \
            0x1000 SIBOAT_ESP32_CAM_BOOTLOADER.bin \
            0x8000 SIBOAT_ESP32_CAM_PARTITIONS.bin \
            0xe000 SIBOAT_ESP32_CAM_BOOT_APP0.bin \
            0x10000 SIBOAT_ESP32_CAM_APP.bin
          EOF

          mkdir -p "$OUT/SIBOAT_ESP32_CAM_FLASH_PACKAGE"

          cp "$OUT"/SIBOAT_ESP32_CAM_*.bin \
            "$OUT/SIBOAT_ESP32_CAM_FLASH_PACKAGE/"

          cp "$OUT/flash_command.txt" \
            "$OUT/SIBOAT_ESP32_CAM_FLASH_PACKAGE/"

          cp "$OUT/build_info.txt" \
            "$OUT/SIBOAT_ESP32_CAM_FLASH_PACKAGE/"

      - name: Upload CAM firmware
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_ESP32_CAM_FIRMWARE
          path: |
            output/cam/SIBOAT_ESP32_CAM_APP.bin
            output/cam/SIBOAT_ESP32_CAM_BOOTLOADER.bin
            output/cam/SIBOAT_ESP32_CAM_PARTITIONS.bin
            output/cam/SIBOAT_ESP32_CAM_BOOT_APP0.bin
            output/cam/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin
            output/cam/build_info.txt
          if-no-files-found: error

      - name: Upload CAM flash package
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_ESP32_CAM_FLASH_PACKAGE
          path: output/cam/SIBOAT_ESP32_CAM_FLASH_PACKAGE
          if-no-files-found: error
