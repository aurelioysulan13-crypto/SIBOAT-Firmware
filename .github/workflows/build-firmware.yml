name: Build SIBOAT Firmware

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  ESP32_CORE: "3.3.5"
  ESP32_INDEX_URL: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"

jobs:

  # ==========================================================
  # MAIN ESP32
  # ==========================================================
  build-main:

    name: Build MAIN ESP32
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Arduino CLI
      # ------------------------------------------------------
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # ------------------------------------------------------
      # ESP32 Arduino core 3.3.5
      # ------------------------------------------------------
      - name: Install ESP32 core
        shell: bash
        run: |
          set -e

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            "$ESP32_INDEX_URL"

          arduino-cli core update-index \
            --additional-urls "$ESP32_INDEX_URL"

          arduino-cli core install \
            "esp32:esp32@${ESP32_CORE}" \
            --additional-urls "$ESP32_INDEX_URL"

          arduino-cli core list

      # ------------------------------------------------------
      # Prepare MAIN firmware
      #
      # The .cpp wrapper prevents Arduino's automatic .ino
      # prototype generation from breaking the user-defined
      # structures in the large firmware.
      # ------------------------------------------------------
      - name: Prepare MAIN firmware
        shell: bash
        run: |
          set -e

          rm -rf build_work
          mkdir -p build_work/siboat_main
          mkdir -p build_work/source

          cp \
            A1a_ESP32_MAIN_FIRMWARE_UPDATED_WIFI.ino \
            build_work/source/siboat_main.cpp

          cat > build_work/siboat_main/siboat_main.ino <<'EOF'
          #include "../source/siboat_main.cpp"
          EOF

          echo "MAIN sketch:"
          find build_work/siboat_main -type f -maxdepth 1 -print

          echo ""
          echo "MAIN source:"
          ls -lh build_work/source/siboat_main.cpp

      # ------------------------------------------------------
      # Compile MAIN
      # ------------------------------------------------------
      - name: Compile MAIN ESP32
        shell: bash
        run: |
          set -o pipefail

          mkdir -p output/main

          echo "=============================================="
          echo "SIBOAT MAIN ESP32 BUILD"
          echo "=============================================="
          echo ""
          echo "Core:"
          echo "$ESP32_CORE"
          echo ""
          echo "Board:"
          echo "esp32:esp32:esp32:PartitionScheme=huge_app"
          echo ""

          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app" \
            --output-dir output/main/build \
            --export-binaries \
            --warnings none \
            --clean \
            build_work/siboat_main \
            2>&1 | tee output/main/compile.log

      # ------------------------------------------------------
      # Collect MAIN files
      # ------------------------------------------------------
      - name: Collect MAIN binaries
        if: always()
        shell: bash
        run: |
          set -e

          OUT="output/main"
          BUILD="output/main/build"

          echo "Generated files:"
          find "$BUILD" -type f 2>/dev/null | sort || true

          APP="$(find "$BUILD" \
            -type f \
            -name 'siboat_main.ino.bin' \
            -print -quit 2>/dev/null || true)"

          BOOT="$(find "$BUILD" \
            -type f \
            -name '*.bootloader.bin' \
            -print -quit 2>/dev/null || true)"

          PART="$(find "$BUILD" \
            -type f \
            -name '*.partitions.bin' \
            -print -quit 2>/dev/null || true)"

          BOOT_APP0="$(find \
            "$HOME/.arduino15/packages/esp32" \
            -type f \
            -path '*/tools/partitions/boot_app0.bin' \
            -print -quit 2>/dev/null || true)"

          echo ""
          echo "APP:"
          echo "$APP"

          echo "BOOTLOADER:"
          echo "$BOOT"

          echo "PARTITIONS:"
          echo "$PART"

          echo "BOOT_APP0:"
          echo "$BOOT_APP0"

          if [ -n "$APP" ]; then
            cp "$APP" \
              "$OUT/SIBOAT_MAIN_ESP32_APP.bin"
          else
            echo "::error::MAIN application binary was not produced."
          fi

          if [ -n "$BOOT" ]; then
            cp "$BOOT" \
              "$OUT/SIBOAT_MAIN_ESP32_BOOTLOADER.bin"
          else
            echo "::error::MAIN bootloader binary was not produced."
          fi

          if [ -n "$PART" ]; then
            cp "$PART" \
              "$OUT/SIBOAT_MAIN_ESP32_PARTITIONS.bin"
          else
            echo "::error::MAIN partition binary was not produced."
          fi

          if [ -n "$BOOT_APP0" ]; then
            cp "$BOOT_APP0" \
              "$OUT/SIBOAT_MAIN_ESP32_BOOT_APP0.bin"
          else
            echo "::error::boot_app0.bin was not found."
          fi

          echo ""
          echo "Collected MAIN files:"
          find "$OUT" -maxdepth 1 -type f -print | sort

      # ------------------------------------------------------
      # esptool
      # ------------------------------------------------------
      - name: Install esptool
        shell: bash
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            esptool

          python3 -m esptool version

      # ------------------------------------------------------
      # MAIN merged firmware
      # ------------------------------------------------------
      - name: Create MAIN ALL-IN-ONE firmware
        if: success()
        shell: bash
        run: |
          set -e

          OUT="output/main"

          python3 -m esptool \
            --chip esp32 \
            merge-bin \
            -o "$OUT/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin" \
            0x1000 "$OUT/SIBOAT_MAIN_ESP32_BOOTLOADER.bin" \
            0x8000 "$OUT/SIBOAT_MAIN_ESP32_PARTITIONS.bin" \
            0xE000 "$OUT/SIBOAT_MAIN_ESP32_BOOT_APP0.bin" \
            0x10000 "$OUT/SIBOAT_MAIN_ESP32_APP.bin"

          echo ""
          echo "MAIN ALL-IN-ONE:"
          ls -lh "$OUT/SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin"

      # ------------------------------------------------------
      # MAIN flash map
      # ------------------------------------------------------
      - name: Create MAIN flash map
        if: always()
        shell: bash
        run: |
          mkdir -p output/main

          cat > output/main/flash_map.txt <<'EOF'
          SIBOAT MAIN ESP32 FLASH MAP

          For individual files:

          bootloader.bin  -> 0x1000
          partitions.bin  -> 0x8000
          boot_app0.bin   -> 0xE000
          application.bin -> 0x10000

          For ALL-IN-ONE:

          SIBOAT_MAIN_ESP32_ALL-IN-ONE.bin -> 0x0000
          EOF

      # ------------------------------------------------------
      # MAIN ZIP
      # ------------------------------------------------------
      - name: Package MAIN firmware
        if: always()
        shell: bash
        run: |
          set -e

          cd output/main

          zip -9 \
            ../SIBOAT_MAIN_ESP32_FLASH_PACKAGE.zip \
            *.bin \
            flash_map.txt \
            compile.log \
            2>/dev/null || true

          cd ../..

          echo "MAIN package:"
          ls -lh output/SIBOAT_MAIN_ESP32_FLASH_PACKAGE.zip \
            2>/dev/null || true

      # ------------------------------------------------------
      # MAIN artifact
      # ------------------------------------------------------
      - name: Upload MAIN firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_MAIN_ESP32_FIRMWARE
          path: output/main/
          if-no-files-found: warn


  # ==========================================================
  # ESP32-CAM
  # ==========================================================
  build-cam:

    name: Build ESP32-CAM
    runs-on: ubuntu-latest

    timeout-minutes: 90

    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Arduino CLI
      # ------------------------------------------------------
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # ------------------------------------------------------
      # ESP32 Arduino core 3.3.5
      # ------------------------------------------------------
      - name: Install ESP32 core
        shell: bash
        run: |
          set -e

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            "$ESP32_INDEX_URL"

          arduino-cli core update-index \
            --additional-urls "$ESP32_INDEX_URL"

          arduino-cli core install \
            "esp32:esp32@${ESP32_CORE}" \
            --additional-urls "$ESP32_INDEX_URL"

          arduino-cli core list

      # ------------------------------------------------------
      # Prepare Edge Impulse library
      # ------------------------------------------------------
      - name: Prepare SIBOAT Edge Impulse library
        shell: bash
        run: |
          set -e

          rm -rf build_work
          mkdir -p build_work/siboat_cam
          mkdir -p build_work/source
          mkdir -p build_work/libs

          test -f siboat_inferencing.zip

          unzip -q \
            siboat_inferencing.zip \
            -d build_work/libs

          LIBDIR="$(find \
            build_work/libs \
            -type f \
            -name library.properties \
            -not -path '*/examples/*' \
            -print -quit \
            | xargs -r dirname)"

          if [ -z "$LIBDIR" ]; then
            echo "::error::library.properties was not found."
            exit 1
          fi

          HEADER="$(find \
            "$LIBDIR" \
            -type f \
            -name siboat_inferencing.h \
            -print -quit)"

          IMAGE_HPP="$(find \
            "$LIBDIR" \
            -type f \
            -path '*/edge-impulse-sdk/dsp/image/image.hpp' \
            -print -quit)"

          if [ -z "$HEADER" ]; then
            echo "::error::siboat_inferencing.h was not found."
            exit 1
          fi

          if [ -z "$IMAGE_HPP" ]; then
            echo "::error::edge-impulse-sdk/dsp/image/image.hpp was not found."
            exit 1
          fi

          mkdir -p build_work/library/siboat_inferencing

          cp -R \
            "$LIBDIR"/. \
            build_work/library/siboat_inferencing/

          echo "Edge Impulse library:"
          find build_work/library/siboat_inferencing \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -200

      # ------------------------------------------------------
      # Prepare CAM firmware
      #
      # IMPORTANT:
      # Folder = siboat_cam
      # Main .ino = siboat_cam.ino
      #
      # These names MUST match.
      # ------------------------------------------------------
      - name: Prepare CAM firmware
        shell: bash
        run: |
          set -e

          cp \
            A1b_ESP32_CAM_FIRMWARE_UPDATED_WIFI.ino \
            build_work/source/siboat_cam.cpp

          cat > build_work/siboat_cam/siboat_cam.ino <<'EOF'
          #include "../source/siboat_cam.cpp"
          EOF

          echo "CAM sketch:"
          find build_work/siboat_cam -type f -maxdepth 1 -print

      # ------------------------------------------------------
      # Compile CAM
      # ------------------------------------------------------
      - name: Compile ESP32-CAM
        shell: bash
        run: |
          set -o pipefail

          mkdir -p output/cam

          echo "=============================================="
          echo "SIBOAT ESP32-CAM BUILD"
          echo "=============================================="
          echo ""
          echo "Core:"
          echo "$ESP32_CORE"
          echo ""
          echo "Board:"
          echo "esp32:esp32:esp32cam:PartitionScheme=huge_app"
          echo ""

          arduino-cli compile \
            --fqbn "esp32:esp32:esp32cam:PartitionScheme=huge_app" \
            --library "$PWD/build_work/library/siboat_inferencing" \
            --output-dir output/cam/build \
            --export-binaries \
            --warnings none \
            --clean \
            build_work/siboat_cam \
            2>&1 | tee output/cam/compile.log

      # ------------------------------------------------------
      # Collect CAM binaries
      # ------------------------------------------------------
      - name: Collect CAM binaries
        if: always()
        shell: bash
        run: |
          set -e

          OUT="output/cam"
          BUILD="output/cam/build"

          echo "Generated files:"
          find "$BUILD" -type f 2>/dev/null | sort || true

          APP="$(find "$BUILD" \
            -type f \
            -name 'siboat_cam.ino.bin' \
            -print -quit 2>/dev/null || true)"

          BOOT="$(find "$BUILD" \
            -type f \
            -name '*.bootloader.bin' \
            -print -quit 2>/dev/null || true)"

          PART="$(find "$BUILD" \
            -type f \
            -name '*.partitions.bin' \
            -print -quit 2>/dev/null || true)"

          BOOT_APP0="$(find \
            "$HOME/.arduino15/packages/esp32" \
            -type f \
            -path '*/tools/partitions/boot_app0.bin' \
            -print -quit 2>/dev/null || true)"

          echo ""
          echo "APP:"
          echo "$APP"

          echo "BOOTLOADER:"
          echo "$BOOT"

          echo "PARTITIONS:"
          echo "$PART"

          echo "BOOT_APP0:"
          echo "$BOOT_APP0"

          if [ -n "$APP" ]; then
            cp "$APP" \
              "$OUT/SIBOAT_ESP32_CAM_APP.bin"
          else
            echo "::error::CAM application binary was not produced."
          fi

          if [ -n "$BOOT" ]; then
            cp "$BOOT" \
              "$OUT/SIBOAT_ESP32_CAM_BOOTLOADER.bin"
          else
            echo "::error::CAM bootloader binary was not produced."
          fi

          if [ -n "$PART" ]; then
            cp "$PART" \
              "$OUT/SIBOAT_ESP32_CAM_PARTITIONS.bin"
          else
            echo "::error::CAM partition binary was not produced."
          fi

          if [ -n "$BOOT_APP0" ]; then
            cp "$BOOT_APP0" \
              "$OUT/SIBOAT_ESP32_CAM_BOOT_APP0.bin"
          else
            echo "::error::boot_app0.bin was not found."
          fi

          echo ""
          echo "Collected CAM files:"
          find "$OUT" -maxdepth 1 -type f -print | sort

      # ------------------------------------------------------
      # esptool
      # ------------------------------------------------------
      - name: Install esptool
        shell: bash
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            esptool

          python3 -m esptool version

      # ------------------------------------------------------
      # CAM merged firmware
      # ------------------------------------------------------
      - name: Create CAM ALL-IN-ONE firmware
        if: success()
        shell: bash
        run: |
          set -e

          OUT="output/cam"

          python3 -m esptool \
            --chip esp32 \
            merge-bin \
            -o "$OUT/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin" \
            0x1000 "$OUT/SIBOAT_ESP32_CAM_BOOTLOADER.bin" \
            0x8000 "$OUT/SIBOAT_ESP32_CAM_PARTITIONS.bin" \
            0xE000 "$OUT/SIBOAT_ESP32_CAM_BOOT_APP0.bin" \
            0x10000 "$OUT/SIBOAT_ESP32_CAM_APP.bin"

          echo ""
          echo "CAM ALL-IN-ONE:"
          ls -lh "$OUT/SIBOAT_ESP32_CAM_ALL-IN-ONE.bin"

      # ------------------------------------------------------
      # CAM flash map
      # ------------------------------------------------------
      - name: Create CAM flash map
        if: always()
        shell: bash
        run: |
          mkdir -p output/cam

          cat > output/cam/flash_map.txt <<'EOF'
          SIBOAT ESP32-CAM FLASH MAP

          For individual files:

          bootloader.bin  -> 0x1000
          partitions.bin  -> 0x8000
          boot_app0.bin   -> 0xE000
          application.bin -> 0x10000

          For ALL-IN-ONE:

          SIBOAT_ESP32_CAM_ALL-IN-ONE.bin -> 0x0000
          EOF

      # ------------------------------------------------------
      # CAM ZIP
      # ------------------------------------------------------
      - name: Package CAM firmware
        if: always()
        shell: bash
        run: |
          set -e

          cd output/cam

          zip -9 \
            ../SIBOAT_ESP32_CAM_FLASH_PACKAGE.zip \
            *.bin \
            flash_map.txt \
            compile.log \
            2>/dev/null || true

          cd ../..

          echo "CAM package:"
          ls -lh output/SIBOAT_ESP32_CAM_FLASH_PACKAGE.zip \
            2>/dev/null || true

      # ------------------------------------------------------
      # CAM artifact
      # ------------------------------------------------------
      - name: Upload CAM firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT_ESP32_CAM_FIRMWARE
          path: output/cam/
          if-no-files-found: warn
